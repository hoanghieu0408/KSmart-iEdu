<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KSmart iEdu · Phân hệ Công việc</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* =========================================================================
   KSmart iEdu — Phân hệ Công việc — Design tokens (BRD/SRS mục 6)
   ========================================================================= */
:root{
  /* --- Bảng màu (mục 6.2) --- */
  --ks-navy:#182B57;
  --ks-primary:#1677E8;
  --ks-primary-hover:#125CB9;
  --ks-primary-disabled:#BBD8F7;
  --ks-page:#F5F8FD;
  --ks-table-head:#D7E6FB;
  --ks-border:#B8DBFF;
  --ks-text:#1E293B;
  --ks-muted:#64748B;
  --ks-success:#39A845;
  --ks-warning:#D99319;
  --ks-danger:#E7485C;

  /* --- Shell (mục 6.1) --- */
  --ks-rail-bg:#F1F5F9;
  --ks-rail-border:#E5EBF4;
  --ks-menu-bg:#FFFFFF;
  --ks-menu-selected:#E8EEF8;
  --ks-topbar-bg:#F8FAFD;
  --ks-white:#FFFFFF;
  --ks-hover-blue:#EAF4FF;
  --ks-focus:0 0 0 3px rgba(22,119,232,.14);

  /* --- Kích thước shell --- */
  --rail-w:66px;
  --menu-w:262px;
  --topbar-h:52px;
  --gutter:24px;

  /* --- Bo góc / spacing --- */
  --r-card:8px;
  --r-input:8px;
  --r-search:20px;
  --r-pill:999px;

  /* --- Chip trạng thái (mục 6.4) --- */
  --st-draft-bg:#F3F6FA;   --st-draft-bd:#CBD5E1; --st-draft-tx:#64748B;
  --st-new-bg:#EAF4FF;     --st-new-bd:#9CCBFF;   --st-new-tx:#1677E8;
  --st-prog-bg:#E8F3FF;    --st-prog-bd:#72B5FF;  --st-prog-tx:#125CB9;
  --st-review-bg:#FFF7E8;  --st-review-bd:#F4C969;--st-review-tx:#A86600;
  --st-done-bg:#F0FBEA;    --st-done-bd:#A8E38F;  --st-done-tx:#39A845;
  --st-over-bg:#FFF0F2;    --st-over-bd:#FFA9B8;  --st-over-tx:#D9364F;
  --st-stop-bg:#F3F4F6;    --st-stop-bd:#D1D5DB;  --st-stop-tx:#6B7280;
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:"Be Vietnam Pro",Arial,sans-serif;
  font-size:14px;line-height:20px;font-weight:400;
  color:var(--ks-text);
  background:var(--ks-page);
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
svg{display:block;flex:none;}
::placeholder{color:var(--ks-muted);}

/* Scrollbar mảnh cho vùng cuộn */
.scroll::-webkit-scrollbar{width:10px;height:10px;}
.scroll::-webkit-scrollbar-thumb{background:#c9d8ec;border-radius:8px;border:2px solid transparent;background-clip:content-box;}
.scroll::-webkit-scrollbar-thumb:hover{background:#a9c1e0;background-clip:content-box;}

/* =========================================================================
   APP SHELL
   ========================================================================= */
.layout{
  display:grid;
  grid-template-columns:var(--rail-w) var(--menu-w) 1fr;
  grid-template-rows:var(--topbar-h) 1fr;
  height:100vh;min-width:1280px;
}

/* --- Top bar --- */
.topbar{
  grid-column:1 / -1;grid-row:1;
  display:flex;align-items:center;
  background:var(--ks-topbar-bg);
  border-bottom:1px solid var(--ks-rail-border);
  position:relative;z-index:30;
}
.topbar .logo-box{
  width:var(--rail-w);height:100%;
  display:flex;align-items:center;justify-content:center;
  color:var(--ks-primary);
}
.topbar .brand{
  width:calc(var(--menu-w) - var(--rail-w));
  display:flex;align-items:center;gap:8px;padding-left:2px;
}
.brand .brand-mark{
  width:30px;height:30px;border-radius:8px;
  background:linear-gradient(135deg,#1677E8,#125CB9);
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:17px;flex:none;
  box-shadow:0 2px 6px rgba(22,119,232,.35);
}
.brand .brand-name{font-weight:700;font-size:17px;color:var(--ks-navy);white-space:nowrap;}
.topbar .top-right{margin-left:auto;display:flex;align-items:center;gap:8px;padding-right:20px;}
.top-select{
  display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;
  border-radius:var(--r-pill);color:var(--ks-navy);font-weight:600;font-size:13px;
  background:transparent;border:1px solid transparent;white-space:nowrap;
}
.top-select:hover{background:#eef4fc;}
.top-select .muted{color:var(--ks-muted);}
.top-user{
  display:flex;align-items:center;gap:10px;height:40px;padding:0 10px 0 8px;
  border-radius:var(--r-pill);border:1px solid transparent;background:transparent;
}
.top-user:hover{background:#eef4fc;}
.top-user .ava{
  width:30px;height:30px;border-radius:50%;flex:none;
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px;
  background:#1677E8;
}
.top-user .who{display:flex;flex-direction:column;line-height:1.15;text-align:left;}
.top-user .who b{font-size:12.5px;color:var(--ks-navy);font-weight:700;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.top-user .who span{font-size:11px;color:var(--ks-muted);}

/* --- Utility rail --- */
.rail{
  grid-column:1;grid-row:2;
  background:var(--ks-rail-bg);
  border-right:1px solid var(--ks-rail-border);
  display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:4px;
}
.rail-item{
  width:56px;padding:8px 0;border:none;background:transparent;border-radius:10px;
  display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ks-muted);
}
.rail-item span{font-size:10px;font-weight:500;line-height:1.1;text-align:center;}
.rail-item:hover{background:#e5ecf6;color:var(--ks-navy);}
.rail-item.active{background:#e0ecfb;color:var(--ks-primary);}
.rail-item.active svg{color:var(--ks-primary);}
.rail-spacer{flex:1;}

/* --- Secondary menu --- */
.sidemenu{
  grid-column:2;grid-row:2;
  background:var(--ks-menu-bg);
  border-right:1px solid var(--ks-rail-border);
  display:flex;flex-direction:column;overflow:hidden;
}
.sidemenu .sm-head{padding:14px 16px 10px;}
.sidemenu .sm-sub{font-size:13px;color:var(--ks-muted);font-weight:600;}
.sm-scroll{flex:1;overflow-y:auto;padding:4px 10px 10px;}
.sm-group{margin-bottom:2px;}
.sm-group>.sm-grp-btn{
  width:100%;display:flex;align-items:center;gap:10px;padding:10px 10px;border:none;background:transparent;
  border-radius:8px;color:var(--ks-navy);font-weight:600;font-size:13.5px;text-align:left;
}
.sm-group>.sm-grp-btn:hover{background:#f2f6fc;}
.sm-group>.sm-grp-btn .chev{margin-left:auto;color:var(--ks-muted);transition:transform .18s;}
.sm-group.collapsed .sm-grp-btn .chev{transform:rotate(-90deg);}
.sm-group.collapsed .sm-children{display:none;}
.sm-children{padding:2px 0 6px 0;}
.sm-child{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:9px 10px 9px 34px;border:none;background:transparent;border-radius:8px;
  color:var(--ks-text);font-size:13.5px;font-weight:500;
}
.sm-child:hover{background:#f2f6fc;}
.sm-child.active{background:var(--ks-menu-selected);color:var(--ks-navy);font-weight:700;}
.sm-child .badge{margin-left:auto;font-size:10px;font-weight:700;color:var(--ks-muted);background:#eef1f6;border-radius:999px;padding:1px 7px;}
.sm-child.disabled{color:#a9b4c4;cursor:default;}
.sm-child.disabled:hover{background:transparent;}
.sidemenu .sm-foot{border-top:1px solid var(--ks-rail-border);padding:10px 14px;}
.sm-foot button{display:flex;align-items:center;gap:8px;border:none;background:transparent;color:var(--ks-muted);font-size:13px;font-weight:500;}

/* =========================================================================
   CONTENT AREA
   ========================================================================= */
.content{grid-column:3;grid-row:2;overflow:auto;}
.content-inner{padding:20px var(--gutter) 40px;min-width:1040px;}

.page-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:16px;}
.page-title{font-size:32px;line-height:40px;font-weight:700;color:var(--ks-navy);margin:0;}
.page-actions{margin-left:auto;display:flex;gap:10px;}

/* --- Buttons --- */
.btn{
  height:34px;padding:0 16px;border-radius:var(--r-pill);font-size:13.5px;font-weight:600;
  display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;white-space:nowrap;
  transition:background .14s,border-color .14s,color .14s;
}
.btn-primary{background:var(--ks-primary);color:#fff;}
.btn-primary:hover{background:var(--ks-primary-hover);}
.btn-primary:disabled,.btn-primary.disabled{background:var(--ks-primary-disabled);cursor:not-allowed;}
.btn-outline{background:#fff;border-color:var(--ks-border);color:var(--ks-primary);}
.btn-outline:hover{background:var(--ks-hover-blue);}
.btn-ghost{background:transparent;color:var(--ks-navy);}
.btn-ghost:hover{background:#eef4fc;}
.btn-danger{background:var(--ks-danger);color:#fff;}
.btn-danger:hover{background:#cf3549;}
.btn-danger-outline{background:#fff;border-color:#f4c2ca;color:var(--ks-danger);}
.btn-danger-outline:hover{background:#fff3f5;}
.btn-success{background:var(--ks-success);color:#fff;}
.btn-success:hover{background:#2f9139;}
.btn-sm{height:30px;padding:0 12px;font-size:13px;}
.btn:disabled{opacity:.55;cursor:not-allowed;}

/* Icon-only button */
.icon-btn{
  width:34px;height:34px;border-radius:var(--r-pill);border:1px solid var(--ks-border);
  background:#fff;color:var(--ks-primary);display:inline-flex;align-items:center;justify-content:center;
}
.icon-btn:hover{background:var(--ks-hover-blue);}
.icon-btn.plain{border-color:transparent;background:transparent;color:var(--ks-muted);}
.icon-btn.plain:hover{background:#eef2f8;color:var(--ks-navy);}

/* --- Quick scope chips (mục 5.2 / Table 11) --- */
.scope-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.scope-chip{
  height:32px;padding:0 14px;border-radius:var(--r-pill);border:1px solid var(--ks-border);
  background:#fff;color:var(--ks-navy);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;
}
.scope-chip:hover{background:var(--ks-hover-blue);}
.scope-chip.active{background:var(--ks-primary);border-color:var(--ks-primary);color:#fff;}
.scope-chip .cnt{font-size:11px;font-weight:700;background:rgba(0,0,0,.06);border-radius:999px;padding:1px 7px;}
.scope-chip.active .cnt{background:rgba(255,255,255,.25);}

/* =========================================================================
   TABLE CARD
   ========================================================================= */
.table-card{
  background:var(--ks-white);border:1px solid var(--ks-border);border-radius:var(--r-card);
  overflow:hidden;
}
.table-toolbar{display:flex;align-items:center;gap:12px;padding:14px 16px;}
.search-box{position:relative;flex:1;max-width:560px;}
.search-box .s-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ks-muted);}
.search-box input{
  width:100%;height:40px;border-radius:var(--r-search);border:1px solid var(--ks-border);
  padding:0 14px 0 42px;font-size:14px;color:var(--ks-text);background:#fff;outline:none;
}
.search-box input:focus{border-color:var(--ks-primary);box-shadow:var(--ks-focus);}
.toolbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
.filter-btn{
  height:40px;padding:0 16px;border-radius:var(--r-pill);border:1px solid var(--ks-border);
  background:#fff;color:var(--ks-primary);font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:8px;
}
.filter-btn:hover{background:var(--ks-hover-blue);}
.filter-btn .fcount{background:var(--ks-primary);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px;}
.cog-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--ks-border);background:#fff;color:var(--ks-muted);display:inline-flex;align-items:center;justify-content:center;}
.cog-btn:hover{background:var(--ks-hover-blue);color:var(--ks-primary);}

/* Active filter tags */
.active-filters{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 12px;}
.active-filters:empty{display:none;}
.filter-tag{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 6px 0 12px;border-radius:999px;background:#eef4fc;color:var(--ks-navy);font-size:12.5px;font-weight:600;}
.filter-tag button{border:none;background:transparent;color:var(--ks-muted);display:flex;padding:2px;border-radius:50%;}
.filter-tag button:hover{background:#dbe6f5;color:var(--ks-navy);}
.clear-all{border:none;background:transparent;color:var(--ks-primary);font-weight:600;font-size:12.5px;}
.clear-all:hover{text-decoration:underline;}

/* --- Table --- */
.table-wrap{overflow-x:auto;}
table.ks-table{width:100%;border-collapse:collapse;min-width:1140px;}
.ks-table thead th{
  background:var(--ks-table-head);color:var(--ks-navy);font-size:14px;font-weight:700;text-align:left;
  padding:11px 12px;white-space:nowrap;border-bottom:1px solid var(--ks-border);
}
.ks-table thead th.sortable{cursor:pointer;user-select:none;}
.ks-table thead th .th-in{display:inline-flex;align-items:center;gap:6px;}
.ks-table thead th .sort-ic{color:#6f9fd8;}
.ks-table tbody td{padding:12px;border-bottom:1px solid #EAF1FA;vertical-align:middle;font-size:14px;}
.ks-table tbody tr:last-child td{border-bottom:none;}
.ks-table tbody tr:hover{background:#F7FAFF;}
.ks-table tbody tr.row-click{cursor:pointer;}
.col-cb{width:44px;text-align:center;}
.col-stt{width:54px;color:var(--ks-muted);}
.col-act{width:120px;}
.th-center,.td-center{text-align:center;}

.cb{width:18px;height:18px;border:1.5px solid #b9c6d8;border-radius:5px;background:#fff;display:inline-flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;flex:none;}
.cb.checked{background:var(--ks-primary);border-color:var(--ks-primary);}
.cb svg{width:13px;height:13px;opacity:0;}
.cb.checked svg{opacity:1;}

/* task title cell */
.task-cell .t-title{font-weight:600;color:var(--ks-text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35;max-width:340px;}
.task-cell .t-code{font-size:13px;color:var(--ks-muted);margin-top:3px;display:flex;align-items:center;gap:8px;}
.prio-dot{width:8px;height:8px;border-radius:50%;flex:none;}
.prio-low{background:#94a3b8;} .prio-normal{background:#3f9bf0;} .prio-high{background:#f0902f;} .prio-urgent{background:#e7485c;}
.prio-badge{font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;}
.pb-low{background:#f1f5f9;color:#64748b;} .pb-normal{background:#eef5ff;color:#2f74c9;} .pb-high{background:#fff2e6;color:#c46a12;} .pb-urgent{background:#ffeef0;color:#d9364f;}

/* avatars */
.ava-sm{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;flex:none;border:2px solid #fff;}
.person{display:inline-flex;align-items:center;gap:8px;}
.person .p-name{font-weight:500;color:var(--ks-text);white-space:nowrap;}
.ava-stack{display:inline-flex;align-items:center;}
.ava-stack .ava-sm:not(:first-child){margin-left:-8px;}
.ava-more{width:28px;height:28px;border-radius:50%;background:#eef2f8;color:var(--ks-muted);font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;margin-left:-8px;border:2px solid #fff;}

/* deadline cell */
.dl-main{font-weight:500;white-space:nowrap;}
.dl-sub{font-size:12.5px;color:var(--ks-muted);margin-top:2px;white-space:nowrap;display:flex;align-items:center;gap:4px;}
.dl-sub.over{color:var(--ks-danger);font-weight:600;}
.dl-sub.soon{color:var(--ks-warning);font-weight:600;}
td.dl-danger .dl-main{color:var(--ks-danger);}

/* progress */
.prog{display:flex;align-items:center;gap:8px;min-width:120px;}
.prog-bar{flex:1;height:8px;border-radius:999px;background:#e8eef6;overflow:hidden;min-width:70px;}
.prog-fill{height:100%;border-radius:999px;background:var(--ks-primary);transition:width .3s;}
.prog-fill.done{background:var(--ks-success);}
.prog-fill.over{background:var(--ks-danger);}
.prog-num{font-size:12.5px;font-weight:600;color:var(--ks-muted);width:34px;text-align:right;}

/* status chip */
.chip{height:24px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:5px;border:1px solid transparent;white-space:nowrap;}
.chip svg{width:13px;height:13px;}
.chip-draft{background:var(--st-draft-bg);border-color:var(--st-draft-bd);color:var(--st-draft-tx);}
.chip-new{background:var(--st-new-bg);border-color:var(--st-new-bd);color:var(--st-new-tx);}
.chip-in_progress{background:var(--st-prog-bg);border-color:var(--st-prog-bd);color:var(--st-prog-tx);}
.chip-pending_review{background:var(--st-review-bg);border-color:var(--st-review-bd);color:var(--st-review-tx);}
.chip-completed{background:var(--st-done-bg);border-color:var(--st-done-bd);color:var(--st-done-tx);}
.chip-overdue{background:var(--st-over-bg);border-color:var(--st-over-bd);color:var(--st-over-tx);}
.chip-paused,.chip-canceled{background:var(--st-stop-bg);border-color:var(--st-stop-bd);color:var(--st-stop-tx);}
.status-cell{display:flex;flex-direction:column;gap:4px;align-items:flex-start;}

/* row actions */
.row-actions{display:flex;align-items:center;gap:6px;}
.eye-btn{width:32px;height:32px;border-radius:8px;border:1px solid #bfe3c8;background:#f1fbf3;color:var(--ks-success);display:inline-flex;align-items:center;justify-content:center;}
.eye-btn:hover{background:#e2f6e7;}
.dots-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--ks-border);background:#fff;color:var(--ks-muted);display:inline-flex;align-items:center;justify-content:center;}
.dots-btn:hover{background:var(--ks-hover-blue);color:var(--ks-primary);}
.dots-btn:disabled{opacity:.4;cursor:not-allowed;}

/* pagination */
.pager{display:flex;align-items:center;gap:14px;padding:14px 16px;justify-content:flex-end;border-top:1px solid #EAF1FA;flex-wrap:wrap;}
.pager .p-info{color:var(--ks-muted);font-size:13px;margin-right:auto;}
.pg-list{display:flex;align-items:center;gap:4px;}
.pg{min-width:32px;height:32px;padding:0 8px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--ks-navy);font-weight:600;font-size:13px;display:inline-flex;align-items:center;justify-content:center;}
.pg:hover{background:var(--ks-hover-blue);}
.pg.active{background:var(--ks-primary);color:#fff;}
.pg:disabled{opacity:.4;cursor:not-allowed;}
.pg.dots{pointer-events:none;color:var(--ks-muted);}
.pp-size{height:34px;border-radius:8px;border:1px solid var(--ks-border);background:#fff;color:var(--ks-navy);font-size:13px;font-weight:600;padding:0 8px;}

/* states: empty / loading / error */
.state-box{padding:56px 20px;text-align:center;color:var(--ks-muted);}
.state-box .st-ic{width:56px;height:56px;border-radius:16px;background:#eef4fc;color:var(--ks-primary);display:inline-flex;align-items:center;justify-content:center;margin-bottom:14px;}
.state-box .st-ic.err{background:#fdecee;color:var(--ks-danger);}
.state-box h3{margin:0 0 6px;color:var(--ks-navy);font-size:17px;font-weight:700;}
.state-box p{margin:0 0 16px;font-size:14px;}
.skeleton td{padding:14px 12px;}
.sk{height:14px;border-radius:6px;background:linear-gradient(90deg,#eef2f8 25%,#e2e9f3 37%,#eef2f8 63%);background-size:400% 100%;animation:shimmer 1.3s ease infinite;}
@keyframes shimmer{0%{background-position:100% 0;}100%{background-position:-100% 0;}}

/* =========================================================================
   DRAWER + OVERLAY
   ========================================================================= */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.24);z-index:60;opacity:0;pointer-events:none;transition:opacity .22s;}
.overlay.show{opacity:1;pointer-events:auto;}
.drawer{
  position:fixed;top:0;right:0;height:100vh;width:760px;max-width:calc(100vw - 40px);
  background:#fff;z-index:70;display:flex;flex-direction:column;
  box-shadow:-8px 0 30px rgba(24,43,87,.16);
  transform:translateX(100%);transition:transform .26s cubic-bezier(.22,.61,.36,1);
}
.drawer.wide{width:860px;}
.drawer.show{transform:translateX(0);}
.drawer-head{
  flex:none;padding:16px 20px;border-bottom:1px solid #e9eef6;display:flex;align-items:flex-start;gap:12px;
  background:#fff;position:sticky;top:0;
}
.drawer-head .dh-titles{min-width:0;flex:1;}
.drawer-head h2{margin:0;font-size:20px;line-height:28px;font-weight:700;color:var(--ks-navy);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.drawer-head .dh-meta{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap;}
.dh-code{font-size:13px;font-weight:700;color:var(--ks-muted);letter-spacing:.2px;}
.drawer-head .dh-close{margin-left:auto;}
.drawer-head .dh-actions{display:flex;align-items:center;gap:8px;margin-left:auto;position:relative;}

/* tabs */
.tabs{flex:none;display:flex;gap:2px;padding:0 20px;border-bottom:1px solid #e9eef6;background:#fff;}
.tab{padding:12px 14px;border:none;background:transparent;color:var(--ks-muted);font-weight:600;font-size:13.5px;position:relative;border-bottom:2px solid transparent;display:inline-flex;align-items:center;gap:7px;}
.tab:hover{color:var(--ks-navy);}
.tab.active{color:var(--ks-primary);border-bottom-color:var(--ks-primary);}
.tab .tcount{font-size:11px;font-weight:700;background:#eef2f8;color:var(--ks-muted);border-radius:999px;padding:0 7px;}
.tab.active .tcount{background:#e0ecfb;color:var(--ks-primary);}

.drawer-body{flex:1;overflow-y:auto;padding:20px;}
.drawer-foot{
  flex:none;padding:14px 20px;border-top:1px solid #e9eef6;display:flex;align-items:center;gap:10px;
  background:#fff;position:sticky;bottom:0;
}
.drawer-foot .spacer{flex:1;}

/* form */
.form-section{margin-bottom:22px;}
.form-section>.fs-title{font-size:13px;font-weight:700;color:var(--ks-navy);text-transform:uppercase;letter-spacing:.4px;margin:0 0 12px;display:flex;align-items:center;gap:8px;}
.form-section>.fs-title .ln{flex:1;height:1px;background:#eaf0f8;}
.field{margin-bottom:16px;}
.field.half{width:calc(50% - 8px);}
.row2{display:flex;gap:16px;flex-wrap:wrap;}
label.lbl{display:block;font-size:13px;font-weight:600;color:var(--ks-navy);margin-bottom:6px;}
label.lbl .req{color:var(--ks-danger);margin-left:2px;}
label.lbl .opt{color:var(--ks-muted);font-weight:500;margin-left:6px;font-size:12px;}
.ctrl{
  width:100%;height:40px;border-radius:var(--r-input);border:1px solid var(--ks-border);
  padding:0 12px;font-size:14px;color:var(--ks-text);background:#fff;outline:none;
}
.ctrl:focus{border-color:var(--ks-primary);box-shadow:var(--ks-focus);}
textarea.ctrl{height:auto;padding:10px 12px;resize:vertical;min-height:84px;line-height:1.5;}
select.ctrl{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 12px center;padding-right:34px;}
.ctrl.invalid{border-color:var(--ks-danger);background:#fff7f8;}
.ctrl.invalid:focus{box-shadow:0 0 0 3px rgba(231,72,92,.14);}
.err-msg{color:var(--ks-danger);font-size:12.5px;margin-top:5px;display:none;align-items:center;gap:5px;}
.err-msg.show{display:flex;}
.hint{color:var(--ks-muted);font-size:12px;margin-top:5px;}
.char-count{float:right;color:var(--ks-muted);font-size:12px;font-weight:500;}

/* toggle */
.toggle{display:inline-flex;align-items:center;gap:10px;cursor:pointer;}
.toggle .tg{width:40px;height:22px;border-radius:999px;background:#cdd8e6;position:relative;transition:background .18s;flex:none;}
.toggle .tg::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .18s;box-shadow:0 1px 2px rgba(0,0,0,.2);}
.toggle.on .tg{background:var(--ks-primary);}
.toggle.on .tg::after{transform:translateX(18px);}
.toggle .tg-lbl{font-size:13.5px;color:var(--ks-text);font-weight:500;}

/* segmented (visibility / priority) */
.seg{display:inline-flex;border:1px solid var(--ks-border);border-radius:var(--r-pill);overflow:hidden;background:#fff;flex-wrap:wrap;}
.seg button{border:none;background:transparent;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ks-navy);display:inline-flex;align-items:center;gap:6px;}
.seg button:hover{background:var(--ks-hover-blue);}
.seg button.active{background:var(--ks-primary);color:#fff;}

/* people picker */
.picker{border:1px solid var(--ks-border);border-radius:var(--r-input);padding:6px;min-height:40px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#fff;}
.picker.invalid{border-color:var(--ks-danger);background:#fff7f8;}
.picker:focus-within{border-color:var(--ks-primary);box-shadow:var(--ks-focus);}
.picker .ptag{display:inline-flex;align-items:center;gap:6px;background:#eef4fc;border-radius:999px;padding:3px 6px 3px 4px;font-size:12.5px;font-weight:600;color:var(--ks-navy);}
.picker .ptag button{border:none;background:transparent;color:var(--ks-muted);display:flex;padding:1px;border-radius:50%;}
.picker .ptag button:hover{background:#d9e5f4;color:var(--ks-navy);}
.picker input{border:none;outline:none;flex:1;min-width:120px;height:28px;font-size:13.5px;background:transparent;}
.picker.single .ptag{background:#e0ecfb;}
.pop{position:absolute;z-index:90;background:#fff;border:1px solid var(--ks-border);border-radius:10px;box-shadow:0 12px 30px rgba(24,43,87,.16);margin-top:4px;max-height:260px;overflow:auto;width:100%;padding:6px;}
.pop .opt{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;}
.pop .opt:hover{background:#f2f6fc;}
.pop .opt .o-meta{display:flex;flex-direction:column;line-height:1.2;}
.pop .opt .o-meta b{font-size:13px;font-weight:600;color:var(--ks-text);}
.pop .opt .o-meta span{font-size:11.5px;color:var(--ks-muted);}
.pop .opt.picked{opacity:.5;pointer-events:none;}
.pop .empty{padding:12px;color:var(--ks-muted);font-size:13px;text-align:center;}
.field-rel{position:relative;}

/* checklist editor */
.cl-item{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.cl-item .grip{color:#b6c2d4;cursor:grab;flex:none;}
.cl-item input.ctrl{height:38px;}
.cl-item .del{flex:none;}
.cl-add{margin-top:4px;}
.cl-empty{color:var(--ks-muted);font-size:13px;padding:8px 0;}

/* attachments */
.att-drop{border:1.5px dashed var(--ks-border);border-radius:10px;padding:18px;text-align:center;color:var(--ks-muted);background:#fbfdff;}
.att-drop b{color:var(--ks-primary);}
.att-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid #e9eef6;border-radius:8px;margin-top:8px;}
.att-item .fi{width:32px;height:32px;border-radius:8px;background:#eef4fc;color:var(--ks-primary);display:flex;align-items:center;justify-content:center;flex:none;}
.att-item .f-meta{flex:1;min-width:0;}
.att-item .f-meta b{font-size:13px;font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.att-item .f-meta span{font-size:12px;color:var(--ks-muted);}

/* =========================================================================
   DETAIL DRAWER content
   ========================================================================= */
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 24px;padding:16px;background:#f8fbff;border:1px solid #e6eefb;border-radius:10px;margin-bottom:18px;}
.sm-item .k{font-size:12px;color:var(--ks-muted);font-weight:600;margin-bottom:5px;text-transform:uppercase;letter-spacing:.3px;}
.sm-item .v{font-size:14px;color:var(--ks-text);font-weight:500;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.sm-item.full{grid-column:1 / -1;}

.action-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px;background:#fff;border:1px solid var(--ks-border);border-radius:10px;margin-bottom:18px;}
.action-bar .ab-label{font-size:13px;font-weight:700;color:var(--ks-navy);margin-right:4px;display:flex;align-items:center;gap:7px;}

.desc-block{font-size:14px;line-height:1.6;color:var(--ks-text);white-space:pre-wrap;}

/* checklist view */
.cl-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.cl-head .cl-count{font-size:13px;font-weight:700;color:var(--ks-navy);white-space:nowrap;}
.cl-progress{flex:1;height:10px;border-radius:999px;background:#e8eef6;overflow:hidden;}
.cl-progress>i{display:block;height:100%;background:var(--ks-success);border-radius:999px;transition:width .3s;}
.cl-row{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border:1px solid #edf1f8;border-radius:9px;margin-bottom:8px;}
.cl-row.done{background:#f6fbf4;border-color:#dcefd4;}
.cl-row .cl-box{margin-top:1px;}
.cl-row .cl-txt{flex:1;font-size:14px;color:var(--ks-text);}
.cl-row.done .cl-txt{text-decoration:line-through;color:var(--ks-muted);}
.cl-row .cl-by{font-size:12px;color:var(--ks-muted);margin-top:3px;}

/* manual progress control */
.manual-prog{display:flex;align-items:center;gap:14px;padding:12px 0;}
.manual-prog input[type=range]{flex:1;accent-color:var(--ks-primary);}
.manual-prog .mp-val{font-weight:700;color:var(--ks-navy);width:52px;text-align:right;font-size:16px;}

/* comments */
.cmt{display:flex;gap:12px;margin-bottom:16px;}
.cmt .c-body{flex:1;min-width:0;}
.cmt .c-head{display:flex;align-items:center;gap:8px;margin-bottom:3px;}
.cmt .c-head b{font-size:13.5px;color:var(--ks-navy);font-weight:700;}
.cmt .c-head .c-time{font-size:12px;color:var(--ks-muted);}
.cmt .c-text{font-size:14px;line-height:1.5;color:var(--ks-text);background:#f5f8fd;border-radius:0 10px 10px 10px;padding:9px 12px;display:inline-block;}
.cmt .c-text .mention{color:var(--ks-primary);font-weight:600;}
.cmt-empty{color:var(--ks-muted);font-size:13.5px;text-align:center;padding:24px 0;}
.cmt-compose{display:flex;gap:10px;align-items:flex-start;border-top:1px solid #eef2f8;padding-top:14px;margin-top:6px;}
.cmt-compose .cc-body{flex:1;}
.cmt-compose textarea{min-height:60px;}
.cmt-compose .cc-foot{display:flex;align-items:center;gap:10px;margin-top:8px;}
.cmt-compose .cc-hint{font-size:12px;color:var(--ks-muted);margin-right:auto;}

/* files list */
.files-sec{margin-top:20px;}
.files-sec h4{font-size:13px;font-weight:700;color:var(--ks-navy);margin:0 0 10px;text-transform:uppercase;letter-spacing:.3px;}

/* activity timeline */
.timeline{position:relative;padding-left:26px;}
.timeline::before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:#e6edf7;}
.tl-item{position:relative;padding-bottom:18px;}
.tl-item:last-child{padding-bottom:0;}
.tl-dot{position:absolute;left:-26px;top:1px;width:20px;height:20px;border-radius:50%;background:#eef4fc;border:2px solid #fff;color:var(--ks-primary);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1px #dbe6f5;}
.tl-dot svg{width:11px;height:11px;}
.tl-dot.ok{background:#eafbef;color:var(--ks-success);box-shadow:0 0 0 1px #cdefd6;}
.tl-dot.warn{background:#fff6e6;color:var(--ks-warning);box-shadow:0 0 0 1px #f3e0b8;}
.tl-dot.danger{background:#fdecef;color:var(--ks-danger);box-shadow:0 0 0 1px #f6cdd4;}
.tl-body .tl-line{font-size:13.5px;color:var(--ks-text);line-height:1.45;}
.tl-body .tl-line b{font-weight:700;color:var(--ks-navy);}
.tl-body .tl-time{font-size:12px;color:var(--ks-muted);margin-top:2px;}
.tl-body .tl-change{font-size:12.5px;margin-top:5px;background:#f6f8fc;border:1px solid #eaeff7;border-radius:8px;padding:6px 10px;color:var(--ks-muted);}
.tl-body .tl-change .old{color:var(--ks-danger);text-decoration:line-through;}
.tl-body .tl-change .new{color:var(--ks-success);font-weight:600;}

/* =========================================================================
   FILTER DRAWER
   ========================================================================= */
.filter-drawer{width:420px;}
.fg{margin-bottom:20px;}
.fg h4{font-size:13px;font-weight:700;color:var(--ks-navy);margin:0 0 10px;}
.chk-list{display:flex;flex-direction:column;gap:2px;}
.chk-opt{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:13.5px;}
.chk-opt:hover{background:#f5f8fd;}
.chk-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px;}

/* =========================================================================
   MENUS / DROPDOWNS
   ========================================================================= */
.menu{position:absolute;z-index:95;min-width:200px;background:#fff;border:1px solid #e6ecf5;border-radius:10px;box-shadow:0 12px 34px rgba(24,43,87,.18);padding:6px;}
.menu button{width:100%;display:flex;align-items:center;gap:10px;padding:9px 10px;border:none;background:transparent;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--ks-text);text-align:left;}
.menu button:hover{background:#f2f6fc;}
.menu button.danger{color:var(--ks-danger);}
.menu button.danger:hover{background:#fff3f5;}
.menu button:disabled{opacity:.4;cursor:not-allowed;}
.menu .sep{height:1px;background:#eef2f8;margin:5px 0;}
.menu .m-head{font-size:11px;font-weight:700;color:var(--ks-muted);text-transform:uppercase;letter-spacing:.4px;padding:6px 10px 3px;}

/* role switcher popover */
.role-pop{min-width:280px;}
.role-opt{width:100%;display:flex;align-items:center;gap:10px;padding:10px;border:none;background:transparent;border-radius:8px;text-align:left;}
.role-opt:hover{background:#f2f6fc;}
.role-opt.active{background:var(--ks-menu-selected);}
.role-opt .r-meta b{font-size:13px;color:var(--ks-navy);font-weight:700;display:block;}
.role-opt .r-meta span{font-size:11.5px;color:var(--ks-muted);}
.role-opt .r-check{margin-left:auto;color:var(--ks-primary);opacity:0;}
.role-opt.active .r-check{opacity:1;}

/* =========================================================================
   MODAL
   ========================================================================= */
.modal-wrap{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:rgba(24,43,87,.34);opacity:0;pointer-events:none;transition:opacity .18s;}
.modal-wrap.show{opacity:1;pointer-events:auto;}
.modal{width:460px;max-width:calc(100vw - 40px);background:#fff;border-radius:14px;box-shadow:0 24px 60px rgba(24,43,87,.28);overflow:hidden;transform:translateY(8px);transition:transform .2s;}
.modal-wrap.show .modal{transform:translateY(0);}
.modal-head{padding:18px 20px 6px;display:flex;align-items:flex-start;gap:12px;}
.modal-head .m-ic{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;}
.modal-head .m-ic.warn{background:#fff4e5;color:var(--ks-warning);}
.modal-head .m-ic.danger{background:#fdecef;color:var(--ks-danger);}
.modal-head .m-ic.info{background:#eaf4ff;color:var(--ks-primary);}
.modal-head h3{margin:0;font-size:17px;font-weight:700;color:var(--ks-navy);}
.modal-head p{margin:4px 0 0;font-size:13.5px;color:var(--ks-muted);line-height:1.5;}
.modal-body{padding:12px 20px 4px;}
.modal-foot{padding:14px 20px 18px;display:flex;gap:10px;justify-content:flex-end;}
.kv-change{background:#f6f8fc;border:1px solid #eaeff7;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:12px;}
.kv-change .kv-row{display:flex;justify-content:space-between;gap:12px;padding:2px 0;}
.kv-change .kv-row .lab{color:var(--ks-muted);}

/* =========================================================================
   TOAST
   ========================================================================= */
.toast-wrap{position:fixed;top:16px;right:16px;z-index:120;display:flex;flex-direction:column;gap:10px;}
.toast{min-width:300px;max-width:420px;background:#fff;border:1px solid #e6ecf5;border-left:4px solid var(--ks-primary);border-radius:10px;box-shadow:0 12px 30px rgba(24,43,87,.18);padding:12px 14px;display:flex;align-items:flex-start;gap:10px;animation:toastIn .25s ease;}
.toast.success{border-left-color:var(--ks-success);}
.toast.error{border-left-color:var(--ks-danger);}
.toast.warn{border-left-color:var(--ks-warning);}
.toast .t-ic{flex:none;margin-top:1px;}
.toast.success .t-ic{color:var(--ks-success);}
.toast.error .t-ic{color:var(--ks-danger);}
.toast.warn .t-ic{color:var(--ks-warning);}
.toast .t-ic.info,.toast .t-ic{color:var(--ks-primary);}
.toast .t-body{flex:1;}
.toast .t-body b{font-size:13.5px;color:var(--ks-navy);font-weight:700;display:block;margin-bottom:2px;}
.toast .t-body span{font-size:13px;color:var(--ks-muted);line-height:1.4;}
.toast .t-close{border:none;background:transparent;color:var(--ks-muted);padding:2px;border-radius:5px;flex:none;}
.toast .t-close:hover{background:#eef2f8;}
@keyframes toastIn{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:translateX(0);}}
@keyframes toastOut{to{opacity:0;transform:translateX(20px);}}
.toast.out{animation:toastOut .2s ease forwards;}

/* helpers */
.hidden{display:none !important;}
.mt8{margin-top:8px;} .mt16{margin-top:16px;} .mb0{margin-bottom:0;}
.text-muted{color:var(--ks-muted);}
.nowrap{white-space:nowrap;}
.tooltip-host{position:relative;}
[data-tip]{position:relative;}
[data-tip]:hover::after{
  content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);
  background:#1e293b;color:#fff;font-size:11.5px;font-weight:500;padding:4px 8px;border-radius:6px;white-space:nowrap;z-index:200;pointer-events:none;
}
.perm-note{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ks-muted);background:#f5f8fd;border:1px dashed #d5e3f5;border-radius:8px;padding:8px 12px;}

/* banner for returned tasks / notice inside detail */
.notice{display:flex;align-items:flex-start;gap:10px;border-radius:10px;padding:12px 14px;margin-bottom:16px;font-size:13.5px;line-height:1.5;}
.notice.warn{background:#fff8ec;border:1px solid #f4dca0;color:#8a5a00;}
.notice.danger{background:#fff1f3;border:1px solid #f6c6ce;color:#a52a3c;}
.notice.info{background:#eef6ff;border:1px solid #cfe4fc;color:#1c5aa8;}
.notice b{font-weight:700;}

/* =====================================================================
   APP LAUNCHER — Trung tâm Ứng dụng (scope .app-launcher, không đụng feature cũ)
   ===================================================================== */
.app-launcher{font-family:"Be Vietnam Pro",Arial,sans-serif;}
.app-launcher[aria-hidden="true"]{display:none;}
.app-launcher .al-overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:200;animation:alFade .18s ease;}
.app-launcher .al-dialog{position:fixed;top:18px;left:50%;transform:translateX(-50%);width:calc(100vw - 40px);max-width:1240px;max-height:calc(100vh - 36px);background:#fff;border-radius:10px;box-shadow:0 24px 70px rgba(15,23,42,.3);z-index:201;display:flex;flex-direction:column;overflow:hidden;animation:alPop .2s ease;}
@keyframes alFade{from{opacity:0}to{opacity:1}}
@keyframes alPop{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
.app-launcher .al-header{display:flex;align-items:center;padding:16px 22px;background:#F7FAFE;border-bottom:1px solid #E9EEF6;}
.app-launcher .al-header h2{margin:0;font-size:19px;font-weight:700;color:#182B57;}
.app-launcher .al-x{margin-left:auto;width:34px;height:34px;border:none;background:transparent;color:#64748B;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.app-launcher .al-x:hover{background:#e9eef6;color:#182B57;}
.app-launcher .al-searchrow{position:relative;padding:18px 22px 6px;}
.app-launcher .al-searchic{position:absolute;left:38px;top:calc(50% + 6px);transform:translateY(-50%);color:#94A3B8;pointer-events:none;}
.app-launcher .al-searchrow input{width:100%;height:46px;border:1px solid #D9E2EF;border-radius:24px;padding:0 18px 0 46px;font-size:15px;color:#1E293B;outline:none;background:#fff;}
.app-launcher .al-searchrow input:focus{border-color:#1677E8;box-shadow:0 0 0 3px rgba(22,119,232,.14);}
.app-launcher .al-body{flex:1;overflow-y:auto;padding:14px 22px 8px;min-height:150px;}
.app-launcher .al-section{margin-bottom:18px;}
.app-launcher .al-sec-head{display:flex;align-items:center;gap:8px;margin:6px 2px 12px;}
.app-launcher .al-sec-head h3{margin:0;font-size:13px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.5px;}
.app-launcher .al-sec-head .al-count{font-size:11px;font-weight:700;color:#64748B;background:#eef2f8;border-radius:999px;padding:1px 8px;}
.app-launcher .al-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;}

const STATUS_META={
 draft:{label:'Nháp',cls:'chip-draft',icon:'file'},
 new:{label:'Mới',cls:'chip-new',icon:'clipboardList'},
 in_progress:{label:'Đang thực hiện',cls:'chip-in_progress',icon:'clock'},
 pending_review:{label:'Chờ xác nhận',cls:'chip-pending_review',icon:'clock'},
 completed:{label:'Hoàn thành',cls:'chip-completed',icon:'checkCircle'},
 paused:{label:'Tạm dừng',cls:'chip-paused',icon:'pause'},
 canceled:{label:'Đã hủy',cls:'chip-canceled',icon:'x'}
};
const PRIO_META={
 low:{label:'Thấp',dot:'prio-low',badge:'pb-low'},
 normal:{label:'Bình thường',dot:'prio-normal',badge:'pb-normal'},
 high:{label:'Cao',dot:'prio-high',badge:'pb-high'},
 urgent:{label:'Khẩn',dot:'prio-urgent',badge:'pb-urgent'}
};
const ACTIVE_STATES=['new','in_progress','pending_review'];
function isOverdue(t){return t.dueAt&&t.dueAt<NOW&&ACTIVE_STATES.includes(t.status);}
function progressOf(t){if(t.checklist&&t.checklist.length){const d=t.checklist.filter(c=>c.done).length;return Math.round(d/t.checklist.length*100);}return t.progressManual||0;}
function chipHTML(status){const m=STATUS_META[status];return '<span class="chip '+m.cls+'">'+ic(m.icon,13)+m.label+'</span>';}
function overdueChip(){return '<span class="chip chip-overdue">'+ic('alert',13)+'Quá hạn</span>';}

/* =====================================================================
   PHÂN QUYỀN (mock) — Ma trận quyền mục 2.3 / Table 5
   ===================================================================== */
function isRelated(t,u){return [t.creatorId,t.responsibleId,...(t.executorIds||[]),...(t.collaboratorIds||[]),...(t.watcherIds||[])].includes(u.id);}
function canView(t,u){
 if(t.status==='draft')return t.creatorId===u.id||u.role==='superadmin';
 if(u.role==='superadmin'||u.role==='bgh')return true;               // BGH/Quản trị: xem cả việc riêng tư trong phạm vi
 if(u.role==='to_truong')return isRelated(t,u)||t.unit===u.unit;      // Tổ trưởng: việc đơn vị + việc liên quan
 return isRelated(t,u)||(t.visibility==='unit'&&t.unit===u.unit);     // Giáo viên: liên quan HOẶC công khai trong đơn vị
}
function canCreate(u){return u.role==='superadmin'||u.role==='bgh'||u.role==='to_truong'||!!u.canCreate;}
function isProcessor(t,u){return t.responsibleId===u.id||(t.executorIds||[]).includes(u.id);}
function canOperate(t,u){return u.role==='superadmin'||u.role==='bgh'||t.creatorId===u.id;} // sửa, gia hạn, chuyển người, tạm dừng, hủy
function canEdit(t,u){return canOperate(t,u)&&!['completed','canceled'].includes(t.status);}
function canProcess(t,u){return u.role==='superadmin'||u.role==='bgh'||isProcessor(t,u);}   // tick, tiến độ, nộp kết quả
function canApprove(t,u){return u.role==='superadmin'||u.role==='bgh'||t.creatorId===u.id;} // xác nhận / trả về
function canComment(t,u){return canView(t,u);}
function canDeleteDraft(t,u){return t.status==='draft'&&t.creatorId===u.id;}

/* =====================================================================
   FILTER PIPELINE
   ===================================================================== */
function applyAll(){
 let list=TASKS.filter(t=>canView(t,CUR()));
 // scope
 if(state.scope==='mine')list=list.filter(t=>isProcessor(t,CUR()));
 else if(state.scope==='assigned')list=list.filter(t=>t.creatorId===CUR().id);
 else if(state.scope==='overdue')list=list.filter(t=>isOverdue(t));
 else if(state.scope==='pending')list=list.filter(t=>t.status==='pending_review');
 // search (mã, tên, người liên quan)
 if(state.search.trim()){
   const q=stripV(state.search.trim());
   list=list.filter(t=>{
     const names=[t.responsibleId,...(t.executorIds||[]),t.creatorId].map(uname).join(' ');
     return stripV(t.code).includes(q)||stripV(t.title).includes(q)||stripV(names).includes(q);
   });
 }
 // advanced
 if(state.statuses.length)list=list.filter(t=>state.statuses.includes(t.status)||(state.statuses.includes('overdue')&&isOverdue(t)));
 if(state.priorities.length)list=list.filter(t=>state.priorities.includes(t.priority));
 if(state.unit)list=list.filter(t=>t.unit===state.unit);
 if(state.person)list=list.filter(t=>[t.responsibleId,...(t.executorIds||[]),t.creatorId].includes(state.person));
 if(state.onlyOverdue)list=list.filter(t=>isOverdue(t));
 if(state.dueFrom){const f=new Date(state.dueFrom);f.setHours(0,0,0,0);list=list.filter(t=>t.dueAt&&t.dueAt>=f);}
 if(state.dueTo){const e=new Date(state.dueTo);e.setHours(23,59,59,999);list=list.filter(t=>t.dueAt&&t.dueAt<=e);}
 // sort by created
 list=list.slice().sort((a,b)=>state.sortDir==='desc'?b.createdAt-a.createdAt:a.createdAt-b.createdAt);
 return list;
}
function activeFilterCount(){let n=0;if(state.statuses.length)n++;if(state.priorities.length)n++;if(state.unit)n++;if(state.person)n++;if(state.onlyOverdue)n++;if(state.dueFrom||state.dueTo)n++;return n;}

function execStack(ids){
 ids=ids||[];if(!ids.length)return '<span class="text-muted">—</span>';
 const shown=ids.slice(0,3);const extra=ids.length-shown.length;
 let h='<span class="ava-stack" data-tip="'+esc(ids.map(uname).join(', '))+'">';
 shown.forEach(id=>{const u=U(id);h+='<span class="ava-sm" style="background:'+avaColor(u.id)+'">'+initials(u.name)+'</span>';});
 if(extra>0)h+='<span class="ava-more">+'+extra+'</span>';
 h+='</span>';return h;
}
function deadlineCell(t){
 if(!t.dueAt)return '<span class="text-muted">Chưa đặt hạn</span>';
 const over=isOverdue(t);const done=t.status==='completed';
 const ms=t.dueAt-NOW;const days=Math.ceil(Math.abs(ms)/86400000);
 let sub='';
 if(done)sub='<span class="dl-sub">Đã hoàn thành</span>';
 else if(over)sub='<span class="dl-sub over">'+ic('alert',13)+'Quá hạn '+days+' ngày</span>';
 else if(ms<=86400000*2)sub='<span class="dl-sub soon">'+ic('clock',13)+'Còn '+(days<=0?'< 1':days)+' ngày</span>';
 else sub='<span class="dl-sub">Còn '+days+' ngày</span>';
 return '<div class="dl-main">'+fmtDT(t.dueAt)+'</div>'+sub;
}
function progressCell(t){
 const p=progressOf(t);const over=isOverdue(t);const done=t.status==='completed';
 const cls=done||p>=100&&t.status==='completed'?'done':over?'over':(p>=100?'done':'');
 return '<div class="prog"><div class="prog-bar"><div class="prog-fill '+cls+'" style="width:'+p+'%"></div></div><span class="prog-num">'+p+'%</span></div>';
}
function statusCell(t){
 if(isOverdue(t))return '<div class="status-cell">'+overdueChip()+chipHTML(t.status)+'</div>';
 return '<div class="status-cell">'+chipHTML(t.status)+'</div>';
}

let openStack=[];
function showOverlay(){$('#overlay').classList.add('show');}
function hideOverlayIfNone(){if(!openStack.length)$('#overlay').classList.remove('show');}
function openDrawer(el,onEsc){
 showOverlay();el.classList.add('show');openStack.push({el,onEsc});
 setTimeout(()=>{const f=el.querySelector('input,textarea,button,select,[tabindex]');if(f)f.focus();},80);
}
function closeDrawer(el){el.classList.remove('show');openStack=openStack.filter(o=>o.el!==el);hideOverlayIfNone();}
$('#overlay').addEventListener('click',()=>{const top=openStack[openStack.length-1];if(top)top.onEsc?top.onEsc():closeDrawer(top.el);});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){
   if($('#modalWrap').classList.contains('show')){return;} // modal handles its own
   const top=openStack[openStack.length-1];if(top){top.onEsc?top.onEsc():closeDrawer(top.el);}
 }
 // focus trap on topmost drawer
 if(e.key==='Tab'&&openStack.length){
   const el=openStack[openStack.length-1].el;
   const f=$$('a[href],button:not([disabled]),textarea,input,select,[tabindex]:not([tabindex="-1"])',el).filter(x=>x.offsetParent!==null);
   if(!f.length)return;const first=f[0],last=f[f.length-1];
   if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
   else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
 }
});

function validateCommon(forAssign){
 let ok=true;const first={id:null};
 if(!cs.title.trim()||cs.title.trim().length<3){showErr('fTitle','Tên công việc phải có từ 3 đến 150 ký tự.');ok=false;first.id=first.id||'fTitle';}
 if(forAssign){
  if(!cs.responsibleId){showErr('fResp','Vui lòng chọn 01 người chịu trách nhiệm.');ok=false;first.id=first.id||'fResp';}
  if(!cs.executorIds.length){showErr('fExec','Chọn ít nhất 01 người thực hiện.');ok=false;first.id=first.id||'fExec';}
  if(!cs.dueAtStr){showErr('fDue','Deadline là bắt buộc khi giao việc.');ok=false;first.id=first.id||'fDue';}
  else if(new Date(cs.dueAtStr)<=NOW){showErr('fDue','Deadline phải sau thời điểm hiện tại.');ok=false;first.id=first.id||'fDue';}
 }
 if(!ok&&first.id){cs.tab='info';const cur=$('#cBody');if(!$('#'+first.id)){buildCreateDrawer();}const el=$('#'+first.id);if(el)el.scrollIntoView({behavior:'smooth',block:'center'});}
 return ok;
}
function collectExecutors(){let ex=[...cs.executorIds];if(cs.respIsExec&&cs.responsibleId&&!ex.includes(cs.responsibleId))ex.push(cs.responsibleId);return ex;}

function saveDraft(){
 if(cs.tab!=='info'){/* validate needs info fields visible */}
 if(!cs.title.trim()||cs.title.trim().length<3){cs.tab='info';buildCreateDrawer();showErr('fTitle','Tên công việc phải có từ 3 đến 150 ký tự.');return;}
 const cl=cs.checklist.filter(c=>c.title.trim()).map(c=>({id:c.id||('ci'+(Math.random()*1e9|0)),title:c.title.trim(),done:!!c.done,completedBy:c.completedBy||null,completedAt:c.completedAt||null}));
 if(cs.editId){
   const t=TASKS.find(x=>x.id===cs.editId);applyEdits(t,cl);addActivity(t,'đã cập nhật nội dung công việc','info');
   toast('success','Đã lưu thay đổi',t.code+' được cập nhật.');closeDrawer($('#createDrawer'));cs=null;refreshAll();return;
 }
 const t=makeTask('draft',cl);
 t.activity=[A(CURRENT,'đã tạo bản nháp',new Date(),'info')];
 TASKS.unshift(t);
 toast('success','Đã lưu nháp',t.code+' được lưu ở trạng thái Nháp. Chưa gửi thông báo.');
 closeDrawer($('#createDrawer'));cs=null;state.page=1;refreshAll();
}
function assignTask(){
 if(!validateCommon(true))return;
 const cl=cs.checklist.filter(c=>c.title.trim()).map(c=>({id:c.id||('ci'+(Math.random()*1e9|0)),title:c.title.trim(),done:!!c.done,completedBy:c.completedBy||null,completedAt:c.completedAt||null}));
 if(cs.editId){
   const t=TASKS.find(x=>x.id===cs.editId);const wasDraft=t.status==='draft';applyEdits(t,cl);
   if(wasDraft){t.status='new';addActivity(t,'đã giao việc và gửi thông báo cho người liên quan','ok');}
   else addActivity(t,'đã cập nhật nội dung công việc','info');
   toast('success','Đã cập nhật',t.code+' đã được lưu.');closeDrawer($('#createDrawer'));cs=null;refreshAll();openDetail(t.id);return;
 }
 const t=makeTask('new',cl);
 const rec=[t.responsibleId,...t.executorIds,...t.collaboratorIds,...t.watcherIds];
 t.activity=[A(CURRENT,'đã tạo công việc',new Date(),'info'),A(CURRENT,'đã giao việc và gửi thông báo cho người liên quan',new Date(),'ok')];
 TASKS.unshift(t);
 toast('success','Giao việc thành công','Đã tạo '+t.code+' và thông báo tới '+rec.length+' người liên quan.');
 notify(uname(t.responsibleId)+(t.executorIds.length?' và '+t.executorIds.length+' người':''),'Bạn được giao công việc “'+t.title+'”. Hạn: '+fmtDT(t.dueAt));
 closeDrawer($('#createDrawer'));cs=null;state.page=1;refreshAll();openDetail(t.id);
}
function makeTask(status,cl){
 const num=String(AUTO_SEQ++).padStart(4,'0');
 return {
  id:'t'+num+Date.now(),code:'CV-2026-'+num,title:cs.title.trim(),description:cs.description.trim(),
  unit:cs.unit,creatorId:CURRENT,responsibleId:cs.responsibleId,executorIds:collectExecutors(),
  collaboratorIds:[...cs.collaboratorIds],watcherIds:[...cs.watcherIds],visibility:canPublish()?cs.visibility:'related',
  priority:cs.priority,status:status,dueAt:cs.dueAtStr?new Date(cs.dueAtStr):null,createdAt:new Date(),completedAt:null,
  requireApproval:cs.requireApproval,checklist:cl,progressManual:0,resultNote:'',resultFiles:[],
  attachments:[...cs.attachments],comments:[],activity:[],returnNote:''
 };
}
function applyEdits(t,cl){
 t.title=cs.title.trim();t.description=cs.description.trim();t.unit=cs.unit;t.responsibleId=cs.responsibleId;
 t.executorIds=collectExecutors();t.collaboratorIds=[...cs.collaboratorIds];t.watcherIds=[...cs.watcherIds];
 t.visibility=canPublish()?cs.visibility:'related';t.priority=cs.priority;t.requireApproval=cs.requireApproval;
 if(cs.dueAtStr)t.dueAt=new Date(cs.dueAtStr);
 // preserve existing checklist done-state by id
 t.checklist=cl;t.attachments=[...cs.attachments];
}

function headerOps(t,u){
 const ops=[];
 if(canEdit(t,u))ops.push({label:'Sửa công việc',icon:'pencil',fn:()=>{closeDrawer($('#detailDrawer'));openCreate(t.id);}});
 if(canOperate(t,u)&&ACTIVE_STATES.includes(t.status)){ops.push({label:'Gia hạn',icon:'calClock',fn:()=>openExtend(t.id)});ops.push({label:'Chuyển người xử lý',icon:'swap',fn:()=>openReassign(t.id)});ops.push({label:'Tạm dừng',icon:'pause',fn:()=>openPause(t.id)});}
 if(canOperate(t,u)&&t.status==='paused')ops.push({label:'Tiếp tục',icon:'play',fn:()=>resumeTask(t.id)});
 if(canOperate(t,u)&&!['completed','canceled'].includes(t.status))ops.push({label:'Hủy công việc',icon:'trash',danger:true,fn:()=>openCancel(t.id)});
 if(canDeleteDraft(t,u))ops.push({label:'Xóa nháp',icon:'trash',danger:true,fn:()=>deleteDraft(t.id)});
 return ops;
}

   +'<div class="sm-item"><div class="k">Người theo dõi</div><div class="v">'+summaryPeople(t.watcherIds)+'</div></div>'
