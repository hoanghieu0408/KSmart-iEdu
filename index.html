document.getElementById('alSub').addEventListener('click',function(e){if(e.target===document.getElementById('alSub'))hideSub();});

/* ---------- create / edit personal app ---------- */
function validURL(u){u=(u||'').trim();if(!u)return false;if(/^(javascript|data|file|vbscript):/i.test(u))return false;if(/^https:\/\/[^\s]+\.[^\s]+/i.test(u))return true;if(/^\/[\w\-\/\?=&#.]*$/.test(u))return true;return false;}
function openForm(editId){
 var p=prefs();var editing=null;
 if(editId){for(var i=0;i<p.personal.length;i++)if(p.personal[i].id===editId)editing=p.personal[i];}
 var st={name:editing?editing.name:'',icon:editing?editing.icon:'link',color:editing?editing.color:COLORS[0],cat:editing?editing.cat:'dieu-hanh',url:editing?editing.url:'',openMode:editing?editing.openMode:'current',desc:editing?editing.desc:''};
 function draw(){
  showSub(
   '<div class="al-sub-head"><h3>'+(editing?'Sửa ứng dụng riêng':'Tạo ứng dụng riêng')+'</h3><button class="al-x" id="fX" aria-label="Đóng">'+ic('x',20)+'</button></div>'
   +'<div class="al-sub-body">'
   +'<div class="al-field"><label>Tên ứng dụng <span class="req">*</span><span class="al-cc" id="fNameCc">'+st.name.length+'/50</span></label><input class="al-input" id="fName" maxlength="50" placeholder="VD: Cổng thông tin nội bộ" value="'+esc(st.name)+'"><div class="al-err" id="fNameErr"></div></div>'
   +'<div class="al-row2"><div class="al-field"><label>Biểu tượng</label><div class="al-iconpick" id="fIcons">'+PICON.map(function(k){return '<div class="al-ic-opt'+(st.icon===k?' sel':'')+'" data-ic="'+k+'" role="button" tabindex="0" aria-label="'+k+'">'+ic(k,20)+'</div>';}).join('')+'</div></div>'
   +'<div class="al-field"><label>Màu</label><div class="al-colors" id="fColors">'+COLORS.map(function(c){return '<div class="al-color'+(st.color===c?' sel':'')+'" data-color="'+c+'" style="background:'+c+'" role="button" tabindex="0" aria-label="màu">'+(st.color===c?ic('check',16):'')+'</div>';}).join('')+'</div></div></div>'
   +'<div class="al-field"><label>Nhóm chức năng</label><select class="al-select" id="fCat">'+CATEGORIES.map(function(c){return '<option value="'+c.id+'"'+(st.cat===c.id?' selected':'')+'>'+esc(c.name)+'</option>';}).join('')+'</select></div>'
   +'<div class="al-field"><label>URL đích <span class="req">*</span></label><input class="al-input" id="fUrl" placeholder="https://... hoặc /duong-dan-noi-bo" value="'+esc(st.url)+'"><div class="al-err" id="fUrlErr"></div><div style="font-size:12px;color:#94A3B8;margin-top:5px">Chỉ chấp nhận https:// hoặc route nội bộ (bắt đầu bằng /). Cấm javascript:, data:, file:.</div></div>'
   +'<div class="al-field"><label>Mở tại</label><div class="al-seg" id="fMode"><button type="button" data-m="current" class="'+(st.openMode==='current'?'on':'')+'">Tab hiện tại</button><button type="button" data-m="new" class="'+(st.openMode==='new'?'on':'')+'">Tab mới</button></div></div>'
   +'<div class="al-field"><label>Mô tả <span class="al-cc" id="fDescCc">'+st.desc.length+'/160</span></label><textarea class="al-input" id="fDesc" maxlength="160" placeholder="Mô tả ngắn (không bắt buộc)">'+esc(st.desc)+'</textarea></div>'
   +'</div>'
   +'<div class="al-sub-foot">'+(editing?'<button class="al-btn danger" id="fDelete" style="margin-right:auto">'+ic('trash',16)+'Xóa</button>':'')+'<button class="al-btn ghost" id="fCancel">Hủy</button><button class="al-btn primary" id="fSave">'+ic('check',16)+(editing?'Lưu thay đổi':'Tạo ứng dụng')+'</button></div>'
  );
  qs('#fX').addEventListener('click',hideSub);
  qs('#fCancel').addEventListener('click',hideSub);
  qs('#fName').addEventListener('input',function(e){st.name=e.target.value;qs('#fNameCc').textContent=st.name.length+'/50';clearErr('fName');});
  qs('#fUrl').addEventListener('input',function(e){st.url=e.target.value;clearErr('fUrl');});
  qs('#fDesc').addEventListener('input',function(e){st.desc=e.target.value;qs('#fDescCc').textContent=st.desc.length+'/160';});
  qs('#fCat').addEventListener('change',function(e){st.cat=e.target.value;});
  qsa('#fIcons .al-ic-opt').forEach(function(o){o.addEventListener('click',function(){st.icon=o.getAttribute('data-ic');draw();});});
  qsa('#fColors .al-color').forEach(function(o){o.addEventListener('click',function(){st.color=o.getAttribute('data-color');draw();});});
  qsa('#fMode button').forEach(function(b){b.addEventListener('click',function(){st.openMode=b.getAttribute('data-m');qsa('#fMode button').forEach(function(x){x.classList.remove('on');});b.classList.add('on');});});
  if(editing)qs('#fDelete').addEventListener('click',function(){confirmDelete(editing);});
  qs('#fSave').addEventListener('click',save);
  setTimeout(function(){qs('#fName').focus();},30);
 }
 function clearErr(id){var e=qs('#'+id+'Err');if(e)e.classList.remove('show');var i=qs('#'+id);if(i)i.classList.remove('invalid');}
 function err(id,msg){var e=qs('#'+id+'Err');if(e){e.textContent=msg;e.classList.add('show');}var i=qs('#'+id);if(i)i.classList.add('invalid');}
 function save(){
  var ok=true;var nm=st.name.trim();
  if(nm.length<2||nm.length>50){err('fName','Tên phải từ 2 đến 50 ký tự.');ok=false;}
  else{var dup=p.personal.some(function(a){return norm(a.name)===norm(nm)&&(!editing||a.id!==editing.id);});if(dup){err('fName','Bạn đã có ứng dụng riêng trùng tên này.');ok=false;}}
  if(!validURL(st.url)){err('fUrl','URL không hợp lệ. Dùng https:// hoặc route nội bộ /..., cấm javascript:/data:/file:.');ok=false;}
  if(!ok)return;
  if(editing){editing.name=nm;editing.icon=st.icon;editing.color=st.color;editing.cat=st.cat;editing.url=st.url.trim();editing.openMode=st.openMode;editing.desc=st.desc.trim();toast('Đã cập nhật ứng dụng “'+nm+'”.');}
  else{p.personal.push({id:'p'+(p.pseq++)+'-'+userKey().replace(/\s/g,''),name:nm,icon:st.icon,color:st.color,cat:st.cat,url:st.url.trim(),openMode:st.openMode,desc:st.desc.trim(),ownerId:userKey()});toast('Đã tạo ứng dụng riêng “'+nm+'”.');}
  hideSub();render();
 }
 draw();
}
function confirmDelete(app){
 showSub('<div class="al-sub-head"><h3>Xóa ứng dụng riêng?</h3></div><div class="al-sub-body"><p style="margin:4px 0;color:#475569">Ứng dụng “'+esc(app.name)+'” sẽ bị xóa khỏi Trung tâm Ứng dụng của bạn. Ứng dụng hệ thống không bị ảnh hưởng.</p></div><div class="al-sub-foot"><button class="al-btn ghost" id="dCancel">Hủy</button><button class="al-btn danger" id="dOk">'+ic('trash',16)+'Xóa</button></div>');
 qs('#dCancel').addEventListener('click',function(){openForm(app.id);});
 qs('#dOk').addEventListener('click',function(){var p=prefs();p.personal=p.personal.filter(function(a){return a.id!==app.id;});p.starred=p.starred.filter(function(id){return id!==app.id;});p.recent=p.recent.filter(function(r){return r.id!==app.id;});hideSub();render();toast('Đã xóa ứng dụng “'+app.name+'”.');});
}

/* ---------- manage visibility ---------- */
function openManage(){
 function draw(){
  var p=prefs();
  var starred=p.starred.map(appById).filter(Boolean);
  var sysAll=heroApps().concat(schoolApps(),catalogApps());
  var gr=groups();
  var orderHtml=gr.map(function(g){var ap=g.appIds.map(appById).filter(Boolean);return '<div class="al-manage-item al-sec-row" draggable="true" data-seckey="'+g.id+'"><span class="al-drag" aria-label="Kéo để sắp xếp" title="Kéo để sắp xếp">'+ic('gripVertical',18)+'</span><span class="mi-ic">'+ic(sectionIcon(g.id),18)+'</span><span class="mi-name">'+esc(g.name)+'<small>'+ap.length+' ứng dụng</small></span></div>';}).join('');
  var pinnedHtml=starred.length?starred.map(function(a){return '<div class="al-manage-item al-pin-row" draggable="true" data-starkey="'+a.id+'"><span class="al-drag" aria-label="Kéo để sắp xếp" title="Kéo để sắp xếp">'+ic('gripVertical',18)+'</span><span class="mi-ic">'+ic(a.icon,18)+'</span><span class="mi-name">'+esc(a.name)+'</span><button class="al-iconbtn on" data-unstar="'+a.id+'" aria-label="Bỏ ghim" title="Bỏ ghim">'+ic('star',15,true)+'</button></div>';}).join(''):'<div style="color:#94A3B8;font-size:13.5px;padding:2px 2px 8px">Chưa ghim ứng dụng nào. Di chuột lên ứng dụng và bấm ngôi sao để ghim.</div>';
  var hideHtml=sysAll.map(function(a){var hid=isHidden(a.id);return '<div class="al-manage-item'+(hid?' hidden-app':'')+'"><span class="mi-ic">'+ic(a.icon,18)+'</span><span class="mi-name">'+esc(a.name)+'<small>'+esc(a.cat==='primary'?'Ứng dụng chính':catName(a.cat))+'</small></span><button class="al-iconbtn'+(hid?'':' on')+'" data-hide="'+a.id+'" aria-label="'+(hid?'Hiện':'Ẩn')+'" title="'+(hid?'Hiện':'Ẩn')+'">'+ic(hid?'eyeOff':'eye',15)+'</button></div>';}).join('');
  showSub(
   '<div class="al-sub-head"><h3>Quản lý hiển thị</h3><button class="al-x" id="mX" aria-label="Đóng">'+ic('x',20)+'</button></div>'
   +'<div class="al-sub-body">'
   +'<div class="al-mtitle">Thứ tự nhóm ứng dụng</div>'+orderHtml
   +'<div class="al-mtitle">Thứ tự ứng dụng đã ghim</div>'+pinnedHtml
   +'<div class="al-mtitle">Ẩn / hiện ứng dụng</div>'+hideHtml
   +'<div class="al-mtitle">Truy cập gần đây</div><button class="al-btn ghost small" id="mResetRecent">'+ic('history',15)+'Đặt lại lịch sử truy cập ('+p.recent.length+')</button>'
   +'</div>'
   +'<div class="al-sub-foot"><button class="al-btn primary" id="mDone">Xong</button></div>'
  );
  qs('#mX').addEventListener('click',hideSub);
  qs('#mDone').addEventListener('click',hideSub);
  (function(){var dragS=null;qsa('#alSubBox .al-pin-row').forEach(function(row){
    row.addEventListener('dragstart',function(){dragS=row.getAttribute('data-starkey');row.classList.add('dragging');});
    row.addEventListener('dragend',function(){row.classList.remove('dragging');qsa('#alSubBox .al-pin-row').forEach(function(r){r.classList.remove('dragover');});});
    row.addEventListener('dragover',function(e){e.preventDefault();row.classList.add('dragover');});
    row.addEventListener('dragleave',function(){row.classList.remove('dragover');});
    row.addEventListener('drop',function(e){e.preventDefault();var to=row.getAttribute('data-starkey');if(!dragS||dragS===to)return;var s=prefs().starred;var from=s.indexOf(dragS),ti=s.indexOf(to);if(from<0||ti<0)return;s.splice(ti,0,s.splice(from,1)[0]);draw();render();});
  });})();
  qsa('#alSubBox [data-unstar]').forEach(function(b){b.addEventListener('click',function(){toggleStar(b.getAttribute('data-unstar'));draw();render();});});
  qsa('#alSubBox [data-hide]').forEach(function(b){b.addEventListener('click',function(){toggleHidden(b.getAttribute('data-hide'));draw();render();});});
  (function(){var dragKey=null;qsa('#alSubBox .al-sec-row').forEach(function(row){
    row.addEventListener('dragstart',function(){dragKey=row.getAttribute('data-seckey');row.classList.add('dragging');});
    row.addEventListener('dragend',function(){row.classList.remove('dragging');qsa('#alSubBox .al-sec-row').forEach(function(r){r.classList.remove('dragover');});});
    row.addEventListener('dragover',function(e){e.preventDefault();row.classList.add('dragover');});
    row.addEventListener('dragleave',function(){row.classList.remove('dragover');});
    row.addEventListener('drop',function(e){e.preventDefault();var toKey=row.getAttribute('data-seckey');if(!dragKey||dragKey===toKey)return;var o=groups();var from=groupIndex(dragKey),to=groupIndex(toKey);if(from<0||to<0)return;o.splice(to,0,o.splice(from,1)[0]);draw();render();});
  });})();
  qs('#mResetRecent').addEventListener('click',function(){prefs().recent=[];draw();render();toast('Đã đặt lại lịch sử truy cập gần đây.');});
 }
 draw();
}

/* ---------- quản lý nhóm ứng dụng ---------- */
function openGroupsManager(){
 var creating=false,newName='',newSel={},addOpenFor=null;
 function draw(){
  var gr=groups(),orphan=orphanApps();
  var body='<button class="al-btn primary small" id="gmNew" style="margin-bottom:14px">'+ic('plus',15)+'Tạo nhóm mới</button>';
  if(creating){
   body+='<div class="al-gm-new">'
    +'<div class="al-field"><label>Tên nhóm mới <span class="req">*</span></label><input class="al-input" id="gmName" maxlength="50" placeholder="VD: Ứng dụng yêu thích" value="'+esc(newName)+'"><div class="al-err" id="gmNameErr"></div></div>'
    +'<div class="al-field"><label>Chọn ứng dụng (chưa thuộc nhóm nào)</label>'
    +(orphan.length?'<div class="al-pick-list">'+orphan.map(function(a){return '<label class="al-pick'+(newSel[a.id]?' on':'')+'" data-newpick="'+a.id+'"><span class="al-cb'+(newSel[a.id]?' on':'')+'">'+ic('check',13)+'</span><span class="al-pick-ic">'+ic(a.icon,18)+'</span><span class="al-pick-name">'+esc(a.name)+'</span></label>';}).join('')+'</div>':'<div class="al-note">Chưa có ứng dụng nào chưa thuộc nhóm. Hãy gỡ ứng dụng khỏi nhóm khác trước.</div>')
    +'</div>'
    +'<div style="display:flex;gap:8px;justify-content:flex-end"><button class="al-btn ghost small" id="gmCancel">Hủy</button><button class="al-btn primary small" id="gmCreate">'+ic('check',15)+'Tạo nhóm</button></div>'
   +'</div>';
  }
  body+=gr.map(function(g){
   var apps=g.appIds.map(appById).filter(Boolean);
   var h='<div class="al-gm-group"><div class="al-gm-head"><input class="al-input al-gm-name" data-rename="'+g.id+'" maxlength="50" value="'+esc(g.name)+'" aria-label="Tên nhóm">'+(g.custom?'<button class="al-iconbtn" data-delgroup="'+g.id+'" title="Xóa nhóm" aria-label="Xóa nhóm">'+ic('trash',15)+'</button>':'')+'</div>';
   h+='<div class="al-gm-apps">'+(apps.length?apps.map(function(a){return '<span class="al-chip">'+ic(a.icon,14)+esc(a.name)+'<button data-rmapp="'+g.id+'~'+a.id+'" aria-label="Gỡ '+esc(a.name)+' khỏi nhóm" title="Gỡ khỏi nhóm">'+ic('x',12)+'</button></span>';}).join(''):'<span class="al-note">Chưa có ứng dụng trong nhóm.</span>')+'<button class="al-chip add" data-addto="'+g.id+'">'+ic('plus',13)+'Thêm ứng dụng</button></div>';
   if(addOpenFor===g.id){
    h+='<div class="al-addpick"><span class="al-note">Chọn ứng dụng chưa thuộc nhóm để thêm:</span>'+(orphan.length?'<div class="al-gm-apps" style="margin-top:6px">'+orphan.map(function(a){return '<span class="al-chip orphan" data-addapp="'+g.id+'~'+a.id+'">'+ic(a.icon,14)+esc(a.name)+'</span>';}).join('')+'</div>':'<div class="al-note" style="margin-top:4px">Không có ứng dụng nào chưa thuộc nhóm.</div>')+'</div>';
   }
   return h+'</div>';
  }).join('');
  showSub('<div class="al-sub-head"><h3>Quản lý nhóm ứng dụng</h3><button class="al-x" id="gmX" aria-label="Đóng">'+ic('x',20)+'</button></div><div class="al-sub-body">'+body+'</div><div class="al-sub-foot"><button class="al-btn primary" id="gmDone">Xong</button></div>');
  qs('#gmX').addEventListener('click',hideSub);
  qs('#gmDone').addEventListener('click',hideSub);
  qs('#gmNew').addEventListener('click',function(){creating=!creating;if(!creating){newName='';newSel={};}draw();});
  if(creating){
   qs('#gmName').addEventListener('input',function(e){newName=e.target.value;});
   qsa('#alSubBox [data-newpick]').forEach(function(l){l.addEventListener('click',function(e){e.preventDefault();var id=l.getAttribute('data-newpick');if(newSel[id])delete newSel[id];else newSel[id]=1;draw();});});
   qs('#gmCancel').addEventListener('click',function(){creating=false;newName='';newSel={};draw();});
   qs('#gmCreate').addEventListener('click',function(){
    var nm=(newName||'').trim();
    if(nm.length<2||nm.length>50){qs('#gmNameErr').textContent='Tên nhóm phải từ 2 đến 50 ký tự.';qs('#gmNameErr').classList.add('show');qs('#gmName').classList.add('invalid');return;}
    if(groups().some(function(g){return norm(g.name)===norm(nm);})){qs('#gmNameErr').textContent='Tên nhóm đã tồn tại.';qs('#gmNameErr').classList.add('show');qs('#gmName').classList.add('invalid');return;}
    var ids=Object.keys(newSel);var p=prefs();p.groups.push({id:'g'+(p.gseq++),name:nm,appIds:ids,custom:true});
    creating=false;newName='';newSel={};draw();render();toast('Đã tạo nhóm “'+nm+'”'+(ids.length?(' với '+ids.length+' ứng dụng.'):'.'));
   });
  }
  qsa('#alSubBox [data-rename]').forEach(function(inp){inp.addEventListener('change',function(){var id=inp.getAttribute('data-rename');var nm=inp.value.trim();var cur=groupById(id);if(!cur)return;if(nm.length<2){inp.value=cur.name;toast('Tên nhóm phải từ 2 ký tự trở lên.');return;}if(groups().some(function(g){return g.id!==id&&norm(g.name)===norm(nm);})){inp.value=cur.name;toast('Tên nhóm đã tồn tại.');return;}cur.name=nm;render();});});
  qsa('#alSubBox [data-rmapp]').forEach(function(b){b.addEventListener('click',function(){var pr=b.getAttribute('data-rmapp').split('~');var g=groupById(pr[0]);if(g)g.appIds=g.appIds.filter(function(x){return x!==pr[1];});draw();render();});});
  qsa('#alSubBox [data-addto]').forEach(function(b){b.addEventListener('click',function(){var id=b.getAttribute('data-addto');addOpenFor=(addOpenFor===id?null:id);draw();});});
  qsa('#alSubBox [data-addapp]').forEach(function(b){b.addEventListener('click',function(){var pr=b.getAttribute('data-addapp').split('~');var g=groupById(pr[0]);if(g&&g.appIds.indexOf(pr[1])<0)g.appIds.push(pr[1]);draw();render();});});
  qsa('#alSubBox [data-delgroup]').forEach(function(b){b.addEventListener('click',function(){var id=b.getAttribute('data-delgroup');var p=prefs();p.groups=p.groups.filter(function(g){return g.id!==id;});if(addOpenFor===id)addOpenFor=null;draw();render();toast('Đã xóa nhóm.');});});
 }
 draw();
}

/* ---------- toast ---------- */
function toast(msg){var host=document.getElementById('alToastHost');var t=document.createElement('div');t.className='al-toast';t.textContent=msg;host.appendChild(t);setTimeout(function(){t.style.transition='opacity .2s';t.style.opacity='0';setTimeout(function(){t.remove();},220);},2600);}

})();
</script>
</body>
</html>
