      function canCreate() { var r = role(); return r === 'superadmin' || r === 'bgh' || r === 'to_truong'; }

      /* ---------- state ---------- */
      var state = { page: 'overview', q: '', fType: '', fStatus: '', _t: null, mDirty: false, xls: false, xlsSel: null };

      /* =====================================================================
         RENDER
         ===================================================================== */
      function root() { return document.getElementById('kpiRoot'); }
      function skeleton() {
        var cards = ''; for (var i = 0; i < 5; i++)cards += '<div class="kpi-kcard"><div class="kpi-sk" style="width:60%;margin-bottom:14px"></div><div class="kpi-sk" style="width:40%;height:26px"></div></div>';
        var rows = ''; for (var j = 0; j < 5; j++)rows += '<div class="kpi-sk" style="height:38px;margin:8px 0"></div>';
        return '<div class="kpi-screen"><div class="kpi-sk" style="width:280px;height:26px;margin-bottom:18px"></div>'
          + '<div class="kpi-kpis">' + cards + '</div><div class="table-card" style="padding:16px">' + rows + '</div></div>';
      }
      function render(page) {
        var el = root(); if (!el) return;
        var target = page || state.page || 'overview';
        if (target !== state.page && !state._keep) { state.q = ''; state.fType = ''; state.fStatus = ''; }
        state._keep = false;
        if (target !== 'detail') { state.detailEdit = false; EDIT_IND = null; }
        state.page = target;
        el.classList.remove('kpi-root-fill');
        el.innerHTML = skeleton();
        if (state._t) clearTimeout(state._t);
        state._t = setTimeout(paint, 300);
      }
      function repaint() { paint(); }
      function paint() {
        var el = root(); if (!el) return;
        try {
          if (state.page === 'detail') { var di = detailModel(); if (di) { if (detailUsesSheet(di)) { el.innerHTML = viewDetailXls(di); bindDetailXls(el, di); } else { el.innerHTML = viewDetail(di); bindDetailPage(el, di); } el.classList.toggle('kpi-root-fill', !!state.detailEdit); return; } state.page = state.returnPage || 'manage'; }
          if (state.page === 'overview') el.innerHTML = viewOverview();
          else if (state.page === 'report') el.innerHTML = viewReport();
          else if (state.page === 'types') el.innerHTML = viewTypes();
          else if (state.page === 'createxls') { el.innerHTML = viewCreateXls(); bindCreateXls(el); el.classList.add('kpi-root-fill'); return; }
          else if (state.page === 'manage' || state.page === 'catalog' || state.page === 'plan' || state.page === 'result') el.innerHTML = viewManage();
          else el.innerHTML = viewOverview();
          bind(el);
        } catch (err) {
          el.innerHTML = '<div class="kpi-screen"><div class="kpi-state err"><span class="st-ic">' + icn('alert', 26) + '</span>'
            + '<h3>Đã xảy ra lỗi khi tải dữ liệu</h3><p>' + e_(err && err.message ? err.message : 'Lỗi không xác định.') + '</p>'
            + '<button class="btn btn-primary" id="kpiRetry">' + icn('refresh', 16) + 'Thử lại</button></div></div>';
          var rt = q('#kpiRetry', el); if (rt) rt.addEventListener('click', function () { render(state.page); });
        }
      }
      function pageHead(title, sub, actions) {
        return '<div class="kpi-page-head"><div class="kh-l"><h1>' + e_(title) + '</h1>' + (sub ? '<div class="kh-sub">' + sub + '</div>' : '') + '</div>'
          + (actions ? '<div class="kh-actions">' + actions + '</div>' : '') + '</div>';
      }
      function ctxSub(extra) { return e_(SCHOOL) + ' · Năm học ' + e_(YEAR) + ' · ' + e_(PERIOD) + (extra ? ' · ' + extra : ''); }

      /* ---------- counts ---------- */
      function counts(list) {
        var c = { total: 0, ACHIEVED: 0, AT_RISK: 0, NOT_ACHIEVED: 0, NO_DATA: 0, NOT_DUE: 0, NA: 0, STOPPED: 0 };
        (list || INDICATORS).forEach(function (ind) { c.total++; var s = evaluate(ind); if (c[s] != null) c[s]++; });
        return c;
      }

      /* ---------- TỔNG QUAN ---------- */
      function viewOverview() {
        var c = counts();
        var cards = [
          { k: '', label: 'Tổng chỉ tiêu', val: c.total, tone: 'all', ic: 'target', sub: 'Đang theo dõi trong kỳ' },
          { k: 'ACHIEVED', label: 'Đạt', val: c.ACHIEVED, tone: 'ok', ic: 'checkCircle', sub: 'Hoàn thành mục tiêu' },
          { k: 'AT_RISK', label: 'Có nguy cơ', val: c.AT_RISK, tone: 'warn', ic: 'alert', sub: 'Cần theo dõi sát' },
          { k: 'NOT_ACHIEVED', label: 'Chưa đạt', val: c.NOT_ACHIEVED, tone: 'danger', ic: 'x', sub: 'Cần giải pháp' },
          { k: 'NO_DATA', label: 'Chưa có dữ liệu', val: c.NO_DATA, tone: 'neutral', ic: 'clipboardMin', sub: 'Chờ cập nhật' },
          { k: 'STOPPED', label: 'Ngừng thực hiện', val: c.STOPPED, tone: 'neutral', ic: 'pause', sub: 'Tạm ngừng theo dõi' }
        ].map(function (x) {
          return '<div class="kpi-kcard" data-status="' + x.k + '" tabindex="0" role="button">'
            + '<div class="kk-top"><span class="kk-label">' + e_(x.label) + '</span><span class="kk-ic t-' + x.tone + '">' + icn(x.ic, 18) + '</span></div>'
            + '<div class="kk-val ' + (x.tone === 'ok' ? 't-ok' : x.tone === 'warn' ? 't-warn' : x.tone === 'danger' ? 't-danger' : '') + '">' + x.val + '</div>'
            + '<div class="kk-sub">' + e_(x.sub) + '</div></div>';
        }).join('');

        /* Việc cần làm (ưu tiên: quá hạn → chưa có dữ liệu → chưa đạt → sắp đến hạn → có nguy cơ) */
        var todos = [];
        INDICATORS.forEach(function (ind) {
          var s = evaluate(ind), ds = deadlineState(ind);
          if (s === 'STOPPED') return; /* chỉ tiêu đã ngừng: không đưa vào việc cần làm */
          if (ds.k === 'overdue' && s !== 'ACHIEVED') todos.push({ p: 0, ind: ind, ic: 'alert', t: 'Quá hạn', d: 'Đã quá hạn ' + Math.abs(ds.d) + ' ngày (hạn ' + ind.deadline + ').' });
          else if (s === 'NO_DATA') todos.push({ p: 1, ind: ind, ic: 'clipboardMin', t: 'Chưa có dữ liệu', d: canEditManual(ind) ? 'Bạn được phân công cập nhật số liệu này.' : 'Chờ đơn vị phụ trách cập nhật.' });
          else if (s === 'NOT_ACHIEVED') todos.push({ p: 2, ind: ind, ic: 'alert', t: 'Chưa đạt chỉ tiêu', d: 'Rà soát nguyên nhân và đề xuất giải pháp.' });
          else if (ds.k === 'soon' && s !== 'ACHIEVED') todos.push({ p: 3, ind: ind, ic: 'clock', t: 'Sắp đến hạn', d: 'Còn ' + ds.d + ' ngày (hạn ' + ind.deadline + ').' });
          else if (s === 'AT_RISK') todos.push({ p: 4, ind: ind, ic: 'alert', t: 'Có nguy cơ không đạt', d: 'Theo dõi sát tiến độ thực hiện.' });
          else if (s === 'NOT_DUE' && canEditManual(ind)) todos.push({ p: 5, ind: ind, ic: 'clock', t: 'Sắp đến hạn cập nhật', d: 'Hạn: ' + (ind.deadline || (ind.plan && ind.plan.dueLabel) || '—') + '.' });
        });
        todos.sort(function (a, b) { return a.p - b.p; });
        todos = todos.slice(0, 5);
        var todoHtml = todos.length ? todos.map(function (x) {
          return '<div class="kpi-todo" data-open="' + x.ind.code + '" tabindex="0" role="button"><span class="ti-ic">' + icn(x.ic, 17) + '</span>'
            + '<div class="ti-b"><b>' + e_(x.ind.name) + ' <span style="color:var(--ks-muted);font-weight:600">(' + e_(x.ind.code) + ')</span></b><span>' + e_(x.t) + ' — ' + e_(x.d) + '</span></div>'
            + statusChip(evaluate(x.ind), true) + '</div>';
        }).join('') : '<div class="kpi-mininfo" style="padding:8px 0">Không có việc cần xử lý. Tất cả chỉ tiêu đang trong tầm kiểm soát.</div>';

        /* Tiến độ theo người phụ trách */
        var owners = []; INDICATORS.forEach(function (i) { var o = (i.owner || '—'); if (owners.indexOf(o) < 0) owners.push(o); });
        var prog = owners.map(function (o) {
          var inO = INDICATORS.filter(function (i) { return (i.owner || '—') === o && evaluate(i) !== 'NA' && evaluate(i) !== 'STOPPED'; });
          var ok = inO.filter(function (i) { return evaluate(i) === 'ACHIEVED'; }).length;
          var p = inO.length ? Math.round(ok / inO.length * 100) : 0;
          var col = p >= 80 ? 'var(--ks-success)' : p >= 50 ? 'var(--ks-warning)' : 'var(--ks-danger)';
          return '<div class="kpi-progline"><span class="pl-label" title="' + e_(o) + '">' + e_(o) + '</span>'
            + '<span class="pl-bar"><i style="width:' + p + '%;background:' + col + '"></i></span><span class="pl-num">' + p + '%</span></div>';
        }).join('');

        /* Chỉ tiêu nổi bật */
        var feat = ['2210', 'CT001', '2202', 'CT002', '2205'].map(byCode).filter(Boolean);
        var featRows = feat.map(function (ind) {
          return '<tr class="row-click" data-open="' + ind.code + '">'
            + '<td><b>' + e_(ind.code) + '</b></td>'
            + '<td><div style="font-weight:600;color:var(--ks-text)">' + e_(ind.name) + '</div></td>'
            + '<td class="kpi-typecell"><span class="kpi-tag">' + icn('function2', 12) + e_(typeName(ind.evaluationType)) + '</span></td>'
            + '<td>' + progCell(ind) + '</td>'
            + '<td>' + statusChip(evaluate(ind)) + '</td>'
            + '<td>' + deadlineChip(ind) + '</td>'
            + '<td>' + (ind.result && ind.result.updatedAt ? '<span class="kpi-mininfo">' + e_(ind.result.updatedAt) + '</span>' : '<span class="kpi-mininfo">—</span>') + '</td>'
            + '<td>' + e_(ind.owner || '—') + '</td>'
            + '<td>' + (ind.desc ? '<span class="kpi-mininfo">' + e_(ind.desc) + '</span>' : '<span class="kpi-mininfo">—</span>') + '</td>'
            + '</tr>';
        }).join('');
        var featCards = feat.map(rowCard).join('');

        return '<div class="kpi-screen">'
          + pageHead('Chỉ tiêu nhà trường', '', '<button class="btn btn-outline btn-sm" id="kpiGoResult">' + icn('listChecks', 16) + 'Xem kết quả chi tiết</button>')
          + '<div class="kpi-kpis">' + cards + '</div>'
          + '<div class="kpi-2col">'
          + '<div class="kpi-panel"><h3>' + icn('listChecks', 18) + 'Việc cần làm</h3>' + todoHtml + '</div>'
          + '<div class="kpi-panel"><h3>' + icn('barChart3', 18) + 'Tiến độ theo người phụ trách</h3>' + prog
          + '<div class="kpi-mininfo" style="margin-top:6px">Tỷ lệ chỉ tiêu <b>Đạt</b> trên tổng số chỉ tiêu được đánh giá của mỗi người phụ trách.</div></div>'
          + '</div>'
          + '<div class="kpi-panel" style="padding:0">'
          + '<h3 style="padding:16px 18px 0">' + icn('target', 18) + 'Chỉ tiêu nổi bật<a class="cta btn btn-ghost btn-sm" id="kpiGoResult2" style="text-decoration:none">Tất cả ' + icn('chevronRight', 15) + '</a></h3>'
          + '<div class="table-card kpi-desktop-table" style="border:none;box-shadow:none;margin-top:8px"><div class="table-wrap"><table class="ks-table" style="min-width:1290px"><colgroup><col style="width:70px"><col style="width:250px"><col style="width:190px"><col style="width:140px"><col style="width:130px"><col style="width:130px"><col style="width:130px"><col style="width:150px"><col style="width:200px"></colgroup>'
          + '<thead><tr><th>Mã</th><th>Tên chỉ tiêu</th><th>Loại</th><th>% hoàn thành</th><th>Trạng thái</th><th>Deadline</th><th>Cập nhật lần cuối</th><th>Người phụ trách</th><th>Ghi chú</th></tr></thead>'
          + '<tbody>' + featRows + '</tbody></table></div></div>'
          + '<div class="kpi-card-list">' + featCards + '</div>'
          + '</div>'
          + '</div>';
      }

      /* ---------- card (mobile) cho 1 chỉ tiêu ---------- */
      function rowCard(ind) {
        return '<div class="kpi-rowcard" data-open="' + ind.code + '" tabindex="0" role="button">'
          + '<div class="rc-top"><div><div class="rc-name">' + e_(ind.name) + '</div><div class="rc-code">' + e_(ind.code) + ' · ' + e_(ind.unit || '—') + '</div></div>' + statusChip(evaluate(ind), true) + '</div>'
          + '<div class="rc-kv"><em>Kế hoạch</em><span>' + targetTxt(ind) + '</span></div>'
          + '<div class="rc-kv"><em>Thực hiện</em><span>' + actualTxt(ind) + '</span></div>'
          + '<div class="rc-kv"><em>% hoàn thành</em><span>' + pctTxt(ind) + '</span></div>'
          + (ind.deadline ? '<div class="rc-kv"><em>Thời hạn</em><span>' + deadlineChip(ind) + '</span></div>' : '')
          + '<div class="rc-foot">' + srcBadge(ind.dataSource) + '<span class="rc-code">' + e_(ind.owner || '') + '</span></div>'
          + '</div>';
      }

      /* ---------- filter helpers ---------- */
      function baseFiltered() { /* lọc theo nhóm/nguồn/tìm kiếm, BỎ QUA trạng thái (để đếm cho tab) */
        var q0 = norm(state.q);
        return INDICATORS.filter(function (ind) {
          if (state.fType && ind.evaluationType !== state.fType) return false;
          if (q0) { var hay = norm(ind.code + ' ' + ind.name + ' ' + (ind.owner || '') + ' ' + (ind.desc || '')); if (hay.indexOf(q0) < 0) return false; }
          return true;
        });
      }
      function filtered() { var st = state.fStatus; return baseFiltered().filter(function (ind) { return !st || evaluate(ind) === st; }); }
      function filterBar(withStatus) {
        var used = []; INDICATORS.forEach(function (i) { if (used.indexOf(i.evaluationType) < 0) used.push(i.evaluationType); });
        var typ = '<select class="kpi-select" id="kpiFType"><option value="">Tất cả loại</option>' + used.map(function (k) { return '<option value="' + e_(k) + '"' + (state.fType === k ? ' selected' : '') + '>' + e_(typeName(k)) + '</option>'; }).join('') + '</select>';
        var st = '';
        if (withStatus) {
          st = '<select class="kpi-select" id="kpiFStatus"><option value="">Mọi trạng thái</option>'
            + ['ACHIEVED', 'AT_RISK', 'NOT_ACHIEVED', 'NO_DATA', 'NOT_DUE', 'NA', 'STOPPED'].map(function (k) { return '<option value="' + k + '"' + (state.fStatus === k ? ' selected' : '') + '>' + e_(ST[k].label) + '</option>'; }).join('') + '</select>';
        }
        return '<div class="table-card kpi-filters">'
          + '<div class="search-box"><span class="s-icon">' + icn('search', 18) + '</span><input type="text" id="kpiSearch" placeholder="Tìm theo mã, tên chỉ tiêu, người phụ trách…" value="' + e_(state.q) + '" aria-label="Tìm chỉ tiêu"></div>'
          + typ + st
          + (state.q || state.fType || state.fStatus ? '<button class="btn btn-ghost btn-sm" id="kpiClearF">' + icn('x', 15) + 'Xóa lọc</button>' : '')
          + '</div>';
      }

      /* ---------- QUẢN LÝ CHỈ TIÊU (gộp Danh sách + Kế hoạch + Kết quả, chia theo trạng thái) ---------- */
      function statusTabs() {
        var base = baseFiltered();
        var cnt = function (code) { return base.filter(function (i) { return evaluate(i) === code; }).length; };
        var defs = [['', 'Tất cả', base.length],
        ['ACHIEVED', ST.ACHIEVED.label, cnt('ACHIEVED')],
        ['AT_RISK', ST.AT_RISK.label, cnt('AT_RISK')],
        ['NOT_ACHIEVED', ST.NOT_ACHIEVED.label, cnt('NOT_ACHIEVED')],
        ['NO_DATA', ST.NO_DATA.label, cnt('NO_DATA')],
        ['NOT_DUE', ST.NOT_DUE.label, cnt('NOT_DUE')],
        ['NA', ST.NA.label, cnt('NA')],
        ['STOPPED', ST.STOPPED.label, cnt('STOPPED')]];
        return '<div class="tabs kpi-tabs">' + defs.map(function (d) {
          return '<button class="tab' + (state.fStatus === d[0] ? ' active' : '') + '" data-tab="' + d[0] + '">' + e_(d[1]) + '<span class="tcount">' + d[2] + '</span></button>';
        }).join('') + '</div>';
      }
      function viewManage() {
        var actions = (canCreate() ? '<button class="btn btn-primary btn-sm" id="kpiCreateBtn">' + icn('plus', 16) + 'Tạo mới chỉ tiêu</button>' : '')
          + '<button class="btn btn-outline btn-sm" id="kpiExportR">' + icn('download', 16) + 'Xuất báo cáo</button>';
        return '<div class="kpi-screen">'
          + pageHead('Quản lý chỉ tiêu', '', actions)
          + statusTabs()
          + filterBar(false)
          + '<div id="kpiResultBody"></div>'
          + '</div>';
      }
      function resultBody() {
        var list = filtered();
        if (!list.length) return emptyState();
        var rows = list.map(function (ind) {
          return '<tr class="row-click" data-open="' + ind.code + '">'
            + '<td><b>' + e_(ind.code) + '</b></td>'
            + '<td><div style="font-weight:600;color:var(--ks-text)">' + e_(ind.name) + '</div></td>'
            + '<td class="kpi-typecell"><span class="kpi-tag">' + icn('function2', 12) + e_(typeName(ind.evaluationType)) + '</span></td>'
            + '<td>' + progCell(ind) + '</td>'
            + '<td>' + statusChip(evaluate(ind)) + '</td>'
            + '<td>' + deadlineChip(ind) + '</td>'
            + '<td>' + (ind.result && ind.result.updatedAt ? '<span class="kpi-mininfo">' + e_(ind.result.updatedAt) + '</span>' : '<span class="kpi-mininfo">—</span>') + '</td>'
            + '<td>' + e_(ind.owner || '—') + '</td>'
            + '<td>' + (ind.desc ? '<span class="kpi-mininfo">' + e_(ind.desc) + '</span>' : '<span class="kpi-mininfo">—</span>') + '</td>'
            + '</tr>';
        }).join('');
        var head = '<thead><tr><th>Mã</th><th>Tên chỉ tiêu</th><th>Loại</th><th>% hoàn thành</th><th>Trạng thái</th><th>Deadline</th><th>Cập nhật lần cuối</th><th>Người phụ trách</th><th>Ghi chú</th></tr></thead>';
        return '<div class="table-card kpi-desktop-table"><div class="table-wrap"><table class="ks-table" style="min-width:1290px"><colgroup><col style="width:70px"><col style="width:250px"><col style="width:190px"><col style="width:140px"><col style="width:130px"><col style="width:130px"><col style="width:130px"><col style="width:150px"><col style="width:200px"></colgroup>'
          + head + '<tbody>' + rows + '</tbody></table></div></div>'
          + '<div class="kpi-card-list">' + list.map(rowCard).join('') + '</div>';
      }
      function emptyState() {
        return '<div class="table-card"><div class="kpi-state"><span class="st-ic">' + icn('search', 26) + '</span>'
          + '<h3>Không tìm thấy chỉ tiêu phù hợp</h3><p>Thử thay đổi từ khóa hoặc bộ lọc để xem thêm kết quả.</p>'
          + '<button class="btn btn-outline btn-sm" id="kpiClearF2">' + icn('x', 15) + 'Xóa bộ lọc</button></div></div>';
      }
      function fillResult(el) {
        var b = q('#kpiResultBody', el || root()); if (!b) return;
        b.innerHTML = resultBody();
        bindOpeners(b);
        var c2 = q('#kpiClearF2', b); if (c2) c2.addEventListener('click', clearFilters);
      }

      /* ---------- DANH SÁCH CHỈ TIÊU (metadata) ---------- */
      function viewCatalog() {
        return '<div class="kpi-screen">'
          + pageHead('Danh sách chỉ tiêu', 'Danh mục định nghĩa chỉ tiêu: nhóm, đơn vị, nguồn dữ liệu và cách đánh giá. ' + ctxSub(), '')
          + filterBar(false)
          + '<div id="kpiResultBody"></div>'
          + '</div>';
      }
      function catalogBody() {
        var list = filtered();
        if (!list.length) return emptyState();
        var rows = list.map(function (ind) {
          return '<tr class="row-click" data-open="' + ind.code + '"><td><b>' + e_(ind.code) + '</b></td>'
            + '<td><div style="font-weight:600">' + e_(ind.name) + '</div><div class="kpi-mininfo" style="margin-top:2px">' + e_(ind.desc || '') + '</div></td>'
            + '<td>' + e_(ind.group) + '</td><td>' + e_(ind.unit || '—') + '</td><td>' + srcBadge(ind.dataSource) + '</td>'
            + '<td><span class="kpi-tag">' + icn('function2', 12) + e_(typeName(ind.evaluationType)) + '</span></td>'
            + '<td>' + e_(ind.owner || '—') + '</td></tr>';
        }).join('');
        var head = '<thead><tr><th>Mã</th><th>Chỉ tiêu</th><th>Nhóm</th><th>Đơn vị</th><th>Nguồn dữ liệu</th><th>Loại đánh giá</th><th>Người phụ trách</th></tr></thead>';
        return '<div class="table-card kpi-desktop-table"><div class="table-wrap"><table class="ks-table" style="min-width:1000px">' + head + '<tbody>' + rows + '</tbody></table></div></div>'
          + '<div class="kpi-card-list">' + list.map(function (ind) {
            return '<div class="kpi-rowcard" data-open="' + ind.code + '" tabindex="0" role="button"><div class="rc-top"><div><div class="rc-name">' + e_(ind.name) + '</div><div class="rc-code">' + e_(ind.code) + ' · ' + e_(ind.group) + '</div></div>' + srcBadge(ind.dataSource) + '</div>'
              + '<div class="rc-kv"><em>Đơn vị</em><span>' + e_(ind.unit || '—') + '</span></div>'
              + '<div class="rc-kv"><em>Loại đánh giá</em><span>' + e_(typeName(ind.evaluationType)) + '</span></div>'
              + '<div class="rc-kv"><em>Phụ trách</em><span>' + e_(ind.owner || '—') + '</span></div></div>';
          }).join('') + '</div>';
      }

      /* ---------- KẾ HOẠCH CHỈ TIÊU ---------- */
      function viewPlan() {
        return '<div class="kpi-screen">'
          + pageHead('Kế hoạch chỉ tiêu', 'Mức chỉ tiêu kế hoạch đã đăng ký theo kỳ. ' + ctxSub(), '')
          + filterBar(false)
          + '<div id="kpiResultBody"></div>'
          + '</div>';
      }
      function planBody() {
        var list = filtered();
        if (!list.length) return emptyState();
        var rows = list.map(function (ind) {

        if (c === 'RANGE') return 'Đạt khi Thực hiện trong khoảng min–max (ngưỡng ' + fmt((t.riskBand || 0) * 100) + '%).';
        if (c === 'BAND') return (t.bands || []).map(function (b) { return bandText(b, t.unit); }).join(' · ') || 'Chưa cấu hình thang.';

        var rows = SETS.map(function (s) { return '<tr class="row-click" data-set="' + s.code + '"><td><b>' + e_(s.code) + '</b></td><td style="font-weight:600">' + e_(s.name) + '</td><td>' + e_(s.schoolLevel) + '</td><td>' + e_(s.org) + '</td><td>' + e_(s.year) + '</td><td>' + e_(s.version) + '</td><td class="op-num">' + s.count + '</td><td><span class="chip ' + (s.status === 'Đang áp dụng' ? 'chip-completed' : 'chip-draft') + '">' + e_(s.status) + '</span></td><td><button class="btn btn-ghost btn-sm op-set-detail" data-set="' + s.code + '">' + icn('eye', 15) + 'Chi tiết</button></td></tr>'; }).join('');
        var cards = SETS.map(function (s) { return '<div class="op-card"><div class="oc-top"><div><div class="oc-name">' + e_(s.name) + '</div><div class="oc-code">' + e_(s.code) + ' · ' + e_(s.year) + '</div></div><span class="chip ' + (s.status === 'Đang áp dụng' ? 'chip-completed' : 'chip-draft') + '">' + e_(s.status) + '</span></div><div class="oc-kv"><em>Cấp học</em><span>' + e_(s.schoolLevel) + '</span></div><div class="oc-kv"><em>Số chỉ tiêu</em><span>' + s.count + '</span></div><div style="margin-top:8px"><button class="btn btn-ghost btn-sm op-set-detail" data-set="' + s.code + '">Chi tiết</button></div></div>'; }).join('');
        return '<div class="op-screen">' + head('Bộ chỉ tiêu', 'Tập hợp chỉ tiêu áp dụng theo cấp học, đơn vị, năm học hoặc nghiệp vụ.', actions)
          + '<div class="op-tablecard op-desktop"><div class="table-wrap" style="overflow-x:auto"><table class="ks-table" style="min-width:920px"><thead><tr><th>Mã</th><th>Tên bộ chỉ tiêu</th><th>Cấp học</th><th>Đơn vị</th><th>Năm học</th><th>Version</th><th>Số CT</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>'
          + '<div class="op-cards">' + cards + '</div></div>';
      }
      function viewPlan() {
        var wfIdx = (state.wf == null ? 3 : state.wf);
        var wf = '<div class="op-wf">' + WF.map(function (w, i) { return '<span class="wf-step' + (i < wfIdx ? ' done' : (i === wfIdx ? ' active' : '')) + '">' + (i < wfIdx ? icn('check', 13) : '') + e_(w) + '</span>' + (i < WF.length - 1 ? '<span class="wf-arrow">' + icn('chevronRight', 15) + '</span>' : ''); }).join('') + '</div>';
        var canAdv = (orole() !== 'giao_vien');
        var actions = (opCanCreate() ? '<button class="btn btn-primary btn-sm" id="opPlanNew">' + icn('plus', 16) + 'Khởi tạo kế hoạch</button>' : '') + '<button class="btn btn-outline btn-sm" id="opPlanImport">' + icn('upload', 16) + 'Import Excel</button>'
          + (canAdv && wfIdx < WF.length - 1 ? '<button class="btn btn-outline btn-sm" id="opWfNext">' + icn('send', 16) + 'Chuyển: ' + WF[wfIdx + 1] + '</button>' : '');
        var rows = PLAN.map(function (p) { return '<tr><td><b>' + e_(p.code) + '</b></td><td style="font-weight:600">' + e_(p.name) + '</td><td>' + e_(p.prev) + '</td><td>' + e_(p.assigned) + '</td><td><b>' + e_(p.plan) + '</b></td><td>' + e_(p.responsible) + '</td><td>' + e_(p.deadline) + '</td><td><div class="prog"><div class="prog-bar"><div class="prog-fill ' + (p.progress >= 100 ? 'done' : '') + '" style="width:' + Math.max(3, p.progress) + '%"></div></div><span class="prog-num">' + p.progress + '%</span></div></td></tr>'; }).join('');
        var cards = PLAN.map(function (p) { return '<div class="op-card"><div class="oc-top"><div><div class="oc-name">' + e_(p.name) + '</div><div class="oc-code">' + e_(p.code) + '</div></div></div><div class="oc-kv"><em>Kế hoạch</em><span><b>' + e_(p.plan) + '</b></span></div><div class="oc-kv"><em>Phụ trách</em><span>' + e_(p.responsible) + '</span></div><div class="oc-kv"><em>Deadline</em><span>' + e_(p.deadline) + '</span></div><div class="oc-kv"><em>Tiến độ</em><span>' + p.progress + '%</span></div></div>'; }).join('');
        return '<div class="op-screen">' + head('Kế hoạch chỉ tiêu', 'Lập kế hoạch, giao chỉ tiêu và theo dõi tiến độ (TARGET ≠ ACTUAL).', actions)
          + ctxBar() + wf
          + '<div class="op-tablecard op-desktop"><div class="table-wrap" style="overflow-x:auto"><table class="ks-table" style="min-width:960px"><thead><tr><th>Mã</th><th>Chỉ tiêu</th><th>Năm trước</th><th>Cấp trên giao</th><th>Kế hoạch</th><th>Phụ trách</th><th>Deadline</th><th>Tiến độ</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>'
          + '<div class="op-cards">' + cards + '</div></div>';
      }

      /* =====================================================================
         DRAWER CHI TIẾT (tabs: Thông tin | Dữ liệu | Minh chứng | Lịch sử)
         ===================================================================== */
      function openOpDrawer(code, tab) {
        var c = critByCode(code) || catByCode(code); if (!c) return;
        state.dCode = code; state.dTab = tab || 'info';
        var dr = q('#opDrawer'); if (!dr) return;
        dr.innerHTML = drawerHtml(c);
        try { openDrawer(dr, function () { closeDrawer(dr); }); } catch (e) { dr.classList.add('show'); }
        bindDrawer(dr, c);
      }
      function drawerHtml(c) {
        var isCrit = (c.nature !== undefined && c.evaluationType !== undefined && (c.updatedAt !== undefined || c.result !== undefined || c.actual !== undefined || c.evidence !== undefined));
        var s = isCrit ? opEval(c) : null;
        var tabs = ['info', 'data', 'evi', 'hist'], lbls = { info: 'Thông tin', data: 'Dữ liệu', evi: 'Minh chứng', hist: 'Lịch sử' };
        var tabbar = '<div class="tabs">' + tabs.map(function (t) { return '<button class="tab' + (state.dTab === t ? ' active' : '') + '" data-tab="' + t + '">' + e_(lbls[t]) + (t === 'evi' && c.evidence && c.evidence.length ? ' <span class="tcount">' + c.evidence.length + '</span>' : '') + '</button>'; }).join('') + '</div>';
        var body = '';
        if (state.dTab === 'info') {
          var row = function (k, v) { return '<div class="op-kv"><span class="k">' + k + '</span><span class="v">' + v + '</span></div>'; };
          body = '<div class="op-panel-body">' + row('Mã', '<b>' + e_(c.code) + '</b>') + row('Tên', e_(c.name)) + row('Nhóm', e_(c.group || '—')) + row('Đơn vị', e_(c.unit || '—'))
            + row('Tính chất', e_(NATURE[c.nature] || '—')) + row('Nguồn', opSrc(c.source)) + row('Kiểu đánh giá', e_(EVT[c.evaluationType] || c.evaluationType || '—'))
            + row('Mức yêu cầu', e_(opRequire(c))) + (isCrit ? row('Kết quả', opChip(s, true)) : '')
            + (c.formula ? '<div style="margin-top:12px"><div class="op-mininfo" style="margin-bottom:6px">Công thức</div><div class="kpi-formula">' + icn('function2', 15) + ' &nbsp;' + e_(c.formula) + '</div></div>' : '') + '</div>';
        } else if (state.dTab === 'data') {
          var comp = (c.components || []).map(function (x) { return '<div class="op-kv"><span class="k">' + e_(x.name) + '</span><span class="v">' + opFmt(x.value) + '</span></div>'; }).join('') || '<div class="op-mininfo">Không có dữ liệu thành phần.</div>';
          body = '<div><div class="op-kv"><span class="k">Nguồn dữ liệu</span><span class="v">' + opSrc(c.source) + '</span></div>'
            + '<div class="op-kv"><span class="k">Giá trị thực tế</span><span class="v">' + (isCrit ? opActualText(c) : '—') + '</span></div>'
            + '<div class="op-kv"><span class="k">Cập nhật</span><span class="v">' + e_(c.updatedAt || '—') + (c.updatedBy ? ' · ' + e_(c.updatedBy) : '') + '</span></div>'
            + '<div style="margin-top:12px"><div class="op-mininfo" style="margin-bottom:6px">Dữ liệu thành phần</div>' + comp + '</div>'
            + (c.source !== 'MANUAL' ? '<div style="margin-top:12px"><button class="btn btn-outline btn-sm" id="opDrExplain">' + icn('info', 15) + 'Giải thích số liệu</button></div>' : '')
            + '</div>';
        } else if (state.dTab === 'evi') {
          var evi = (c.evidence || []).map(function (f, i) {
            return '<div class="op-evi"><span class="ev-ic">' + icn(f.type === 'xlsx' ? 'fileText' : 'paperclip', 18) + '</span><div style="flex:1"><div style="font-weight:600;color:var(--ks-text)">' + e_(f.name) + '</div><div class="ev-meta">' + e_(f.by || '') + ' · ' + e_(f.at || '') + '</div></div>'
              + '<button class="btn btn-ghost btn-sm" title="Tải">' + icn('download', 15) + '</button>' + (opCanEval(c) ? '<button class="btn btn-ghost btn-sm op-evi-del" data-i="' + i + '" title="Xóa">' + icn('trash', 15) + '</button>' : '') + '</div>';
          }).join('') || '<div class="op-mininfo" style="padding:8px 0">Chưa có minh chứng.</div>';
          body = '<div>' + evi + (opCanEval(c) ? '<button class="btn btn-outline btn-sm" id="opEviAdd" style="margin-top:10px">' + icn('plus', 15) + 'Thêm minh chứng</button>' : '') + '</div>';
        } else {
          var hist = (c.history || []).map(function (h) { return '<tr><td class="op-mininfo" style="white-space:nowrap">' + e_(h.at) + '</td><td>' + e_(h.by) + '</td><td>' + e_(h.action || '') + '</td><td class="op-mininfo">' + e_(h.old == null ? '—' : h.old) + ' → <b style="color:var(--ks-navy)">' + e_(h.new == null ? '—' : h.new) + '</b></td></tr>'; }).join('') || '<tr><td colspan="4"><div class="op-mininfo">Chưa có lịch sử.</div></td></tr>';
          body = '<div class="table-wrap"><table class="ks-table" style="min-width:520px"><thead><tr><th>Thời gian</th><th>Người thực hiện</th><th>Hành động</th><th>Thay đổi</th></tr></thead><tbody>' + hist + '</tbody></table></div>';
        }
        var foot = '';
        if (isCrit && opCanEval(c)) {
          if (c.nature === 'qual') foot = '<button class="btn btn-primary" id="opDrEval">' + icn('pencil', 16) + 'Đánh giá</button>';
          else if (c.source === 'MANUAL') foot = '<button class="btn btn-primary" id="opDrUpd">' + icn('pencil', 16) + 'Cập nhật số liệu</button>';
        } else if (isCrit && c.source !== 'MANUAL') { foot = '<div class="kpi-auto">' + icn('refresh', 16) + 'Tự động cập nhật — không nhập tay.</div>'; }
        return '<div class="drawer-head"><div class="dh-titles"><div class="dh-meta"><span class="kpi-srcbadge">' + e_(c.code) + '</span>' + (isCrit ? opChip(s, true) : opSrc(c.source)) + '</div><h2>' + e_(c.name) + '</h2></div>'
          + '<button class="btn btn-ghost dh-close" id="opDrClose" aria-label="Đóng">' + icn('x', 18) + '</button></div>'
          + tabbar + '<div class="drawer-body">' + body + '</div>' + (foot ? '<div class="drawer-foot" style="justify-content:flex-end">' + foot + '</div>' : '');
      }
      function bindDrawer(dr, c) {
        var cl = q('#opDrClose', dr); if (cl) cl.addEventListener('click', function () { try { closeDrawer(dr); } catch (e) { dr.classList.remove('show'); } });
        qa('.tab', dr).forEach(function (t) { t.addEventListener('click', function () { state.dTab = t.getAttribute('data-tab'); dr.innerHTML = drawerHtml(c); bindDrawer(dr, c); }); });
        var ev = q('#opDrEval', dr); if (ev) ev.addEventListener('click', function () { openEvalModal(c.code); });
        var up = q('#opDrUpd', dr); if (up) up.addEventListener('click', function () { openUpdModal(c.code); });
        var ex = q('#opDrExplain', dr); if (ex) ex.addEventListener('click', function () { openExplain(c.code); });
        var ea = q('#opEviAdd', dr); if (ea) ea.addEventListener('click', function () { addEvidence(c); });
        qa('.op-evi-del', dr).forEach(function (b) { b.addEventListener('click', function () { var i = +b.getAttribute('data-i'); (c.evidence || []).splice(i, 1); pushHist(c, 'Xóa minh chứng', '', ''); state.dTab = 'evi'; dr.innerHTML = drawerHtml(c); bindDrawer(dr, c); tst('info', 'Đã xóa minh chứng', ''); }); });
      }
      function addEvidence(c) {
        c.evidence = c.evidence || []; var n = c.evidence.length + 1;
        c.evidence.push({ name: 'Minh chứng ' + n + '.pdf', type: 'pdf', by: ocur().name, at: TODAY });
        pushHist(c, 'Thêm minh chứng', '', 'Minh chứng ' + n + '.pdf');
        tst('success', 'Đã thêm minh chứng', '(mô phỏng) Tệp đã được đính kèm và ghi nhật ký.');
        var dr = q('#opDrawer'); if (dr) { state.dTab = 'evi'; dr.innerHTML = drawerHtml(c); bindDrawer(dr, c); }
        repaintResultBody();
      }

      /* =====================================================================
         MODALS: giải thích, đánh giá định tính, cập nhật manual
         ===================================================================== */
      function opModalOpen(html) { var w = q('#opModalWrap'), b = q('#opModal'); if (!w || !b) return; b.innerHTML = html; w.classList.add('show'); w.onclick = function (e) { if (e.target === w) opModalClose(); }; setTimeout(function () { var f = b.querySelector('input,select,textarea,button'); if (f) f.focus(); }, 50); }
      function opModalClose() { var w = q('#opModalWrap'); if (w) { w.classList.remove('show'); w.onclick = null; } }
      function openExplain(code) {
        var c = critByCode(code); if (!c) return;
        var comp = (c.components || []).map(function (x) { return '<div class="op-kv"><span class="k">' + e_(x.name) + '</span><span class="v">' + opFmt(x.value) + '</span></div>'; }).join('') || '<div class="op-mininfo">Không có dữ liệu thành phần.</div>';
        opModalOpen('<div class="modal-head"><span class="m-ic info">' + icn('info', 20) + '</span><div><h3>Giải thích số liệu</h3><p>' + e_(c.code) + ' — ' + e_(c.name) + '</p></div></div>'
          + '<div class="modal-body">'
          + '<div class="op-kv"><span class="k">Giá trị</span><span class="v">' + opActualText(c) + '</span></div>'
          + (c.formula ? '<div style="margin:8px 0"><div class="op-mininfo" style="margin-bottom:6px">Công thức</div><div class="kpi-formula">' + icn('function2', 15) + ' &nbsp;' + e_(c.formula) + '</div></div>' : '')
          + '<div class="op-mininfo" style="margin:10px 0 6px">Dữ liệu thành phần</div>' + comp
          + '<div class="op-kv"><span class="k">Nguồn</span><span class="v">' + opSrc(c.source) + '</span></div>'
          + '<div class="op-kv"><span class="k">Cập nhật</span><span class="v">' + e_(c.updatedAt || '—') + '</span></div>'
          + '<div class="op-kv"><span class="k">Quy tắc</span><span class="v">' + e_(opRequire(c)) + ' → ' + e_(OST[opEval(c)].label) + '</span></div>'
          + '</div><div class="modal-foot"><button class="btn btn-primary" id="opExClose">Đóng</button></div>');
        var b = q('#opExClose'); if (b) b.addEventListener('click', opModalClose);
      }
      function openEvalModal(code) {
        var c = critByCode(code); if (!c || !opCanEval(c)) return; var cur = c.result;
        opModalOpen('<div class="modal-head"><span class="m-ic info">' + icn('pencil', 20) + '</span><div><h3>Đánh giá tiêu chí</h3><p>' + e_(c.code) + ' — ' + e_(c.name) + '</p></div></div>'
          + '<div class="modal-body"><div class="field"><label class="lbl">Kết quả đánh giá <span class="req">*</span></label>'
          + '<label style="display:flex;gap:8px;align-items:center;padding:8px 0"><input type="radio" name="opEvR" value="ACHIEVED"' + (cur === 'ACHIEVED' ? ' checked' : '') + '> Đạt</label>'
          + '<label style="display:flex;gap:8px;align-items:center;padding:4px 0"><input type="radio" name="opEvR" value="FAILED"' + (cur === 'FAILED' ? ' checked' : '') + '> Không đạt</label>'
          + '<div class="err-msg" id="opEvErr" style="display:none">' + icn('alert', 14) + '<span></span></div></div>'
          + '<div class="field" style="margin-top:8px"><label class="lbl">Ghi chú</label><textarea id="opEvNote" rows="2" style="width:100%;border:1px solid var(--ks-border);border-radius:8px;padding:10px 12px;font-size:14px"></textarea></div>'
          + '<div class="op-mininfo">' + icn('info', 13) + ' Thay đổi được ghi vào nhật ký (người, thời gian, cũ → mới).</div>'
          + '</div><div class="modal-foot"><button class="btn btn-ghost" id="opEvCancel">Hủy</button><button class="btn btn-primary" id="opEvSave">' + icn('check', 16) + 'Lưu</button></div>');
        q('#opEvCancel').addEventListener('click', opModalClose);
        q('#opEvSave').addEventListener('click', function () {
          var r = (q('input[name="opEvR"]:checked') || {}).value; var err = q('#opEvErr');
          if (!r) { err.style.display = 'flex'; err.querySelector('span').textContent = 'Vui lòng chọn kết quả.'; return; }
          var old = OST[opEval(c)].label; c.result = r; c.updatedAt = TODAY + ' ' + nowHM(); c.updatedBy = ocur().name;
          var note = (q('#opEvNote').value || '').trim(); pushHist(c, 'Đánh giá', old, OST[r].label + (note ? ' — ' + note : ''));
          opModalClose(); tst('success', 'Đã lưu đánh giá', c.code + ' → ' + OST[r].label + '.'); repaintResultBody(); var dr = q('#opDrawer'); if (dr && dr.classList.contains('show')) { dr.innerHTML = drawerHtml(c); bindDrawer(dr, c); }
        });
      }
      function openUpdModal(code) {
        var c = critByCode(code); if (!c || !opCanEval(c)) return;
        opModalOpen('<div class="modal-head"><span class="m-ic info">' + icn('pencil', 20) + '</span><div><h3>Cập nhật số liệu</h3><p>' + e_(c.code) + ' — ' + e_(c.name) + '</p></div></div>'
          + '<div class="modal-body"><div class="field"><label class="lbl">Giá trị thực hiện <span class="req">*</span>' + (c.unit ? ' <span class="opt">(' + e_(c.unit) + ')</span>' : '') + '</label>'
          + '<input type="number" step="0.01" id="opUpVal" value="' + (c.actual == null ? '' : c.actual) + '" style="width:100%;height:40px;border:1px solid var(--ks-border);border-radius:8px;padding:0 12px;font-size:14px">'
          + '<div class="err-msg" id="opUpErr" style="display:none">' + icn('alert', 14) + '<span></span></div></div>'
          + '<div class="field" style="margin-top:8px"><label class="lbl">Ghi chú</label><textarea id="opUpNote" rows="2" style="width:100%;border:1px solid var(--ks-border);border-radius:8px;padding:10px 12px;font-size:14px"></textarea></div>'
          + '</div><div class="modal-foot"><button class="btn btn-ghost" id="opUpCancel">Hủy</button><button class="btn btn-primary" id="opUpSave">' + icn('check', 16) + 'Lưu</button></div>');
        q('#opUpCancel').addEventListener('click', opModalClose);
        q('#opUpSave').addEventListener('click', function () {
          var raw = q('#opUpVal').value, err = q('#opUpErr');
          if (raw === '') { err.style.display = 'flex'; err.querySelector('span').textContent = 'Vui lòng nhập giá trị.'; return; }
          var n = parseFloat(String(raw).replace(',', '.')); if (isNaN(n) || n < 0) { err.style.display = 'flex'; err.querySelector('span').textContent = 'Giá trị không hợp lệ.'; return; }
          var old = opActualText(c); c.actual = n; c.result = null; c.updatedAt = TODAY + ' ' + nowHM(); c.updatedBy = ocur().name;
          var note = (q('#opUpNote').value || '').trim(); pushHist(c, 'Cập nhật số liệu', old, opActualText(c) + (note ? ' — ' + note : ''));
          opModalClose(); tst('success', 'Đã cập nhật số liệu', c.code + ' — ' + OST[opEval(c)].label + '.'); repaintResultBody(); var dr = q('#opDrawer'); if (dr && dr.classList.contains('show')) { dr.innerHTML = drawerHtml(c); bindDrawer(dr, c); }
        });
      }
      function nowHM() { var d = new Date(); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
      function pushHist(c, action, oldv, newv) { c.history = c.history || []; c.history.unshift({ at: (c.updatedAt || TODAY + ' ' + nowHM()), by: ocur().name + (ocur().title ? ' (' + ocur().title + ')' : ''), action: action, old: oldv, new: newv }); }
      function exportMock(fmt) { tst('info', 'Đang chuẩn bị file ' + fmt + '…', 'Xuất theo năm học ' + YEAR + ', ' + PERIOD + ', bộ chỉ tiêu THCS 2026–2027 và bộ lọc hiện tại (mô phỏng).'); }

      /* ---------- BIND (per page) ---------- */
      function bind(el) {
        if (state.page === 'op_result') {
          var b = q('#opResultBody', el); if (b) { b.innerHTML = resultTable(); bindResultBody(b); }
          var se = q('#opSearch', el); if (se) se.addEventListener('input', function () { state.q = se.value; clearTimeout(state._t); state._t = setTimeout(function () { repaintResultBody(); var n = q('#opSearch', el); if (n) { n.focus(); try { n.setSelectionRange(n.value.length, n.value.length); } catch (e) { } } }, 200); });
          var ea = q('#opExpandAll', el); if (ea) ea.addEventListener('click', function () { state.collapsed = {}; repaintResultBody(); });
          var ca = q('#opCollapseAll', el); if (ca) ca.addEventListener('click', function () { OPTREE.forEach(function (s) { state.collapsed[s.id] = true; s.levels.forEach(function (l) { state.collapsed[l.id] = true; }); }); repaintResultBody(); });

      /* ---------- Áp dụng phiếu (cập nhật tồn) ---------- */
      function applyTxn(type, lines, partner, note, whId) {
        lines = lines.filter(function (l) { return l.item && l.qty > 0; });
        if (!lines.length) { toast('warn', 'Thiếu thông tin', 'Chọn ít nhất một mặt hàng và số lượng.'); return false; }
        whId = whId || curWhId();
        if (!whId) { toast('warn', 'Chưa có kho', 'Hãy tạo một kho hàng trước.'); return false; }
        if (type === 'out') {
          for (var i = 0; i < lines.length; i++) { var it = item(lines[i].item); if (it && lines[i].qty > it.stock) { toast('error', 'Vượt tồn kho', '“' + it.name + '” chỉ còn ' + it.stock + ' ' + it.unit + '.'); return false; } }
        }
        var data = lines.map(function (l) { var it = item(l.item); if (it) it.stock += (type === 'in' ? l.qty : -l.qty); return { item: l.item, name: it ? it.name : '(đã xóa)', unit: it ? it.unit : '', qty: l.qty }; });
        var code; if (type === 'in') { PN++; code = 'PN-' + pad(PN); } else { PX++; code = 'PX-' + pad(PX); }
        TXNS.unshift({ id: iid('t'), code: code, type: type, wh: whId, date: Date.now(), partner: (partner || '').trim(), by: me(), note: (note || '').trim(), lines: data });
        toast('success', type === 'in' ? 'Đã nhập kho' : 'Đã xuất kho', code + ' · ' + data.length + ' mặt hàng (' + data.reduce(function (a, l) { return a + l.qty; }, 0) + ' đơn vị).');
        return true;

      function quickTxn(it, type) {
        if (!it) return; var isIn = type === 'in';
        openModal('<div class="modal-head"><div class="m-ic" style="background:' + (isIn ? '#e7f7ee' : '#fff4e5') + ';color:' + (isIn ? '#16A34A' : '#D97706') + '">' + ic(isIn ? 'arrowDown' : 'arrowUp', 20) + '</div><div><h3>' + (isIn ? 'Nhập kho nhanh' : 'Xuất kho nhanh') + '</h3><p>' + esc(it.name) + ' · Tồn hiện tại: <b>' + it.stock + ' ' + esc(it.unit) + '</b></p></div></div>'
          + '<div class="np-body">'
          + '<div class="np-field"><label class="lbl">Số lượng ' + (isIn ? 'nhập' : 'xuất') + ' <span class="req">*</span></label>'
          + '<div class="inv-step"><button type="button" id="qMinus">−</button><input id="qQty" type="number" inputmode="numeric" min="1" value="1"><button type="button" id="qPlus">+</button></div>'
          + '<div class="err-msg" id="qErr">' + ic('alert', 14) + '<span></span></div></div>'
          + '<div class="np-field"><label class="lbl">' + (isIn ? 'Nhà cung cấp / nguồn' : 'Đơn vị / người nhận') + '</label><input id="qPartner" class="ctrl" maxlength="80" placeholder="' + (isIn ? 'VD: Công ty VPP Hồng Hà' : 'VD: Tổ Văn phòng, Lớp 9A') + '"></div>'
          + '<div class="np-field"><label class="lbl">Ghi chú</label><input id="qNote" class="ctrl" maxlength="120" placeholder="Không bắt buộc"></div>'
          + '</div>'
          + '<div class="modal-foot"><button class="btn btn-ghost" id="qCancel">Hủy</button><button class="btn ' + (isIn ? 'btn-in' : 'btn-out') + '" id="qOk">' + ic('check', 16) + (isIn ? 'Xác nhận nhập' : 'Xác nhận xuất') + '</button></div>');
        var q = $('#qQty');
        var getN = function () { var n = parseInt(q.value, 10); return isNaN(n) ? 0 : n; };
        $('#qMinus').addEventListener('click', function () { q.value = Math.max(1, getN() - 1); });
        $('#qPlus').addEventListener('click', function () { q.value = getN() + 1; });
        $('#qCancel').addEventListener('click', closeModal);
        $('#qOk').addEventListener('click', function () {
          var n = getN(); if (n < 1) { var er = $('#qErr'); er.querySelector('span').textContent = 'Nhập số lượng hợp lệ (≥ 1).'; er.classList.add('show'); return; }
          if (applyTxn(type, [{ item: it.id, qty: n }], $('#qPartner').value, $('#qNote').value, it.wh)) { closeModal(); paint(); }
        });
      }

      /* ---------- Phiếu nhiều dòng ---------- */
      function openTxn(type) {
        if (!WHS.length) { toast('warn', 'Chưa có kho', 'Hãy tạo một kho hàng trước.'); return; }
        var isIn = type === 'in'; var lines = [{ item: '', qty: 1 }];
        var twh = curWhId();
        var pickWh = (is.wh === 'all');
        var optsHtml = function (sel) { return '<option value="">— Chọn mặt hàng —</option>' + ITEMS.filter(function (x) { return x.wh === twh; }).map(function (x) { return '<option value="' + x.id + '"' + (sel === x.id ? ' selected' : '') + '>' + esc(x.code + ' · ' + x.name) + ' (tồn ' + x.stock + ' ' + x.unit + ')</option>'; }).join(''); };
        var linesHtml = function () { return lines.map(function (l, i) { return '<div class="inv-line" data-i="' + i + '"><select class="ctrl inv-lsel" data-i="' + i + '">' + optsHtml(l.item) + '</select><input class="ctrl inv-lqty" data-i="' + i + '" type="number" inputmode="numeric" min="1" value="' + l.qty + '"><button type="button" class="icon-btn plain ln-del" data-i="' + i + '" aria-label="Xóa dòng">' + ic('trash', 16) + '</button></div>'; }).join(''); };
        var draw = function () { $('#txLines').innerHTML = linesHtml(); bindLines(); };
        var whField = pickWh ? ('<div class="np-field"><label class="lbl">Kho <span class="req">*</span></label><select id="txWh" class="ctrl">' + WHS.map(function (w) { return '<option value="' + w.id + '"' + (w.id === twh ? ' selected' : '') + '>' + esc(w.name) + '</option>'; }).join('') + '</select></div>') : ('<div class="np-field"><label class="lbl">Kho</label><input class="ctrl" value="' + esc(whName(twh)) + '" disabled></div>');
        openModal('<div class="modal-head"><div class="m-ic" style="background:' + (isIn ? '#e7f7ee' : '#fff4e5') + ';color:' + (isIn ? '#16A34A' : '#D97706') + '">' + ic(isIn ? 'arrowDown' : 'arrowUp', 20) + '</div><div><h3>' + (isIn ? 'Phiếu nhập kho' : 'Phiếu xuất kho') + '</h3><p>Chọn kho, mặt hàng và số lượng.</p></div></div>'
          + '<div class="np-body">'
          + whField
          + '<div class="np-field"><label class="lbl">' + (isIn ? 'Nhà cung cấp / nguồn' : 'Đơn vị / người nhận') + '</label><input id="txPartner" class="ctrl" maxlength="80" placeholder="' + (isIn ? 'VD: Công ty VPP Hồng Hà' : 'VD: Tổ Văn phòng, Lớp 9A') + '"></div>'
          + '<div class="np-field"><label class="lbl">Danh sách mặt hàng <span class="req">*</span></label><div id="txLines">' + linesHtml() + '</div>'
          + '<button class="btn btn-outline btn-sm" id="txAdd" style="margin-top:4px">' + ic('plus', 15) + 'Thêm dòng</button></div>'
          + '<div class="np-field"><label class="lbl">Ghi chú</label><input id="txNote" class="ctrl" maxlength="120" placeholder="Không bắt buộc"></div>'
          + '</div>'
          + '<div class="modal-foot"><button class="btn btn-ghost" id="txCancel">Hủy</button><button class="btn ' + (isIn ? 'btn-in' : 'btn-out') + '" id="txOk">' + ic('check', 16) + (isIn ? 'Lưu phiếu nhập' : 'Lưu phiếu xuất') + '</button></div>');
        function bindLines() {
          $$('#txLines .inv-lsel').forEach(function (s) { s.addEventListener('change', function () { lines[+s.dataset.i].item = s.value; }); });
          $$('#txLines .inv-lqty').forEach(function (q) { q.addEventListener('input', function () { lines[+q.dataset.i].qty = parseInt(q.value, 10) || 0; }); });
          $$('#txLines .ln-del').forEach(function (b) { b.addEventListener('click', function () { if (lines.length > 1) { lines.splice(+b.dataset.i, 1); draw(); } }); });
        }
        bindLines();
        if (pickWh && $('#txWh')) $('#txWh').addEventListener('change', function () { twh = this.value; lines = [{ item: '', qty: 1 }]; draw(); });
        $('#txAdd').addEventListener('click', function () { lines.push({ item: '', qty: 1 }); draw(); });
        $('#txCancel').addEventListener('click', closeModal);
        $('#txOk').addEventListener('click', function () { if (applyTxn(type, lines.map(function (l) { return { item: l.item, qty: l.qty }; }), $('#txPartner').value, $('#txNote').value, twh)) { closeModal(); paint(); } });
      }

      /* ---------- Thêm / sửa mặt hàng ---------- */
      function itemForm(it) {
        var isEdit = !!it;
        if (!isEdit && !WHS.length) { toast('warn', 'Chưa có kho', 'Hãy tạo một kho hàng trước khi thêm mặt hàng.'); return; }
        openModal('<div class="modal-head"><div class="m-ic info">' + ic('package', 20) + '</div><div><h3>' + (isEdit ? 'Sửa mặt hàng' : 'Thêm mặt hàng') + '</h3></div></div>'
          + '<div class="np-body">'
          + '<div class="row2"><div class="np-field half"><label class="lbl">Mã ' + (isEdit ? '' : '<span class="req">*</span>') + '</label><input id="ifCode" class="ctrl" maxlength="20" value="' + esc(it ? it.code : '') + '"' + (isEdit ? ' disabled' : '') + '></div>'
          + '<div class="np-field half"><label class="lbl">Đơn vị tính</label><select id="ifUnit" class="ctrl">' + UNITS.map(function (u) { return '<option' + ((it && it.unit === u) ? ' selected' : '') + '>' + esc(u) + '</option>'; }).join('') + '</select></div></div>'
          + '<div class="np-field"><label class="lbl">Tên mặt hàng <span class="req">*</span></label><input id="ifName" class="ctrl" maxlength="100" value="' + esc(it ? it.name : '') + '"><div class="err-msg" id="ifErr">' + ic('alert', 14) + '<span></span></div></div>'
          + '<div class="row2"><div class="np-field half"><label class="lbl">Kho <span class="req">*</span></label><select id="ifWh" class="ctrl">' + WHS.map(function (w) { var sel = it ? it.wh === w.id : w.id === curWhId(); return '<option value="' + w.id + '"' + (sel ? ' selected' : '') + '>' + esc(w.name) + '</option>'; }).join('') + '</select></div>'
          + '<div class="np-field half"><label class="lbl">Nhóm</label><select id="ifCat" class="ctrl">' + CATS.map(function (c) { return '<option' + ((it && it.cat === c) ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('') + '</select></div></div>'
          + '<div class="row2"><div class="np-field half"><label class="lbl">' + (isEdit ? 'Tồn hiện tại' : 'Tồn đầu kỳ') + '</label><input id="ifStock" class="ctrl" type="number" inputmode="numeric" min="0" value="' + (it ? it.stock : 0) + '"' + (isEdit ? ' disabled' : '') + '>' + (isEdit ? '<div class="hint">Thay đổi tồn qua phiếu Nhập/Xuất.</div>' : '') + '</div>'
          + '<div class="np-field half"><label class="lbl">Định mức tối thiểu</label><input id="ifMin" class="ctrl" type="number" inputmode="numeric" min="0" value="' + (it ? it.min : 0) + '"></div></div>'
          + '</div>'
          + '<div class="modal-foot"><button class="btn btn-ghost" id="ifCancel">Hủy</button><button class="btn btn-primary" id="ifOk">' + ic('check', 16) + (isEdit ? 'Lưu' : 'Thêm') + '</button></div>');
        $('#ifCancel').addEventListener('click', closeModal);
        $('#ifOk').addEventListener('click', function () {
          var name = ($('#ifName').value || '').trim(); if (name.length < 2) { var er = $('#ifErr'); er.querySelector('span').textContent = 'Nhập tên mặt hàng.'; er.classList.add('show'); return; }
          var whv = $('#ifWh') ? $('#ifWh').value : curWhId();
          if (isEdit) { it.name = name; it.unit = $('#ifUnit').value; it.cat = $('#ifCat').value; it.min = Math.max(0, parseInt($('#ifMin').value, 10) || 0); if (whv) it.wh = whv; toast('success', 'Đã lưu', name); }
          else {
            var code = ($('#ifCode').value || '').trim() || ('MH' + pad(ITEMS.length + 1)); if (item(code)) { var er2 = $('#ifErr'); er2.querySelector('span').textContent = 'Mã đã tồn tại.'; er2.classList.add('show'); return; }
            ITEMS.push({ id: code, code: code, name: name, unit: $('#ifUnit').value, cat: $('#ifCat').value, stock: Math.max(0, parseInt($('#ifStock').value, 10) || 0), min: Math.max(0, parseInt($('#ifMin').value, 10) || 0), note: '', wh: whv || (WHS[0] && WHS[0].id) }); toast('success', 'Đã thêm mặt hàng', name);
          }
          closeModal(); paint();
        });
      }
      function delItem(it) {
        openModal('<div class="modal-head"><div class="m-ic danger">' + ic('trash', 20) + '</div><div><h3>Xóa mặt hàng?</h3><p>“' + esc(it.name) + '” sẽ bị xóa khỏi danh mục kho. Lịch sử phiếu vẫn được giữ.</p></div></div>'
          + '<div class="modal-foot"><button class="btn btn-ghost" id="diCancel">Hủy</button><button class="btn btn-danger" id="diOk">' + ic('trash', 16) + 'Xóa</button></div>');
        $('#diCancel').addEventListener('click', closeModal);
        $('#diOk').addEventListener('click', function () { var i = ITEMS.indexOf(it); if (i >= 0) ITEMS.splice(i, 1); closeModal(); paint(); toast('success', 'Đã xóa', it.name); });
      }

      window.INV = { render: render, data: ITEMS, txns: TXNS, warehouses: WHS, state: is };
    })();
  </script>
  <script>
    /* Mobile nav drawer — additive, không ảnh hưởng desktop */
    (function () {
      "use strict";
      var ham = document.getElementById('navHam'), scrim = document.getElementById('navScrim');
      function open() { document.body.classList.add('nav-open'); if (ham) ham.setAttribute('aria-expanded', 'true'); }
      function close() { document.body.classList.remove('nav-open'); if (ham) ham.setAttribute('aria-expanded', 'false'); }
      function toggle() { document.body.classList.contains('nav-open') ? close() : open(); }
      if (ham) ham.addEventListener('click', function (e) { e.stopPropagation(); toggle(); });
      if (scrim) scrim.addEventListener('click', close);
      var rail = document.querySelector('.rail'), menu = document.querySelector('.sidemenu');
      if (rail) rail.addEventListener('click', function (e) { if (e.target.closest('.rail-item')) close(); });
      if (menu) menu.addEventListener('click', function (e) { if (e.target.closest('.sm-grp-btn,.sm-child')) close(); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
    })();
  </script>
</body>

</html>
