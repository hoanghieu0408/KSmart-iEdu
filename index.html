   +(t.resultNote?'<div class="form-section"><div class="fs-title">Kết quả đã nộp<span class="ln"></span></div><div class="notice info" style="align-items:flex-start">'+ic('checkCircle',18)+'<div><div class="desc-block">'+esc(t.resultNote)+'</div>'+(t.resultFiles.length?'<div class="mt8">'+t.resultFiles.map(f=>'<span class="prio-badge pb-normal" style="margin-right:6px">'+ic('file',12)+esc(f.name)+'</span>').join('')+'</div>':'')+'</div></div></div>':'')
   +(t.attachments.length?'<div class="form-section mb0"><div class="fs-title">Tệp đính kèm khi giao việc<span class="ln"></span></div>'+t.attachments.map(fileRow).join('')+'</div>':'');
  bindActionBar(t,u);
 }else if(detailTab==='checklist'){
  if(t.checklist.length){
   const done=t.checklist.filter(c=>c.done).length;
   b.innerHTML='<div class="cl-head"><span class="cl-count">'+done+'/'+t.checklist.length+' hoàn thành</span><div class="cl-progress"><i style="width:'+p+'%"></i></div><span class="cl-count">'+p+'%</span></div>'
    +t.checklist.map((c,i)=>{const canTick=canProcess(t,u)&&['new','in_progress'].includes(t.status);
      return '<div class="cl-row'+(c.done?' done':'')+'"><span class="cb cl-box'+(c.done?' checked':'')+'"'+(canTick?' data-cl="'+i+'" role="checkbox" tabindex="0"':' style="opacity:.6;cursor:default"')+' aria-label="'+esc(c.title)+'">'+ic('check')+'</span><div class="cl-txt">'+esc(c.title)+(c.done&&c.completedBy?'<div class="cl-by">'+esc(uname(c.completedBy))+' · '+fmtRelTime(c.completedAt)+'</div>':'')+'</div></div>';}).join('')
    +(canProcess(t,u)?'':'<div class="perm-note mt16">'+ic('lock',15)+'Bạn chỉ có quyền xem checklist. Chỉ người chịu trách nhiệm/thực hiện mới được tick.</div>');
   $$('#dBody [data-cl]').forEach(x=>{const fn=()=>toggleChecklist(t,+x.dataset.cl);x.addEventListener('click',fn);x.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fn();}});});
  }else{
   const canM=canProcess(t,u)&&['new','in_progress'].includes(t.status);
   b.innerHTML='<div class="form-section"><div class="fs-title">Tiến độ thủ công<span class="ln"></span></div>'
    +'<div class="hint" style="margin-bottom:6px">Công việc không có checklist — cập nhật phần trăm tiến độ thủ công (0–100%).</div>'
    +(canM?'<div class="manual-prog"><input type="range" id="mp" min="0" max="100" step="5" value="'+p+'"><span class="mp-val" id="mpv">'+p+'%</span></div><button class="btn btn-primary btn-sm" id="mpSave">'+ic('check',15)+'Lưu tiến độ</button>'
      :'<div class="prog" style="max-width:320px">'+progressCell(t)+'</div><div class="perm-note mt16">'+ic('lock',15)+'Chỉ người chịu trách nhiệm/thực hiện mới cập nhật được tiến độ.</div>')+'</div>';
   if(canM){$('#mp').addEventListener('input',e=>$('#mpv').textContent=e.target.value+'%');$('#mpSave').addEventListener('click',()=>updateManual(t,+$('#mp').value));}
  }
 }else if(detailTab==='talk'){
  b.innerHTML='<div id="cmtList">'+(t.comments.length?t.comments.map(cmtRow).join(''):'<div class="cmt-empty">Chưa có trao đổi nào. Hãy bắt đầu cuộc trao đổi về công việc này.</div>')+'</div>'
   +(canComment(t,u)?'<div class="cmt-compose"><span class="ava-sm" style="border:none;background:'+avaColor(u.id)+'">'+initials(u.name)+'</span><div class="cc-body"><textarea class="ctrl" id="cmtInput" rows="2" placeholder="Nhập trao đổi... dùng @ để nhắc tên người liên quan"></textarea><div class="cc-foot"><span class="cc-hint">'+ic('paperclip',14)+' Có thể đính kèm minh chứng</span><button class="btn btn-outline btn-sm" id="cmtAttach">'+ic('paperclip',15)+'Đính kèm</button><button class="btn btn-primary btn-sm" id="cmtSend">'+ic('send',15)+'Gửi</button></div></div></div>':'<div class="perm-note">'+ic('lock',15)+'Bạn không có quyền trao đổi trong công việc này.</div>')
   +'<div class="files-sec"><h4>Tệp trong công việc</h4>'+([...t.attachments.map(a=>({...a,tag:'Giao việc'})),...t.resultFiles.map(a=>({...a,tag:'Kết quả'}))].length?[...t.attachments.map(a=>({...a,tag:'Giao việc'})),...t.resultFiles.map(a=>({...a,tag:'Kết quả'}))].map(fileRow).join(''):'<div class="text-muted" style="font-size:13px">Chưa có tệp nào.</div>')+'</div>';
  if($('#cmtSend')){$('#cmtSend').addEventListener('click',()=>addComment(t));$('#cmtAttach').addEventListener('click',()=>toast('info','Đính kèm minh chứng (mock)','Đã thêm 1 tệp minh chứng vào ô trao đổi.'));$('#cmtInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))addComment(t);});}
 }else{
  const acts=t.activity.slice().reverse();
  b.innerHTML='<div class="timeline">'+acts.map(a=>{
    const dot=a.kind==='ok'?'ok':a.kind==='warn'?'warn':a.kind==='danger'?'danger':'';
    const ico=a.kind==='ok'?'check':a.kind==='warn'?'alert':a.kind==='danger'?'x':'clock';
    return '<div class="tl-item"><div class="tl-dot '+dot+'">'+ic(ico,11)+'</div><div class="tl-body"><div class="tl-line"><b>'+esc(uname(a.actorId))+'</b> '+esc(a.action)+'</div><div class="tl-time">'+fmtDT(a.at)+'</div>'
      +(a.change?'<div class="tl-change">'+esc(a.change.label)+': '+(a.change.old?'<span class="old">'+esc(a.change.old)+'</span> → ':'')+'<span class="new">'+esc(a.change.new)+'</span></div>':'')+'</div></div>';
  }).join('')+'</div><div class="perm-note mt16">'+ic('lock',15)+'Nhật ký hoạt động chỉ được ghi thêm (append-only), không thể sửa hoặc xóa.</div>';
 }
}
function fileRow(f){const ext=(f.name.split('.').pop()||'').toLowerCase();return '<div class="att-item"><span class="fi">'+ic('file',16)+'</span><div class="f-meta"><b>'+esc(f.name)+'</b><span>'+esc((f.tag?f.tag+' · ':'')+f.size+' · '+ext.toUpperCase())+'</span></div><button class="icon-btn plain" data-tip="Tải xuống" aria-label="Tải xuống" onclick="toast(\'info\',\'Tải tệp (mock)\',\''+esc(f.name)+'\')">'+ic('download',16)+'</button></div>';}
function cmtRow(c){const u=U(c.authorId);let txt=esc(c.content).replace(/@([^@]+?)(?=$|\s|,|\.)/g,'<span class="mention">@$1</span>');return '<div class="cmt"><span class="ava-sm" style="border:none;background:'+avaColor(u.id)+'">'+initials(u.name)+'</span><div class="c-body"><div class="c-head"><b>'+esc(u.name)+'</b><span class="c-time">'+fmtRelTime(c.createdAt)+'</span></div><div class="c-text">'+txt+'</div></div></div>';}

/* ---- action bar (process actions) ---- */
function actionBar(t,u){
 const canP=canProcess(t,u);let inner='';
 if(t.status==='new'&&canP){inner='<button class="btn btn-primary" id="abStart">'+ic('play',16)+'Bắt đầu xử lý</button>'+submitBtn(t)+extraProcHint(t);}
 else if(t.status==='in_progress'&&canP){inner=(t.checklist.length?'':'<button class="btn btn-outline" id="abProg">'+ic('sliders',16)+'Cập nhật tiến độ</button>')+submitBtn(t);}
 else if(t.status==='pending_review'){inner=canApprove(t,u)?'<span class="text-muted">'+ic('clock',15)+' Đang chờ bạn xác nhận — dùng nút ở chân trang.</span>':'<span class="text-muted">'+ic('clock',15)+' Đã nộp kết quả, đang chờ người giao/BGH xác nhận.</span>';}
 else if(t.status==='completed'){inner='<span class="text-muted">'+ic('checkCircle',15)+' Công việc đã hoàn thành lúc '+fmtDT(t.completedAt)+'.</span>';}
 else if(t.status==='draft'){inner='<span class="text-muted">'+ic('file',15)+' Bản nháp — chưa giao việc.</span>';}
 else if(t.status==='paused'){inner=canOperate(t,u)?'<button class="btn btn-outline" id="abResume">'+ic('play',16)+'Tiếp tục xử lý</button>':'<span class="text-muted">'+ic('pause',15)+' Công việc đang tạm dừng.</span>';}
 else if(t.status==='canceled'){inner='<span class="text-muted">'+ic('x',15)+' Công việc đã bị hủy.</span>';}
 if(!canP&&['new','in_progress'].includes(t.status)&&!canApprove(t,u))inner=inner||'<span class="perm-note" style="border:none;background:transparent;padding:0">'+ic('lock',15)+' Bạn không phải người xử lý công việc này.</span>';
 if(!inner)return '';
 return '<div class="action-bar"><span class="ab-label">'+ic('play',15)+'Xử lý</span>'+inner+'</div>';
}
function submitBtn(t){return '<button class="btn btn-success" id="abSubmit">'+ic(t.requireApproval?'send':'checkCircle',16)+(t.requireApproval?'Nộp kết quả':'Hoàn thành')+'</button>';}
function extraProcHint(t){return '';}
function bindActionBar(t,u){
 if($('#abStart'))$('#abStart').addEventListener('click',()=>startWork(t));
 if($('#abProg'))$('#abProg').addEventListener('click',()=>{detailTab='checklist';renderDetail();});
 if($('#abSubmit'))$('#abSubmit').addEventListener('click',()=>openSubmit(t));
 if($('#abResume'))$('#abResume').addEventListener('click',()=>resumeTask(t.id));
}
function detailFooter(t,u){
 if(t.status==='pending_review'&&canApprove(t,u)){
  return '<div class="drawer-foot"><div class="perm-note" style="border:none;background:transparent;padding:0">'+ic('info',15)+'Kết quả đang chờ bạn xác nhận</div><div class="spacer"></div><button class="btn btn-danger-outline" id="ftReturn">'+ic('rotate',16)+'Trả về bổ sung</button><button class="btn btn-success" id="ftConfirm">'+ic('checkCircle',16)+'Xác nhận hoàn thành</button></div>';
 }
 return '<div class="drawer-foot"><div class="spacer"></div><button class="btn btn-ghost" id="ftClose">Đóng</button></div>';
}
function bindFooter(t,u){
 if($('#ftReturn'))$('#ftReturn').addEventListener('click',()=>openReturn(t.id));
 if($('#ftConfirm'))$('#ftConfirm').addEventListener('click',()=>confirmDone(t.id));
 if($('#ftClose'))$('#ftClose').addEventListener('click',()=>closeDrawer($('#detailDrawer')));
}

/* =====================================================================
   PROCESS INTERACTIONS
   ===================================================================== */
function ensureInProgress(t){if(t.status==='new'){t.status='in_progress';addActivity(t,'đã bắt đầu xử lý','info');}}
function startWork(t){t.status='in_progress';addActivity(t,'đã bắt đầu xử lý','info');toast('success','Đã bắt đầu xử lý',t.code+' chuyển sang Đang thực hiện.');renderDetail();refreshAll();}
function toggleChecklist(t,i){
 const c=t.checklist[i];c.done=!c.done;c.completedBy=c.done?CURRENT:null;c.completedAt=c.done?new Date():null;
 ensureInProgress(t);
 addActivity(t,(c.done?'hoàn thành':'bỏ đánh dấu')+' mục checklist “'+c.title+'”',c.done?'ok':'info');
 const p=progressOf(t);
 renderDetail();refreshAll();
 if(p===100)toast('info','Checklist đã 100%','Tất cả đầu việc đã xong. Nhớ “Nộp kết quả” để chuyển trạng thái.');
}
function updateManual(t,val){
 const old=t.progressManual;t.progressManual=val;ensureInProgress(t);
 addActivity(t,'cập nhật tiến độ lên '+val+'%','info',{label:'Tiến độ',old:old+'%',new:val+'%'});
 toast('success','Đã cập nhật tiến độ',t.code+' · '+val+'%');renderDetail();refreshAll();
}
function addComment(t){
 const inp=$('#cmtInput');const txt=inp.value.trim();if(!txt){inp.focus();return;}
 const mentions=[];USERS.forEach(us=>{if(txt.includes('@'+us.name))mentions.push(us.id);});
 t.comments.push({id:'c'+Date.now(),authorId:CURRENT,content:txt,mentions,files:[],createdAt:new Date()});
 addActivity(t,'đã thêm một trao đổi','info');
 if(mentions.length)notify(mentions.map(uname).join(', '),CUR().name+' đã nhắc bạn trong công việc “'+t.title+'”.');
 renderDetail();
}
function openSubmit(t){
 if(t.checklist.length&&t.checklist.some(c=>!c.done)){
  toast('warn','Chưa thể nộp kết quả','Cần hoàn tất toàn bộ checklist ('+t.checklist.filter(c=>c.done).length+'/'+t.checklist.length+') trước khi nộp.');
  detailTab='checklist';renderDetail();return;
 }
 openModal('<div class="modal-head"><div class="m-ic info">'+ic('send',20)+'</div><div><h3>'+(t.requireApproval?'Nộp kết quả':'Hoàn thành công việc')+'</h3><p>Mô tả kết quả đã thực hiện và đính kèm minh chứng (nếu có).</p></div></div>'
  +'<div class="modal-body"><label class="lbl">Mô tả kết quả <span class="req">*</span></label><textarea class="ctrl" id="rNote" rows="4" placeholder="Tóm tắt kết quả đã đạt được..."></textarea><div class="err-msg" id="rNote_err">'+ic('alert',14)+'<span></span></div>'
  +'<button class="btn btn-outline btn-sm mt8" id="rAttach">'+ic('paperclip',15)+'Đính kèm minh chứng (mock)</button><div id="rFiles" class="mt8"></div></div>'
  +'<div class="modal-foot"><button class="btn btn-ghost" id="rCancel">Hủy</button><button class="btn btn-success" id="rOk">'+ic('checkCircle',16)+(t.requireApproval?'Nộp kết quả':'Hoàn thành')+'</button></div>');
 const files=[];
 $('#rAttach').addEventListener('click',()=>{files.push({name:'Minh_chung_'+(files.length+1)+'.pdf',size:'120 KB',type:'pdf'});$('#rFiles').innerHTML=files.map(fileRow).join('');});
 $('#rCancel').addEventListener('click',closeModal);
 $('#rOk').addEventListener('click',()=>{
  const note=$('#rNote').value.trim();
  if(!note){$('#rNote_err').querySelector('span').textContent='Vui lòng nhập mô tả kết quả.';$('#rNote_err').classList.add('show');$('#rNote').classList.add('invalid');return;}
  t.resultNote=note;t.resultFiles=files;
  if(t.requireApproval){t.status='pending_review';addActivity(t,'đã nộp kết quả, công việc chuyển Chờ xác nhận','warn');toast('success','Đã nộp kết quả',t.code+' chuyển sang Chờ xác nhận.');notify('Người giao & BGH','Công việc “'+t.title+'” đã được nộp kết quả và chờ xác nhận.');}
  else{t.status='completed';t.completedAt=new Date();addActivity(t,'đã hoàn thành công việc (không yêu cầu xác nhận)','ok');toast('success','Hoàn thành',t.code+' đã hoàn thành.');}
  closeModal();renderDetail();refreshAll();
 });
}
function confirmDone(id){
 const t=TASKS.find(x=>x.id===id);t.status='completed';t.completedAt=new Date();t.returnNote='';
 addActivity(t,'đã xác nhận hoàn thành','ok');
 toast('success','Đã xác nhận hoàn thành',t.code+' hoàn thành lúc '+fmtDT(t.completedAt)+'.');
 notify(uname(t.responsibleId),'Công việc “'+t.title+'” đã được xác nhận hoàn thành.');
 renderDetail();refreshAll();
}
function openReturn(id){
 const t=TASKS.find(x=>x.id===id);
 reasonModal({title:'Trả về bổ sung',icon:'rotate',iconCls:'warn',label:'Nội dung yêu cầu bổ sung',okLabel:'Trả về bổ sung',okCls:'btn-danger',placeholder:'Nêu rõ những gì cần chỉnh sửa/bổ sung...'},reason=>{
  t.status='in_progress';t.returnNote=reason;
  addActivity(t,'đã trả về để bổ sung','warn',{label:'Yêu cầu',old:'',new:reason});
  toast('warn','Đã trả về bổ sung',t.code+' quay lại Đang thực hiện.');
  notify(uname(t.responsibleId)+', '+t.executorIds.map(uname).join(', '),'Công việc “'+t.title+'” cần bổ sung: '+reason);
  renderDetail();refreshAll();
 });
}
function openExtend(id){
 const t=TASKS.find(x=>x.id===id);
 openModal('<div class="modal-head"><div class="m-ic warn">'+ic('calClock',20)+'</div><div><h3>Gia hạn công việc</h3><p>'+esc(t.code)+' — cập nhật hạn xử lý mới.</p></div></div>'
  +'<div class="modal-body"><div class="kv-change"><div class="kv-row"><span class="lab">Hạn hiện tại</span><b>'+fmtDT(t.dueAt)+'</b></div></div>'
  +'<label class="lbl">Hạn mới <span class="req">*</span></label><input class="ctrl" type="datetime-local" id="exNew" min="'+toLocalInput(NOW)+'" value="'+(t.dueAt?toLocalInput(t.dueAt):'')+'"><div class="err-msg" id="exNew_err">'+ic('alert',14)+'<span></span></div>'
  +'<label class="lbl mt16">Lý do gia hạn <span class="req">*</span></label><textarea class="ctrl" id="exReason" rows="3" placeholder="Nêu lý do gia hạn..."></textarea><div class="err-msg" id="exReason_err">'+ic('alert',14)+'<span></span></div></div>'
  +'<div class="modal-foot"><button class="btn btn-ghost" id="exCancel">Hủy</button><button class="btn btn-primary" id="exOk">'+ic('check',16)+'Xác nhận gia hạn</button></div>');
 $('#exCancel').addEventListener('click',closeModal);
 $('#exOk').addEventListener('click',()=>{
  const nv=$('#exNew').value,rs=$('#exReason').value.trim();let bad=false;
  if(!nv||new Date(nv)<=NOW){$('#exNew_err').querySelector('span').textContent='Chọn hạn mới sau thời điểm hiện tại.';$('#exNew_err').classList.add('show');bad=true;}
  if(!rs){$('#exReason_err').querySelector('span').textContent='Bắt buộc nhập lý do.';$('#exReason_err').classList.add('show');bad=true;}
  if(bad)return;
  const old=fmtDT(t.dueAt);t.dueAt=new Date(nv);
  addActivity(t,'đã gia hạn công việc','warn',{label:'Deadline',old,new:fmtDT(t.dueAt)});
  addActivity(t,'ghi chú lý do gia hạn','info',{label:'Lý do',old:'',new:rs});
  toast('success','Đã gia hạn',t.code+' · hạn mới '+fmtDT(t.dueAt));
  notify(uname(t.responsibleId)+' & người theo dõi','Công việc “'+t.title+'” đã được gia hạn. Lý do: '+rs);
  closeModal();if(detailId===id)renderDetail();refreshAll();
 });
}
function openReassign(id){
 const t=TASKS.find(x=>x.id===id);
 const opts=USERS.filter(u=>u.id!==t.responsibleId).map(u=>'<option value="'+u.id+'">'+esc(u.name+' — '+u.title)+'</option>').join('');
 openModal('<div class="modal-head"><div class="m-ic info">'+ic('swap',20)+'</div><div><h3>Chuyển người xử lý</h3><p>'+esc(t.code)+' — đổi người chịu trách nhiệm.</p></div></div>'
  +'<div class="modal-body"><div class="kv-change"><div class="kv-row"><span class="lab">Người chịu trách nhiệm hiện tại</span><b>'+esc(uname(t.responsibleId))+'</b></div></div>'
  +'<label class="lbl">Người chịu trách nhiệm mới <span class="req">*</span></label><select class="ctrl" id="raNew">'+opts+'</select>'
  +'<label class="lbl mt16"><span class="toggle on" id="raExec" style="pointer-events:none;display:none"></span></label>'
  +'<label class="toggle on" id="raAddExec"><span class="tg"></span><span class="tg-lbl">Thêm người mới vào danh sách người thực hiện</span></label>'
  +'<label class="lbl mt16">Lý do chuyển <span class="req">*</span></label><textarea class="ctrl" id="raReason" rows="3" placeholder="Nêu lý do chuyển người xử lý..."></textarea><div class="err-msg" id="raReason_err">'+ic('alert',14)+'<span></span></div></div>'
  +'<div class="modal-foot"><button class="btn btn-ghost" id="raCancel">Hủy</button><button class="btn btn-primary" id="raOk">'+ic('check',16)+'Xác nhận chuyển</button></div>');
 let addExec=true;$('#raAddExec').addEventListener('click',()=>{addExec=!addExec;$('#raAddExec').classList.toggle('on');});
 $('#raCancel').addEventListener('click',closeModal);
 $('#raOk').addEventListener('click',()=>{
  const nid=$('#raNew').value,rs=$('#raReason').value.trim();
  if(!rs){$('#raReason_err').querySelector('span').textContent='Bắt buộc nhập lý do.';$('#raReason_err').classList.add('show');return;}
  const old=uname(t.responsibleId);t.responsibleId=nid;
  if(addExec&&!t.executorIds.includes(nid))t.executorIds.push(nid);
  addActivity(t,'đã chuyển người chịu trách nhiệm','warn',{label:'Người chịu trách nhiệm',old,new:uname(nid)});
  addActivity(t,'ghi chú lý do chuyển người','info',{label:'Lý do',old:'',new:rs});
  toast('success','Đã chuyển người xử lý',t.code+' → '+uname(nid));
  notify(old+', '+uname(nid)+' & người theo dõi','Công việc “'+t.title+'” đã được chuyển người xử lý. Lý do: '+rs);
  closeModal();if(detailId===id)renderDetail();refreshAll();
 });
}
function openPause(id){
 const t=TASKS.find(x=>x.id===id);
 reasonModal({title:'Tạm dừng công việc',icon:'pause',iconCls:'warn',label:'Lý do tạm dừng',okLabel:'Tạm dừng',okCls:'btn-primary',placeholder:'Nêu lý do tạm dừng...'},reason=>{
  t.status='paused';addActivity(t,'đã tạm dừng công việc','warn',{label:'Lý do',old:'',new:reason});
  toast('warn','Đã tạm dừng',t.code+' chuyển sang Tạm dừng.');
  if(detailId===id)renderDetail();refreshAll();
 });
}
function resumeTask(id){
 const t=TASKS.find(x=>x.id===id);t.status='in_progress';addActivity(t,'đã tiếp tục công việc','info');
 toast('success','Đã tiếp tục',t.code+' quay lại Đang thực hiện.');closeMenu();if(detailId===id)renderDetail();refreshAll();
}
function openCancel(id){
 const t=TASKS.find(x=>x.id===id);
 reasonModal({title:'Hủy công việc',icon:'trash',iconCls:'danger',label:'Lý do hủy',okLabel:'Xác nhận hủy',okCls:'btn-danger',placeholder:'Nêu lý do hủy công việc...',desc:'Công việc đã giao không bị xóa vĩnh viễn — dữ liệu và lịch sử vẫn được lưu để truy vết.'},reason=>{
  t.status='canceled';addActivity(t,'đã hủy công việc','danger',{label:'Lý do',old:'',new:reason});
  toast('error','Đã hủy công việc',t.code+' chuyển sang Đã hủy.');
  if(detailId===id)renderDetail();refreshAll();
 });
}
function deleteDraft(id){
 const t=TASKS.find(x=>x.id===id);
 openModal('<div class="modal-head"><div class="m-ic danger">'+ic('trash',20)+'</div><div><h3>Xóa bản nháp?</h3><p>'+esc(t.code)+' — “'+esc(t.title)+'” sẽ bị xóa. Chỉ nháp chưa có người liên quan mới được xóa.</p></div></div>'
  +'<div class="modal-foot"><button class="btn btn-ghost" id="dgCancel">Hủy</button><button class="btn btn-danger" id="dgOk">'+ic('trash',16)+'Xóa nháp</button></div>');
 $('#dgCancel').addEventListener('click',closeModal);
 $('#dgOk').addEventListener('click',()=>{const i=TASKS.findIndex(x=>x.id===id);if(i>=0)TASKS.splice(i,1);closeModal();closeMenu();if(detailId===id)closeDrawer($('#detailDrawer'));toast('success','Đã xóa nháp',t.code+' đã được xóa.');refreshAll();});
}
function reasonModal(cfg,onOk){
 openModal('<div class="modal-head"><div class="m-ic '+cfg.iconCls+'">'+ic(cfg.icon,20)+'</div><div><h3>'+esc(cfg.title)+'</h3>'+(cfg.desc?'<p>'+esc(cfg.desc)+'</p>':'')+'</div></div>'
  +'<div class="modal-body"><label class="lbl">'+esc(cfg.label)+' <span class="req">*</span></label><textarea class="ctrl" id="rmReason" rows="3" placeholder="'+esc(cfg.placeholder||'')+'"></textarea><div class="err-msg" id="rmReason_err">'+ic('alert',14)+'<span></span></div></div>'
  +'<div class="modal-foot"><button class="btn btn-ghost" id="rmCancel">Hủy</button><button class="btn '+cfg.okCls+'" id="rmOk">'+esc(cfg.okLabel)+'</button></div>');
 $('#rmCancel').addEventListener('click',closeModal);
 $('#rmOk').addEventListener('click',()=>{const v=$('#rmReason').value.trim();if(!v){$('#rmReason_err').querySelector('span').textContent='Bắt buộc nhập lý do.';$('#rmReason_err').classList.add('show');$('#rmReason').classList.add('invalid');return;}closeModal();closeMenu();onOk(v);});
}

/* =====================================================================
   FILTER DRAWER
   ===================================================================== */
$('#filterBtn').addEventListener('click',openFilterDrawer);
function openFilterDrawer(){
 const d=$('#filterDrawer');
 const stOpts=[['new','Mới'],['in_progress','Đang thực hiện'],['pending_review','Chờ xác nhận'],['completed','Hoàn thành'],['overdue','Quá hạn'],['paused','Tạm dừng'],['canceled','Đã hủy'],['draft','Nháp']];
 d.innerHTML='<div class="drawer-head"><div class="dh-titles"><h2>Bộ lọc nâng cao</h2></div><button class="icon-btn plain" id="fdClose" aria-label="Đóng">'+ic('x',18)+'</button></div>'
  +'<div class="drawer-body scroll">'
  +'<div class="fg"><h4>Trạng thái</h4><div class="chk-grid">'+stOpts.map(([k,l])=>'<label class="chk-opt"><span class="cb '+(state.statuses.includes(k)?'checked':'')+'" data-st="'+k+'">'+ic('check')+'</span>'+l+'</label>').join('')+'</div></div>'
  +'<div class="fg"><h4>Mức ưu tiên</h4><div class="chk-grid">'+Object.keys(PRIO_META).map(k=>'<label class="chk-opt"><span class="cb '+(state.priorities.includes(k)?'checked':'')+'" data-pr="'+k+'">'+ic('check')+'</span><span class="prio-dot '+PRIO_META[k].dot+'"></span>'+PRIO_META[k].label+'</label>').join('')+'</div></div>'
  +'<div class="fg"><h4>Đơn vị / tổ chuyên môn</h4><select class="ctrl" id="fdUnit"><option value="">Tất cả đơn vị</option>'+UNITS.map(u=>'<option'+(state.unit===u?' selected':'')+'>'+esc(u)+'</option>').join('')+'</select></div>'
  +'<div class="fg"><h4>Người liên quan (chịu TN / thực hiện / giao)</h4><select class="ctrl" id="fdPerson"><option value="">Tất cả</option>'+USERS.map(u=>'<option value="'+u.id+'"'+(state.person===u.id?' selected':'')+'>'+esc(u.name+' — '+u.unit)+'</option>').join('')+'</select></div>'
  +'<div class="fg"><h4>Deadline</h4><div class="row2"><div class="field half" style="margin:0"><label class="lbl">Từ ngày</label><input class="ctrl" type="date" id="fdFrom" value="'+state.dueFrom+'"></div><div class="field half" style="margin:0"><label class="lbl">Đến ngày</label><input class="ctrl" type="date" id="fdTo" value="'+state.dueTo+'"></div></div>'
   +'<label class="chk-opt mt8"><span class="cb '+(state.onlyOverdue?'checked':'')+'" id="fdOver">'+ic('check')+'</span>Chỉ hiển thị công việc quá hạn</label></div>'
  +'</div>'
  +'<div class="drawer-foot"><button class="btn btn-ghost" id="fdClear">Xóa bộ lọc</button><div class="spacer"></div><button class="btn btn-primary" id="fdApply">Áp dụng bộ lọc</button></div>';
 openDrawer(d,()=>closeDrawer(d));
 $('#fdClose').addEventListener('click',()=>closeDrawer(d));
 $$('#filterDrawer .cb[data-st]').forEach(c=>c.addEventListener('click',()=>c.classList.toggle('checked')));
 $$('#filterDrawer .cb[data-pr]').forEach(c=>c.addEventListener('click',()=>c.classList.toggle('checked')));
 $('#fdOver').addEventListener('click',()=>$('#fdOver').classList.toggle('checked'));
 $('#fdClear').addEventListener('click',()=>{clearFilters();closeDrawer(d);state.page=1;refreshAll();});
 $('#fdApply').addEventListener('click',()=>{
  state.statuses=$$('#filterDrawer .cb[data-st].checked').map(c=>c.dataset.st);
  state.priorities=$$('#filterDrawer .cb[data-pr].checked').map(c=>c.dataset.pr);
  state.unit=$('#fdUnit').value;state.person=$('#fdPerson').value;
  state.dueFrom=$('#fdFrom').value;state.dueTo=$('#fdTo').value;state.onlyOverdue=$('#fdOver').classList.contains('checked');
  closeDrawer(d);state.page=1;refreshAll();
  toast('info','Đã áp dụng bộ lọc',applyAll().length+' công việc phù hợp.');
 });
}

/* =====================================================================
   SEARCH + INIT
   ===================================================================== */
let searchTimer=null;
$('#searchInput').addEventListener('input',e=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{state.search=e.target.value;state.page=1;renderTable();},220);});
$('#collapseMenu').addEventListener('click',()=>toast('info','Thu gọn menu','Chức năng thu gọn menu (mock).'));

function init(){
 renderShellIcons();renderTopUser();renderSideMenu();renderScopes();renderPageActions();
 $('#filterCount').textContent=activeFilterCount();
 simulateLoad();
}
init();
</script>

<script type="text/plain" id="hmiDoc">
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KSmart iEdu · Sơ đồ điều khiển thiết bị điện</title>
<style>
/* =====================================================================
   FEATURE: Sơ đồ điều khiển thiết bị điện (HMI)
   TẤT CẢ CSS ĐƯỢC SCOPE DƯỚI .electrical-diagram-screen
   Không có selector toàn cục (button{}, table{}, header{}...) — không đụng .work-* / Công việc.
   ===================================================================== */
.electrical-diagram-screen{
  --el-navy:#102A56;
  --el-blue:#1769D8;
  --el-blue-dark:#1257b0;
  --el-green:#17B88C;
  --el-gray:#98A2B3;
  --el-warn:#F28A1A;
  --el-yellow:#F7C61A;
  --el-bg:#F5F7FA;
  --el-section:#F8FAFC;
  --el-border:#E6ECF4;
  --el-border-2:#DCE4EF;
  --el-text:#1E293B;
  --el-muted:#64748B;
  --el-white:#FFFFFF;

  position:fixed; inset:0; overflow:auto; background:var(--el-bg);
  font-family:Arial, "Helvetica Neue", Helvetica, sans-serif;
  color:var(--el-text); z-index:1;
  display:flex; align-items:flex-start; justify-content:center;
}
.electrical-diagram-screen *{box-sizing:border-box;}
.electrical-diagram-screen svg{display:block;}
.electrical-diagram-screen ::selection{background:#cfe0fb;}

/* ---------- fixed artboard stage 1920x1332 ---------- */
.electrical-diagram-screen .hmi-stage{
  width:1920px; height:1332px; flex:none;
  transform-origin:top center; background:var(--el-bg);
  display:flex; flex-direction:column;
}

/* ---------- header ---------- */
.electrical-diagram-screen .hmi-header{
  height:86px; flex:none; background:var(--el-white);
  border-bottom:1px solid var(--el-border);
  display:flex; align-items:center; padding:0 34px;
}
.electrical-diagram-screen .hmi-brand{display:flex; align-items:center; gap:16px;}
.electrical-diagram-screen .hmi-brand .hmi-logo{color:var(--el-navy);}
.electrical-diagram-screen .hmi-brand h1{margin:0; font-size:27px; font-weight:700; color:var(--el-navy); letter-spacing:-.2px;}
.electrical-diagram-screen .hmi-head-right{margin-left:auto; display:flex; align-items:center; gap:20px;}
.electrical-diagram-screen .hmi-bell{position:relative; color:#475569;}
.electrical-diagram-screen .hmi-bell .hmi-badge{position:absolute; top:-7px; right:-8px; min-width:19px; height:19px; padding:0 4px; border-radius:999px; background:#EF4444; color:#fff; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; border:2px solid #fff;}
.electrical-diagram-screen .hmi-sep{width:1px; height:26px; background:var(--el-border-2);}
.electrical-diagram-screen .hmi-head-item{display:flex; align-items:center; gap:9px; font-size:16px; font-weight:600; color:#334155;}
.electrical-diagram-screen .hmi-head-item .ic{color:#64748B;}
.electrical-diagram-screen .hmi-head-item .ic-cal{color:var(--el-blue);}
.electrical-diagram-screen .hmi-head-item .ic-sun{color:var(--el-yellow);}

/* ---------- body grid ---------- */
.electrical-diagram-screen .hmi-body{
  flex:1; display:grid; grid-template-columns:1fr 408px; grid-template-rows:1fr 292px;
  gap:16px; padding:16px 20px 20px; min-height:0;
}
.electrical-diagram-screen .hmi-card{background:var(--el-white); border:1px solid var(--el-border); border-radius:12px;}
.electrical-diagram-screen .hmi-diagram-card{grid-column:1; grid-row:1; display:flex; flex-direction:column; padding:18px 22px 14px; min-height:0;}
.electrical-diagram-screen .hmi-panel-card{grid-column:2; grid-row:1; display:flex; flex-direction:column; padding:20px 20px 16px; min-height:0;}
.electrical-diagram-screen .hmi-energy-card{grid-column:1; grid-row:2; padding:18px 22px;}
.electrical-diagram-screen .hmi-legend-card{grid-column:2; grid-row:2; padding:18px 20px;}

/* ---------- toolbar ---------- */
.electrical-diagram-screen .hmi-toolbar{display:flex; align-items:center; gap:14px; margin-bottom:12px; flex:none;}
.electrical-diagram-screen .hmi-mode{display:flex; gap:10px;}
.electrical-diagram-screen .hmi-btn{height:44px; padding:0 18px; border-radius:9px; border:1px solid var(--el-border-2); background:#fff; color:#334155; font-size:15px; font-weight:600; display:inline-flex; align-items:center; gap:9px; cursor:pointer;}
.electrical-diagram-screen .hmi-btn:hover{background:#f3f6fb;}
.electrical-diagram-screen .hmi-btn.active{background:var(--el-blue); border-color:var(--el-blue); color:#fff;}
.electrical-diagram-screen .hmi-legend-inline{display:flex; align-items:center; gap:24px; margin:0 auto;}
.electrical-diagram-screen .hmi-legend-inline .li{display:flex; align-items:center; gap:9px; font-size:15px; color:#475569; font-weight:500;}
.electrical-diagram-screen .dot{width:13px; height:13px; border-radius:50%; flex:none;}
.electrical-diagram-screen .dot.on{background:var(--el-green);}
.electrical-diagram-screen .dot.off{background:var(--el-gray);}
.electrical-diagram-screen .dot.warn{background:var(--el-warn);}
.electrical-diagram-screen .hmi-zoom{display:flex; align-items:center; gap:10px;}
.electrical-diagram-screen .hmi-zbtn{width:44px; height:44px; border-radius:9px; border:1px solid var(--el-border-2); background:#fff; color:#334155; display:inline-flex; align-items:center; justify-content:center; cursor:pointer;}
.electrical-diagram-screen .hmi-zbtn:hover{background:#f3f6fb;}
.electrical-diagram-screen .hmi-zval{min-width:64px; height:44px; border-radius:9px; border:1px solid var(--el-border-2); background:#fff; display:inline-flex; align-items:center; justify-content:center; font-size:15px; font-weight:700; color:#334155;}

/* ---------- topology ---------- */
.electrical-diagram-screen .hmi-topology-wrap{flex:1; overflow:auto; min-height:0; position:relative;}
.electrical-diagram-screen .hmi-topology-scale{position:relative; transform-origin:top left; transition:transform .16s ease;}
.electrical-diagram-screen #hmiWires{position:absolute; top:0; left:0; pointer-events:none; z-index:1; overflow:visible;}
.electrical-diagram-screen .hmi-floor{display:grid; grid-template-columns:92px 128px 1fr; gap:18px; align-items:stretch; position:relative; z-index:2;}
.electrical-diagram-screen .hmi-floor + .hmi-floor{margin-top:6px; padding-top:6px; border-top:1px solid #F1F4F9;}
.electrical-diagram-screen .hmi-floor-tile{background:var(--el-navy); border-radius:10px; color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:14px 6px;}
.electrical-diagram-screen .hmi-floor-tile .fl-name{font-size:17px; font-weight:700;}
.electrical-diagram-screen .hmi-floor-tile .fl-num{font-size:20px; font-weight:700;}
.electrical-diagram-screen .hmi-cabinet{background:#fff; border:1px solid var(--el-border-2); border-radius:10px; display:flex; flex-direction:column; align-items:center; padding:12px 8px 10px; position:relative; align-self:center; width:128px;}
.electrical-diagram-screen .hmi-cabinet .cab-title{font-size:11.5px; font-weight:700; color:var(--el-navy); text-align:center; line-height:1.35; letter-spacing:.3px;}
.electrical-diagram-screen .hmi-cabinet .cab-icon{margin:8px 0 2px;}
.electrical-diagram-screen .hmi-cabinet .cab-check{position:absolute; right:12px; bottom:10px; width:22px; height:22px; border-radius:50%; background:var(--el-green); color:#fff; display:flex; align-items:center; justify-content:center; border:2px solid #fff;}
.electrical-diagram-screen .hmi-rooms{position:relative; padding-top:44px; display:grid; grid-template-columns:repeat(6,1fr); gap:16px;}
.electrical-diagram-screen .hmi-room{background:#fff; border:1.5px solid var(--el-border-2); border-radius:10px; overflow:hidden; cursor:pointer; position:relative; min-height:182px; display:flex; flex-direction:column; transition:border-color .12s, box-shadow .12s;}
.electrical-diagram-screen .hmi-room:hover{border-color:#b9cbe6;}
.electrical-diagram-screen .hmi-room.selected{border-color:var(--el-blue); border-width:3px; box-shadow:0 0 0 3px rgba(23,105,216,.10);}
.electrical-diagram-screen .hmi-room .room-name{text-align:center; font-size:16px; font-weight:700; color:var(--el-navy); padding:10px 6px; background:#FBFCFE; border-bottom:1px solid #EEF2F8;}
.electrical-diagram-screen .hmi-room.selected .room-name{background:#F1F6FE;}
.electrical-diagram-screen .hmi-devgrid{flex:1; display:grid; grid-template-columns:1fr 1fr; grid-auto-rows:1fr;}
.electrical-diagram-screen .hmi-devcell{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:7px; padding:8px 4px; border-right:1px solid #F3F6FA; border-top:1px solid #F3F6FA;}
.electrical-diagram-screen .hmi-devcell:nth-child(2n){border-right:none;}
.electrical-diagram-screen .hmi-devcell:nth-child(-n+2){border-top:none;}
.electrical-diagram-screen .hmi-devcell .devico{width:42px; height:42px; display:flex; align-items:center; justify-content:center;}
.electrical-diagram-screen .hmi-devcell .devdot{width:10px; height:10px; border-radius:50%;}
.electrical-diagram-screen .hmi-devcell.warnable{cursor:help;}

/* device legend row */
.electrical-diagram-screen .hmi-devlegend{flex:none; display:flex; align-items:center; gap:34px; padding-top:14px; margin-top:12px; border-top:1px solid #EEF2F8; flex-wrap:wrap;}
.electrical-diagram-screen .hmi-devlegend .dl{display:flex; align-items:center; gap:10px; font-size:15px; color:#475569; font-weight:500;}
.electrical-diagram-screen .hmi-devlegend .dl .dli{width:26px; height:26px; display:flex; align-items:center; justify-content:center;}

/* list mode */
.electrical-diagram-screen .hmi-listmode{flex:1; overflow:auto; min-height:0;}
.electrical-diagram-screen table.hmi-table{width:100%; border-collapse:collapse;}
.electrical-diagram-screen table.hmi-table th{position:sticky; top:0; background:#EEF3FB; color:var(--el-navy); text-align:left; font-size:14px; font-weight:700; padding:12px 14px; border-bottom:1px solid var(--el-border);}
.electrical-diagram-screen table.hmi-table td{padding:11px 14px; border-bottom:1px solid #EEF2F8; font-size:14px;}
.electrical-diagram-screen table.hmi-table tr:hover td{background:#F7FAFF;}
.electrical-diagram-screen .hmi-stpill{display:inline-flex; align-items:center; gap:7px; font-weight:600; font-size:13.5px;}

/* ---------- right panel ---------- */
.electrical-diagram-screen .panel-head{display:flex; align-items:center; margin-bottom:16px; flex:none;}
.electrical-diagram-screen .panel-head h2{margin:0; font-size:21px; font-weight:700; color:var(--el-navy);}
.electrical-diagram-screen .panel-head .p-close{margin-left:auto; width:34px; height:34px; border-radius:8px; border:none; background:transparent; color:#64748B; display:inline-flex; align-items:center; justify-content:center; cursor:pointer;}
.electrical-diagram-screen .panel-head .p-close:hover{background:#f1f5fb;}
.electrical-diagram-screen .panel-body{flex:1; overflow:auto; min-height:0; margin:0 -4px; padding:0 4px;}
.electrical-diagram-screen .kpi-row{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:20px;}
.electrical-diagram-screen .kpi-cell{border:1px solid var(--el-border); border-radius:10px; padding:14px 6px; text-align:center;}
.electrical-diagram-screen .kpi-cell .kv{font-size:26px; font-weight:700; color:var(--el-navy); line-height:1;}
.electrical-diagram-screen .kpi-cell .kv.on{color:var(--el-green);}
.electrical-diagram-screen .kpi-cell .kl{font-size:13.5px; color:var(--el-muted); margin-top:7px;}
.electrical-diagram-screen .panel-sec-title{font-size:16px; font-weight:700; color:var(--el-navy); margin:0 0 12px;}
.electrical-diagram-screen .dev-row{display:flex; align-items:center; gap:12px; padding:10px 0;}
.electrical-diagram-screen .dev-row + .dev-row{border-top:1px solid #F1F4F9;}
.electrical-diagram-screen .dev-row .dev-ic{width:44px; height:44px; border-radius:9px; background:#F5F7FB; border:1px solid #EDF1F7; display:flex; align-items:center; justify-content:center; flex:none;}
.electrical-diagram-screen .dev-row .dev-meta{flex:1; min-width:0;}
.electrical-diagram-screen .dev-row .dev-meta b{display:block; font-size:15px; font-weight:600; color:var(--el-text);}
.electrical-diagram-screen .dev-row .dev-meta span{font-size:13px; color:var(--el-muted);}
.electrical-diagram-screen .dev-row .dev-status{display:flex; align-items:center; gap:7px; font-size:13.5px; font-weight:600; white-space:nowrap;}
.electrical-diagram-screen .dev-row .dev-status.on{color:var(--el-green);}
.electrical-diagram-screen .dev-row .dev-status.off{color:var(--el-gray);}
.electrical-diagram-screen .dev-row .dev-status.warn{color:var(--el-warn);}
.electrical-diagram-screen .hmi-toggle{width:48px; height:27px; border-radius:999px; background:#CBD5E1; border:none; position:relative; cursor:pointer; flex:none; transition:background .16s;}
.electrical-diagram-screen .hmi-toggle::after{content:""; position:absolute; top:3px; left:3px; width:21px; height:21px; border-radius:50%; background:#fff; transition:transform .16s; box-shadow:0 1px 3px rgba(0,0,0,.25);}
.electrical-diagram-screen .hmi-toggle.on{background:var(--el-green);}
.electrical-diagram-screen .hmi-toggle.on::after{transform:translateX(21px);}
.electrical-diagram-screen .hmi-toggle.pending{opacity:.6;}
.electrical-diagram-screen .hmi-toggle:disabled{opacity:.45; cursor:not-allowed;}
.electrical-diagram-screen .room-facts{margin-top:6px;}
.electrical-diagram-screen .room-facts .rf{display:flex; justify-content:space-between; align-items:center; padding:9px 0; font-size:14.5px; border-top:1px solid #F1F4F9;}
.electrical-diagram-screen .room-facts .rf .rk{color:var(--el-muted);}
.electrical-diagram-screen .room-facts .rf .rv{color:var(--el-text); font-weight:600;}
.electrical-diagram-screen .panel-foot{flex:none; display:flex; gap:12px; padding-top:14px; margin-top:8px; border-top:1px solid var(--el-border);}
.electrical-diagram-screen .panel-foot .hmi-btn{flex:1; height:46px; justify-content:center;}
.electrical-diagram-screen .panel-foot .hmi-btn.primary{background:var(--el-blue); border-color:var(--el-blue); color:#fff;}
.electrical-diagram-screen .panel-foot .hmi-btn.primary:hover{background:var(--el-blue-dark);}
.electrical-diagram-screen .panel-collapsed{display:none; flex:1; align-items:center; justify-content:center; text-align:center; color:var(--el-muted); font-size:14px; padding:20px; flex-direction:column; gap:10px;}
.electrical-diagram-screen .hmi-panel-card.collapsed .panel-head,
.electrical-diagram-screen .hmi-panel-card.collapsed .panel-body,
.electrical-diagram-screen .hmi-panel-card.collapsed .panel-foot{display:none;}
.electrical-diagram-screen .hmi-panel-card.collapsed .panel-collapsed{display:flex;}

/* ---------- energy card ---------- */
.electrical-diagram-screen .energy-grid{display:grid; grid-template-columns:minmax(360px,auto) 1fr; gap:32px; height:100%;}
.electrical-diagram-screen .energy-left .en-title, .electrical-diagram-screen .energy-right .en-title{font-size:17px; font-weight:700; color:var(--el-navy); margin:0 0 16px;}
.electrical-diagram-screen .en-kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
.electrical-diagram-screen .en-kpi{background:var(--el-section); border:1px solid var(--el-border); border-radius:10px; padding:16px 14px;}
.electrical-diagram-screen .en-kpi .eic{color:var(--el-blue); margin-bottom:12px;}
.electrical-diagram-screen .en-kpi .elabel{font-size:13.5px; color:var(--el-muted); margin-bottom:10px;}
.electrical-diagram-screen .en-kpi .eval{font-size:26px; font-weight:700; color:var(--el-navy);}
.electrical-diagram-screen .en-kpi .eval .eu{font-size:14px; font-weight:600; color:var(--el-muted); margin-left:3px;}
.electrical-diagram-screen .en-kpi.leaf .eic{color:var(--el-green);}
.electrical-diagram-screen .energy-right{display:flex; flex-direction:column; min-width:0;}
.electrical-diagram-screen .en-chart{flex:1; min-height:0;}
.electrical-diagram-screen .en-chart svg{width:100%; height:100%;}

/* ---------- status legend card ---------- */
.electrical-diagram-screen .legend-card .lc-title{font-size:17px; font-weight:700; color:var(--el-navy); margin:0 0 18px;}
.electrical-diagram-screen .legend-card .lc-item{display:flex; align-items:center; gap:12px; padding:11px 0; font-size:15.5px; color:#334155;}
.electrical-diagram-screen .legend-card .lc-item .dot{width:15px; height:15px;}

/* ---------- toast ---------- */
.electrical-diagram-screen .hmi-toasts{position:absolute; right:24px; bottom:24px; display:flex; flex-direction:column; gap:10px; z-index:60;}
.electrical-diagram-screen .hmi-toast{min-width:280px; max-width:380px; background:#fff; border:1px solid var(--el-border); border-left:4px solid var(--el-blue); border-radius:9px; box-shadow:0 10px 30px rgba(16,42,86,.16); padding:12px 14px; display:flex; align-items:center; gap:11px; animation:hmiToastIn .22s ease;}
.electrical-diagram-screen .hmi-toast.success{border-left-color:var(--el-green);}
.electrical-diagram-screen .hmi-toast.error{border-left-color:#EF4444;}
.electrical-diagram-screen .hmi-toast.warn{border-left-color:var(--el-warn);}
.electrical-diagram-screen .hmi-toast .tic{flex:none;}
.electrical-diagram-screen .hmi-toast.success .tic{color:var(--el-green);}
.electrical-diagram-screen .hmi-toast.error .tic{color:#EF4444;}
.electrical-diagram-screen .hmi-toast.warn .tic{color:var(--el-warn);}
.electrical-diagram-screen .hmi-toast.neutral .tic{color:var(--el-blue);}
.electrical-diagram-screen .hmi-toast span{font-size:14px; color:var(--el-text); font-weight:500;}
@keyframes hmiToastIn{from{opacity:0; transform:translateY(12px);}to{opacity:1; transform:translateY(0);}}
.electrical-diagram-screen .hmi-toast.out{animation:hmiToastOut .2s ease forwards;}
@keyframes hmiToastOut{to{opacity:0; transform:translateY(12px);}}

/* ---------- overlay modal / drawer ---------- */
.electrical-diagram-screen .hmi-overlay{position:absolute; inset:0; background:rgba(16,42,86,.34); z-index:70; display:flex; opacity:0; pointer-events:none; transition:opacity .18s;}
.electrical-diagram-screen .hmi-overlay.show{opacity:1; pointer-events:auto;}
.electrical-diagram-screen .hmi-overlay.center{align-items:center; justify-content:center;}
.electrical-diagram-screen .hmi-overlay.right{justify-content:flex-end;}
.electrical-diagram-screen .hmi-modal{width:460px; max-width:calc(100% - 40px); background:#fff; border-radius:14px; box-shadow:0 24px 60px rgba(16,42,86,.3); overflow:hidden; transform:translateY(10px); transition:transform .2s;}
.electrical-diagram-screen .hmi-overlay.show .hmi-modal{transform:translateY(0);}
.electrical-diagram-screen .hmi-drawer{width:460px; max-width:calc(100% - 40px); height:100%; background:#fff; box-shadow:-8px 0 30px rgba(16,42,86,.18); display:flex; flex-direction:column; transform:translateX(100%); transition:transform .24s;}
.electrical-diagram-screen .hmi-overlay.show .hmi-drawer{transform:translateX(0);}
.electrical-diagram-screen .mo-head{padding:18px 20px; border-bottom:1px solid var(--el-border); display:flex; align-items:center; gap:12px;}
.electrical-diagram-screen .mo-head h3{margin:0; font-size:18px; font-weight:700; color:var(--el-navy);}
.electrical-diagram-screen .mo-head .mo-x{margin-left:auto; width:32px; height:32px; border:none; background:transparent; color:#64748B; border-radius:7px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center;}
.electrical-diagram-screen .mo-head .mo-x:hover{background:#f1f5fb;}
.electrical-diagram-screen .mo-body{padding:18px 20px; overflow:auto;}
.electrical-diagram-screen .mo-foot{padding:14px 20px; border-top:1px solid var(--el-border); display:flex; gap:10px; justify-content:flex-end;}
.electrical-diagram-screen .grp-summary{background:var(--el-section); border:1px solid var(--el-border); border-radius:9px; padding:12px 14px; margin-bottom:16px; font-size:14px; color:#334155;}
.electrical-diagram-screen .grp-summary b{color:var(--el-navy);}
.electrical-diagram-screen .grp-choice{display:flex; gap:12px; margin-bottom:6px;}
.electrical-diagram-screen .grp-opt{flex:1; border:1.5px solid var(--el-border-2); border-radius:10px; padding:14px; cursor:pointer; text-align:center; font-weight:600; font-size:15px; color:#334155; display:flex; flex-direction:column; align-items:center; gap:8px;}
.electrical-diagram-screen .grp-opt:hover{background:#f5f8fd;}
.electrical-diagram-screen .grp-opt.sel{border-color:var(--el-blue); background:#f1f6fe; color:var(--el-blue);}
.electrical-diagram-screen .grp-opt.sel.off-opt{border-color:var(--el-gray); background:#f4f5f7; color:#475569;}

/* history */
.electrical-diagram-screen .hist-filters{display:flex; gap:8px; margin-bottom:14px; align-items:center;}
.electrical-diagram-screen .hist-chip{height:34px; padding:0 14px; border-radius:999px; border:1px solid var(--el-border-2); background:#fff; font-size:13.5px; font-weight:600; color:#334155; cursor:pointer;}
.electrical-diagram-screen .hist-chip.active{background:var(--el-blue); border-color:var(--el-blue); color:#fff;}
.electrical-diagram-screen .hist-sim{margin-left:auto; display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--el-muted); cursor:pointer;}
.electrical-diagram-screen .hist-sim .mini-tg{width:36px; height:20px; border-radius:999px; background:#CBD5E1; position:relative; transition:background .15s;}
.electrical-diagram-screen .hist-sim .mini-tg::after{content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; transition:transform .15s;}
.electrical-diagram-screen .hist-sim.on .mini-tg{background:var(--el-warn);}
.electrical-diagram-screen .hist-sim.on .mini-tg::after{transform:translateX(16px);}
.electrical-diagram-screen .hist-item{display:flex; gap:12px; padding:12px 0; border-bottom:1px solid #F1F4F9;}
.electrical-diagram-screen .hist-item .hi-dot{width:30px; height:30px; border-radius:8px; flex:none; display:flex; align-items:center; justify-content:center; background:#EEF3FB; color:var(--el-blue);}
.electrical-diagram-screen .hist-item .hi-dot.ok{background:#E6F8F1; color:var(--el-green);}
.electrical-diagram-screen .hist-item .hi-dot.fail{background:#FDE8E8; color:#EF4444;}
.electrical-diagram-screen .hist-item .hi-dot.deny{background:#FEF1E3; color:var(--el-warn);}
.electrical-diagram-screen .hist-item .hi-b{flex:1; min-width:0;}
.electrical-diagram-screen .hist-item .hi-b .hi-line{font-size:14px; color:var(--el-text);}
.electrical-diagram-screen .hist-item .hi-b .hi-line b{color:var(--el-navy);}
.electrical-diagram-screen .hist-item .hi-b .hi-meta{font-size:12.5px; color:var(--el-muted); margin-top:3px;}
.electrical-diagram-screen .hist-empty{color:var(--el-muted); text-align:center; padding:30px 0; font-size:14px;}

/* tooltip */
.electrical-diagram-screen .hmi-tip{position:absolute; z-index:80; background:#1e293b; color:#fff; font-size:12.5px; font-weight:500; padding:6px 10px; border-radius:7px; pointer-events:none; white-space:nowrap; transform:translate(-50%,-115%); box-shadow:0 6px 18px rgba(0,0,0,.22); opacity:0; transition:opacity .12s;}
.electrical-diagram-screen .hmi-tip.show{opacity:1;}
.electrical-diagram-screen .hmi-tip::after{content:""; position:absolute; top:100%; left:50%; transform:translateX(-50%); border:6px solid transparent; border-top-color:#1e293b;}

.electrical-diagram-screen button:focus-visible,
.electrical-diagram-screen .hmi-room:focus-visible{outline:3px solid rgba(23,105,216,.4); outline-offset:2px;}

/* fullscreen */
.electrical-diagram-screen:fullscreen{overflow:auto; background:var(--el-bg);}
.electrical-diagram-screen.is-fs{overflow:auto;}

<div class="electrical-diagram-screen" id="electricalScreen">

        <span class="hmi-head-item"><span class="ic" id="icClock"></span>10:24</span>
        <span class="hmi-head-item"><span class="ic ic-cal" id="icCal"></span>20/05/2025</span>
        <span class="hmi-sep"></span>
        <span class="hmi-head-item"><span class="ic ic-sun" id="icSun"></span>28°C</span>
      </div>
    </header>

    <!-- ============ BODY ============ -->
    <div class="hmi-body">
      <!-- diagram card -->
      <section class="hmi-card hmi-diagram-card">
        <div class="hmi-toolbar">
          <div class="hmi-mode">
            <button class="hmi-btn active" id="modeDiagram"><span id="icBuilding2"></span>Sơ đồ tòa nhà</button>
            <button class="hmi-btn" id="modeList"><span id="icList"></span>Dạng danh sách</button>
          </div>
          <div class="hmi-legend-inline">
            <span class="li"><span class="dot on"></span>Đang bật</span>
            <span class="li"><span class="dot off"></span>Đang tắt</span>
            <span class="li"><span class="dot warn"></span>Cảnh báo</span>
          </div>
          <div class="hmi-zoom">
            <button class="hmi-zbtn" id="zoomOut" aria-label="Thu nhỏ"><span id="icMinus"></span></button>
            <button class="hmi-zval" id="zoomVal" aria-label="Đặt lại 100%">100%</button>
            <button class="hmi-zbtn" id="zoomIn" aria-label="Phóng to"><span id="icPlus"></span></button>
            <button class="hmi-zbtn" id="fsBtn" aria-label="Toàn màn hình"><span id="icFs"></span></button>
          </div>
        </div>

        <div class="hmi-topology-wrap" id="topoWrap">
          <div class="hmi-topology-scale" id="topoScale">
            <svg id="hmiWires" xmlns="http://www.w3.org/2000/svg"></svg>
            <div id="hmiFloors"></div>
          </div>
        </div>

        <div class="hmi-listmode" id="listMode" style="display:none"></div>

        <div class="hmi-devlegend" id="devLegend"></div>
      </section>

      <!-- right panel -->
      <section class="hmi-card hmi-panel-card" id="panelCard">

        <div class="panel-body" id="panelBody"></div>
        <div class="panel-foot" id="panelFoot"></div>
        <div class="panel-collapsed" id="panelCollapsed"><span id="icInfo2"></span><div>Chọn một phòng trên sơ đồ để xem chi tiết thiết bị.</div></div>
      </section>

      <!-- energy overview -->
      <section class="hmi-card hmi-energy-card">
        <div class="energy-grid">
          <div class="energy-left">
            <h3 class="en-title">Tổng quan tiêu thụ điện</h3>
            <div class="en-kpis" id="enKpis"></div>
          </div>
          <div class="energy-right">
            <h3 class="en-title">Biểu đồ tiêu thụ điện (7 ngày gần nhất)</h3>
            <div class="en-chart" id="enChart"></div>
          </div>
        </div>
      </section>

      <!-- status legend -->
      <section class="hmi-card hmi-legend-card">
        <h3 class="lc-title">Chú thích trạng thái</h3>
        <div class="lc-item"><span class="dot on"></span>Đang bật / Hoạt động</div>
        <div class="lc-item"><span class="dot off"></span>Đang tắt / Không hoạt động</div>
        <div class="lc-item"><span class="dot warn"></span>Cảnh báo / Lỗi</div>
      </section>
    </div>

    <!-- toasts, overlays, tooltip -->
    <div class="hmi-toasts" id="hmiToasts"></div>
    <div class="hmi-overlay center" id="modalOverlay"><div class="hmi-modal" id="modalBox"></div></div>
    <div class="hmi-overlay right" id="drawerOverlay"><div class="hmi-drawer" id="drawerBox"></div></div>
    <div class="hmi-tip" id="hmiTip"></div>
  </div>
</div>

/* ---------- wires ---------- */
const WIRE='#1769D8';
function offPos(el){let x=0,y=0,n=el;const anc=qs('#topoScale');while(n&&n!==anc){x+=n.offsetLeft;y+=n.offsetTop;n=n.offsetParent;}return {x,y,w:el.offsetWidth,h:el.offsetHeight};}
function ln(x1,y1,x2,y2){return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+WIRE+'" stroke-width="3" stroke-linecap="round"/>';}
function nd(x,y){return '<circle cx="'+x+'" cy="'+y+'" r="5" fill="#fff" stroke="'+WIRE+'" stroke-width="2.5"/>';}
function ndA(x,y){return '<circle cx="'+x+'" cy="'+y+'" r="8.5" fill="'+WIRE+'"/><circle cx="'+x+'" cy="'+y+'" r="3" fill="#fff"/>';}
function drawWires(){
 const scale=qs('#topoScale');if(!scale)return;
 const svg=qs('#hmiWires');const W=scale.offsetWidth,H=scale.offsetHeight;
 svg.setAttribute('width',W);svg.setAttribute('height',H);svg.setAttribute('viewBox','0 0 '+W+' '+H);
 let out='';
 qsa('.hmi-floor').forEach(floor=>{
  const cab=qs('.hmi-cabinet',floor);const cards=qsa('.hmi-room',floor);
  if(!cards.length||!cab)return;
  const cp=offPos(cab);const cx=cp.x+cp.w,cy=cp.y+cp.h/2;
  const cs=cards.map(c=>{const p=offPos(c);return {x:p.x+p.w/2,top:p.y};});
  const busY=Math.min.apply(null,cs.map(c=>c.top))-22;
  const busStart=cx+18,x2=cs[cs.length-1].x;
  out+=ln(cx,cy,busStart,cy)+ln(busStart,cy,busStart,busY);
  out+=ln(busStart,busY,x2,busY);
  const activeIdx=floor.dataset.active?parseInt(floor.dataset.active,10):-1;
  cs.forEach((c,i)=>{out+=ln(c.x,busY,c.x,c.top);out+=(i===activeIdx?ndA(c.x,busY):nd(c.x,busY));});
 });
 svg.innerHTML=out;
}

/* ---------- toggle device (optimistic + rollback) ---------- */
function toggleDevice(roomId,devId,forceFail){
 const r=findRoom(roomId);const d=r.devices.find(x=>x.id===devId);if(!d)return;
 if(!d.controllable){toast('warn','Bạn không có quyền điều khiển thiết bị này.');return;}
 const prev={status:d.status,isOn:d.isOn};
 const target=!d.isOn;
 d.isOn=target;if(d.status!=='warn')d.status=target?'on':'off';
 d.pending=true;renderPanel();refreshRoomCard(r.id);
 const willFail=SIM_FAIL||forceFail;
 setTimeout(()=>{
  d.pending=false;
  if(willFail){
   d.status=prev.status;d.isOn=prev.isOn;
   pushEvent(d,target?'turn_off':'turn_on',prev,'failed',r.id);
   toast('error','Không thể điều khiển thiết bị. Vui lòng thử lại.');
  }else{
   pushEvent(d,target?'turn_on':'turn_off',prev,'success',r.id);
   toast(target?'success':'neutral',(target?'Đã bật ':'Đã tắt ')+d.name+'.');
   if(d.status==='warn')setTimeout(()=>toast('warn',d.name+' đang có cảnh báo. Kiểm tra trạng thái thiết bị.'),300);
  }
  renderPanel();refreshRoomCard(r.id);
 },260);
}
function refreshRoomCard(roomId){
 const r=findRoom(roomId);const card=qs('.hmi-room[data-room="'+roomId+'"]');if(!card||!r)return;
 qs('.hmi-devgrid',card).innerHTML=r.devices.map(devCellHTML).join('');
 qsa('.hmi-devcell.warnable',card).forEach(c=>{c.addEventListener('mousemove',e=>showTip(e,c.dataset.warn));c.addEventListener('mouseleave',hideTip);});
}
function pushEvent(d,action,prev,result,roomId){
 EVENTS.unshift({id:'e'+(evtSeq++),ts:nowStamp(),actor:'Nguyễn Văn A',action,target:d.name,roomId,result,
  from:prev.status==='on'?'Đang bật':prev.status==='warn'?'Cảnh báo':'Đang tắt',
  to:d.status==='on'?'Đang bật':d.status==='warn'?'Cảnh báo':'Đang tắt'});
}
function nowStamp(){const d=new Date();const p=n=>String(n).padStart(2,'0');return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear()+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());}

/* ---------- energy ---------- */
function renderEnergy(){
 const KP=[
  {ic:'bolt',label:'Công suất tức thời',val:'18.6',unit:'kW'},
  {ic:'trending',label:'Điện năng hôm nay',val:'186.2',unit:'kWh'},
  {ic:'calendarPlus',label:'Điện năng tháng này',val:'5,642',unit:'kWh'},
  {ic:'leaf',label:'CO₂ tiết kiệm',val:'342',unit:'kg',cls:' leaf'}
 ];
 qs('#enKpis').innerHTML=KP.map(k=>'<div class="en-kpi'+(k.cls||'')+'"><div class="eic">'+ui(k.ic,26)+'</div><div class="elabel">'+k.label+'</div><div class="eval">'+k.val+'<span class="eu">'+k.unit+'</span></div></div>').join('');
 drawChart();
}
function drawChart(){
 const box=qs('#enChart');const w=box.clientWidth,h=box.clientHeight;if(!w||!h)return;
 const padL=42,padR=14,padT=16,padB=30;
 const days=['14/05','15/05','16/05','17/05','18/05','19/05','20/05'];
 const vals=[150,210,148,200,230,200,190],max=300;
 const iw=w-padL-padR,ih=h-padT-padB;
 const X=i=>padL+iw*(i/(days.length-1)),Y=v=>padT+ih*(1-v/max);
 let g='';
 [0,100,200,300].forEach(t=>{const y=Y(t);g+='<line x1="'+padL+'" y1="'+y+'" x2="'+(w-padR)+'" y2="'+y+'" stroke="#EEF2F8"/>';g+='<text x="'+(padL-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="12" fill="#94A3B8">'+t+'</text>';});
 g+='<text x="'+(padL-8)+'" y="'+(padT-3)+'" text-anchor="end" font-size="11" fill="#94A3B8">kWh</text>';
 days.forEach((d,i)=>{g+='<text x="'+X(i)+'" y="'+(h-9)+'" text-anchor="middle" font-size="13" fill="#64748B">'+d+'</text>';});
 const pts=vals.map((v,i)=>[X(i),Y(v)]);
 const poly=pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
 g+='<polygon points="'+padL+','+Y(0)+' '+poly+' '+X(days.length-1)+','+Y(0)+'" fill="url(#enGrad)"/>';
 g+='<polyline points="'+poly+'" fill="none" stroke="#1769D8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
 pts.forEach((p,i)=>{const r=i===pts.length-1?6:4.5,sw=i===pts.length-1?3:2.5;g+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+r+'" fill="#fff" stroke="#1769D8" stroke-width="'+sw+'"/>';});
 box.innerHTML='<svg width="'+w+'" height="'+h+'"><defs><linearGradient id="enGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1769D8" stop-opacity="0.16"/><stop offset="1" stop-color="#1769D8" stop-opacity="0"/></linearGradient></defs>'+g+'</svg>';
}

/* ---------- list mode ---------- */
function renderList(){
 let rows='';
 FLOORS.forEach(f=>f.rooms.forEach(r=>r.devices.forEach(d=>{
  rows+='<tr><td>'+f.label+'</td><td>'+esc(r.name)+'</td><td>'+esc(d.name)+'</td><td>'+esc(d.category)+'</td>'
   +'<td><span class="hmi-stpill" style="color:'+stColor(d.status)+'"><span style="width:9px;height:9px;border-radius:50%;background:'+dotColor(d.status)+';display:inline-block"></span>'+stLabel(d.status)+'</span></td>'
   +'<td>'+esc(r.updatedAt)+'</td></tr>';
 })));
 qs('#listMode').innerHTML='<table class="hmi-table"><thead><tr><th>Tầng</th><th>Phòng/Khu vực</th><th>Thiết bị</th><th>Loại</th><th>Trạng thái</th><th>Cập nhật</th></tr></thead><tbody>'+rows+'</tbody></table>';
}
qs('#modeDiagram').addEventListener('click',()=>setMode('diagram'));
qs('#modeList').addEventListener('click',()=>setMode('list'));
function setMode(m){
 const diag=m==='diagram';
 qs('#modeDiagram').classList.toggle('active',diag);
 qs('#modeList').classList.toggle('active',!diag);
 qs('#topoWrap').style.display=diag?'':'none';
 qs('#listMode').style.display=diag?'none':'';
 if(!diag)renderList();else drawWires();
}

/* ---------- zoom + fullscreen ---------- */
qs('#zoomIn').addEventListener('click',()=>setZoom(Math.min(120,zoom+20)));
qs('#zoomOut').addEventListener('click',()=>setZoom(Math.max(80,zoom-20)));
qs('#zoomVal').addEventListener('click',()=>setZoom(100));
function setZoom(z){zoom=z;qs('#topoScale').style.transform='scale('+(z/100)+')';qs('#zoomVal').textContent=z+'%';}
qs('#fsBtn').addEventListener('click',()=>{
 const el=root;
 if(!document.fullscreenElement){
  if(el.requestFullscreen)el.requestFullscreen().then(()=>{}).catch(()=>toast('neutral','Trình duyệt không hỗ trợ chế độ toàn màn hình.'));
  else toast('neutral','Trình duyệt không hỗ trợ chế độ toàn màn hình.');
 }else{document.exitFullscreen&&document.exitFullscreen();}
});
document.addEventListener('fullscreenchange',()=>{root.classList.toggle('is-fs',!!document.fullscreenElement);setTimeout(()=>{fitStage();drawWires();drawChart();},60);});

/* ---------- toast ---------- */
function toast(type,msg){
 const el=document.createElement('div');el.className='hmi-toast '+type;
 const icon=type==='success'?'check':type==='error'?'alert':type==='warn'?'alert':'info';
 el.innerHTML='<span class="tic">'+ui(icon,20)+'</span><span>'+esc(msg)+'</span>';
 qs('#hmiToasts').appendChild(el);
 setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),220);},3600);
}

/* ---------- tooltip ---------- */
const tip=qs('#hmiTip');
function showTip(e,text){
 tip.textContent=text;tip.classList.add('show');
 const sr=qs('#hmiStage').getBoundingClientRect();
 const sc=(sr.width/1920)||1;
 tip.style.left=((e.clientX-sr.left)/sc)+'px';
 tip.style.top=((e.clientY-sr.top)/sc-6)+'px';
}
function hideTip(){tip.classList.remove('show');}

/* ---------- overlays ---------- */
const modalOv=qs('#modalOverlay'),drawerOv=qs('#drawerOverlay');
function openModal(html){qs('#modalBox').innerHTML=html;modalOv.classList.add('show');}
function closeModal(){modalOv.classList.remove('show');}
function openDrawer(html){qs('#drawerBox').innerHTML=html;drawerOv.classList.add('show');}
function closeDrawer(){drawerOv.classList.remove('show');}
modalOv.addEventListener('click',e=>{if(e.target===modalOv)closeModal();});
drawerOv.addEventListener('click',e=>{if(e.target===drawerOv)closeDrawer();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeDrawer();}});

/* ---------- group control ---------- */
function openGroup(){
 const r=findRoom(selectedRoomId);let choice='on';
 openModal(
  '<div class="mo-head"><h3>Điều khiển nhóm · '+esc(r.name)+'</h3><button class="mo-x" id="gX">'+ui('x',20)+'</button></div>'
  +'<div class="mo-body"><div class="grp-summary">Áp dụng cho <b>'+r.devices.length+' thiết bị</b> trong phòng '+esc(r.name)+'. Thao tác nhóm sẽ được ghi nhật ký cho từng thiết bị.</div>'
  +'<div class="grp-choice"><div class="grp-opt sel" data-c="on" id="optOn">'+ui('bolt',22,'#1769D8')+'Bật tất cả</div><div class="grp-opt off-opt" data-c="off" id="optOff">'+ui('powerOff',22,'#64748B')+'Tắt tất cả</div></div></div>'
  +'<div class="mo-foot"><button class="hmi-btn" id="gCancel">Hủy</button><button class="hmi-btn primary" id="gOk">'+ui('check',18)+'Xác nhận</button></div>');
 const setC=c=>{choice=c;qs('#optOn').classList.toggle('sel',c==='on');qs('#optOff').classList.toggle('sel',c==='off');};
 qs('#optOn').addEventListener('click',()=>setC('on'));
 qs('#optOff').addEventListener('click',()=>setC('off'));
 qs('#gX').addEventListener('click',closeModal);
 qs('#gCancel').addEventListener('click',closeModal);
 qs('#gOk').addEventListener('click',()=>{
  const target=choice==='on';
  r.devices.forEach(d=>{if(!d.controllable)return;const prev={status:d.status,isOn:d.isOn};d.isOn=target;if(d.status!=='warn')d.status=target?'on':'off';pushEvent(d,target?'turn_on':'turn_off',prev,'success',r.id);});
  closeModal();renderPanel();refreshRoomCard(r.id);
  toast('success','Đã '+(target?'bật':'tắt')+' tất cả thiết bị của '+r.name+'.');
 });
}

/* ---------- history ---------- */
let histRange='today';
function openHistory(){
 const r=findRoom(selectedRoomId);
 openDrawer(
  '<div class="mo-head"><h3>Lịch sử hoạt động · '+esc(r.name)+'</h3><button class="mo-x" id="hX">'+ui('x',20)+'</button></div>'
  +'<div class="mo-body" style="flex:1">'
   +'<div class="hist-filters"><button class="hist-chip'+(histRange==='today'?' active':'')+'" data-r="today">Hôm nay</button><button class="hist-chip'+(histRange==='7d'?' active':'')+'" data-r="7d">7 ngày</button>'
   +'<span class="hist-sim'+(SIM_FAIL?' on':'')+'" id="simTg" title="Bật để mô phỏng command thất bại"><span class="mini-tg"></span>Mô phỏng lỗi</span></div>'
   +'<div id="histList"></div>'
  +'</div>');
 qs('#hX').addEventListener('click',closeDrawer);
 qsa('#drawerBox .hist-chip').forEach(c=>c.addEventListener('click',()=>{histRange=c.dataset.r;qsa('#drawerBox .hist-chip').forEach(x=>x.classList.toggle('active',x===c));renderHist();}));
 qs('#simTg').addEventListener('click',()=>{SIM_FAIL=!SIM_FAIL;qs('#simTg').classList.toggle('on',SIM_FAIL);toast(SIM_FAIL?'warn':'neutral',SIM_FAIL?'Đã bật mô phỏng lỗi command (thao tác kế tiếp sẽ thất bại & rollback).':'Đã tắt mô phỏng lỗi.');});
 renderHist();
}
function renderHist(){
 const r=findRoom(selectedRoomId);
 let list=EVENTS.filter(e=>e.roomId===selectedRoomId);
 if(histRange==='today')list=list.filter(e=>e.ts.indexOf('20/05/2025')===0);
 const box=qs('#histList');if(!box)return;
 box.innerHTML=list.length?list.map(e=>{
  const cls=e.result==='success'?'ok':e.result==='failed'?'fail':e.result==='denied'?'deny':'deny';
  const ic=e.result==='success'?'check':e.result==='failed'?'x':'alert';
  const actMap={turn_on:'đã bật',turn_off:'đã tắt',group_turn_on:'bật nhóm',group_turn_off:'tắt nhóm',warning:'cảnh báo',open_history:'xem lịch sử'};
  const resTxt=e.result==='success'?'Thành công':e.result==='failed'?'Thất bại':'Cảnh báo';
  return '<div class="hist-item"><div class="hi-dot '+cls+'">'+ui(ic,15)+'</div><div class="hi-b">'
   +'<div class="hi-line"><b>'+esc(e.actor)+'</b> '+(actMap[e.action]||e.action)+' <b>'+esc(e.target)+'</b>'+(e.from&&e.to?' ('+esc(e.from)+' → '+esc(e.to)+')':'')+'</div>'
   +'<div class="hi-meta">'+esc(e.ts)+' · '+resTxt+'</div></div></div>';
 }).join(''):'<div class="hist-empty">Chưa có hoạt động nào trong khoảng thời gian này.</div>';
}

/* ---------- fit stage ---------- */
function fitStage(){
 const stage=qs('#hmiStage');
 const s=Math.min(window.innerWidth/1920,window.innerHeight/1332);
 const scale=Math.min(1,s);
 stage.style.transform='scale('+scale+')';
 stage.style.marginBottom=((scale<1)?((scale-1)*1332):0)+'px';
}
window.addEventListener('resize',()=>{fitStage();drawWires();drawChart();});

/* ---------- init ---------- */
function init(){
 renderFloors();renderDevLegend();renderEnergy();renderPanel();
 fitStage();
 setTimeout(()=>{drawWires();drawChart();},30);
}
init();

window.__HMI__={selectRoom,toggleDevice,setMode,setZoom,openHistory,openGroup,findRoom,FLOORS,getState:()=>({selectedRoomId,zoom,SIM_FAIL})};
})();

function normApp(a,personal){return {id:a.id,name:a.name,icon:a.icon,desc:a.desc,cat:a.cat||'primary',target:a.target,locked:a.locked,personal:!!personal,url:a.url,openMode:a.openMode,color:a.color,current:a.current};}

/* thứ tự các nhóm ứng dụng — sắp xếp được, riêng theo tài khoản */
var DEFAULT_SECTIONS=['primary','school','dieu-hanh','dao-tao','hoc-sinh','co-so','quan-tri'];
function sectionOrder(){var p=prefs();if(!p.sectionOrder||!p.sectionOrder.length){p.sectionOrder=DEFAULT_SECTIONS.slice();}else{DEFAULT_SECTIONS.forEach(function(k){if(p.sectionOrder.indexOf(k)<0)p.sectionOrder.push(k);});p.sectionOrder=p.sectionOrder.filter(function(k){return DEFAULT_SECTIONS.indexOf(k)>=0;});}return p.sectionOrder;}
function sectionTitle(key){if(key==='primary')return 'Ứng dụng chính';if(key==='school')return 'Ứng dụng của nhà trường';return catName(key);}
function sectionApps(key){if(key==='primary')return heroApps().filter(function(a){return !isHidden(a.id);});if(key==='school')return schoolApps().filter(function(a){return !isHidden(a.id);});return allApps().filter(function(a){return a.cat===key&&!isHidden(a.id);});}
function sectionIcon(key){var m={primary:'grid',school:'landmark','dieu-hanh':'clipboardCheck','dao-tao':'book','hoc-sinh':'users','co-so':'building','quan-tri':'shield'};return m[key]||'folder';}

function groups(){return prefs().groups;}
function groupIndex(id){var g=groups();for(var i=0;i<g.length;i++)if(g[i].id===id)return i;return -1;}
function groupById(id){var i=groupIndex(id);return i<0?null:groups()[i];}
function groupableApps(){return heroApps().concat(schoolApps(),catalogApps());}
function orphanApps(){var inG={};groups().forEach(function(g){g.appIds.forEach(function(id){inG[id]=1;});});return groupableApps().filter(function(a){return !inG[a.id];});}
function appById(id){var all=allApps();for(var i=0;i<all.length;i++)if(all[i].id===id)return all[i];return null;}
function catName(id){if(id==='school')return 'Ứng dụng của nhà trường';for(var i=0;i<CATEGORIES.length;i++)if(CATEGORIES[i].id===id)return CATEGORIES[i].name;return '';}
function isStarred(id){return prefs().starred.indexOf(id)>=0;}
function isHidden(id){return prefs().hidden.indexOf(id)>=0;}
function toggleStar(id){var p=prefs();var i=p.starred.indexOf(id);if(i>=0)p.starred.splice(i,1);else p.starred.push(id);}
function toggleHidden(id){var p=prefs();var i=p.hidden.indexOf(id);if(i>=0)p.hidden.splice(i,1);else p.hidden.push(id);}
function recordRecent(id){var p=prefs();p.recent=p.recent.filter(function(r){return r.id!==id;});p.recent.unshift({id:id,at:Date.now?Date.now():0});if(p.recent.length>20)p.recent=p.recent.slice(0,20);}

function highlight(text,q){if(!q)return esc(text);try{var re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');return esc(text).replace(re,'<mark>$1</mark>');}catch(e){return esc(text);}}

function cardHTML(a,opts){
 opts=opts||{};var starred=isStarred(a.id);
 var label=opts.highlight?highlight(a.name,opts.highlight):esc(a.name);
 var tileStyle=a.color?(' style="background:'+a.color+'1f;color:'+a.color+'"'):'';
 return '<div class="al-card'+(a.current?' current':'')+(a.personal?' personal':'')+'" data-id="'+a.id+'" tabindex="0" role="button" aria-label="'+esc(a.name)+'"'+(opts.pinned?' draggable="true"':'')+'>'
  +(a.personal?'<span class="al-badge">Của tôi</span>':'')
  +'<button class="al-star'+(starred?' starred':'')+'" data-star="'+a.id+'" aria-label="'+(starred?'Bỏ ghim ':'Ghim ')+esc(a.name)+'" title="'+(starred?'Bỏ ghim':'Ghim')+'">'+ic('star',18,starred)+'</button>'
  +'<div class="al-tile"'+tileStyle+'>'+ic(a.icon,30)+'</div>'
  +'<div class="al-label">'+label+'</div>'
  +(a.personal?'<div class="al-appmenu"><button class="al-iconbtn" data-edit="'+a.id+'" aria-label="Sửa ứng dụng" title="Sửa">'+ic('pencil',14)+'</button></div>':'')
  +'</div>';
}
function sectionHTML(title,apps,opts){
 opts=opts||{};if(!apps.length)return '';
 var h='<div class="al-section">';
 if(title)h+='<div class="al-sec-head"><h3>'+esc(title)+'</h3><span class="al-count">'+apps.length+'</span></div>';
 h+='<div class="al-grid"'+(opts.pinned?' data-pinned="1"':'')+'>'+apps.map(function(a){return cardHTML(a,opts);}).join('')+'</div></div>';
 return h;
}
function render(){
 var body=document.getElementById('alBody');var p=prefs();
 var q=norm(AL.search.trim());
 if(q){
  var res=allApps().filter(function(a){return !isHidden(a.id);}).filter(function(a){return norm(a.name).indexOf(q)>=0||norm(a.desc||'').indexOf(q)>=0||norm(catName(a.cat)).indexOf(q)>=0;});
  if(!res.length){body.innerHTML='<div class="al-empty"><div class="al-empty-ic">'+ic('search',26)+'</div><h4>Không tìm thấy ứng dụng phù hợp</h4><div>Thử từ khóa khác hoặc tạo ứng dụng riêng.</div></div>';return;}
  body.innerHTML=sectionHTML('Kết quả tìm kiếm',res,{highlight:AL.search.trim()});
  bindCards();return;
 }
 var html='';
 var starred=p.starred.map(appById).filter(function(a){return a&&!isHidden(a.id);});
 if(starred.length)html+=sectionHTML('Đã ghim',starred,{pinned:true});
 var recent=p.recent.map(function(r){return appById(r.id);}).filter(function(a){return a&&!isHidden(a.id);}).slice(0,8);
 if(recent.length)html+=sectionHTML('Truy cập gần đây',recent,{});
 groups().forEach(function(g){
  var apps=g.appIds.map(appById).filter(Boolean).filter(function(a){return !isHidden(a.id);});
  if(apps.length)html+=sectionHTML(g.name,apps,{});
 });
 body.innerHTML=html;
 bindCards();
}
function bindCards(){
 qsa('#alBody .al-card').forEach(function(card){
  var id=card.getAttribute('data-id');
  card.addEventListener('click',function(e){if(e.target.closest('.al-star')||e.target.closest('.al-appmenu'))return;launch(appById(id));});
  card.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();launch(appById(id));}});
 });
 qsa('#alBody .al-star').forEach(function(b){b.addEventListener('click',function(e){e.stopPropagation();toggleStar(b.getAttribute('data-star'));render();});});
 qsa('#alBody .al-iconbtn[data-edit]').forEach(function(b){b.addEventListener('click',function(e){e.stopPropagation();openForm(b.getAttribute('data-edit'));});});
 // drag reorder within pinned
 var grid=qs('#alBody .al-grid[data-pinned]');
 if(grid){
  var dragId=null;
  qsa('.al-card',grid).forEach(function(card){
   card.addEventListener('dragstart',function(){dragId=card.getAttribute('data-id');card.classList.add('dragging');});
   card.addEventListener('dragend',function(){card.classList.remove('dragging');qsa('.al-card',grid).forEach(function(c){c.classList.remove('dragover');});});
   card.addEventListener('dragover',function(e){e.preventDefault();card.classList.add('dragover');});
   card.addEventListener('dragleave',function(){card.classList.remove('dragover');});
   card.addEventListener('drop',function(e){e.preventDefault();var toId=card.getAttribute('data-id');if(!dragId||dragId===toId)return;var p=prefs();var from=p.starred.indexOf(dragId),to=p.starred.indexOf(toId);if(from<0||to<0)return;p.starred.splice(to,0,p.starred.splice(from,1)[0]);render();});
  });
 }
}
function launch(a){
 if(!a)return;
 if(a.locked){toast('Bạn không có quyền truy cập ứng dụng này (Access denied).');return;}
 closeLauncher();
 if(a.target&&a.target.type==='internal'){
  if(a.target.fn==='work'&&typeof showWork==='function')showWork();
  else if(a.target.fn==='electrical'&&typeof showElectrical==='function')showElectrical();
 }else if(a.personal&&a.url){
  if(a.openMode==='new'){try{window.open(a.url,'_blank','noopener');}catch(e){}toast('Đang mở '+a.name+' ở tab mới.');}
  else toast('Mở '+a.name+' → '+a.url+' (mock điều hướng)');
 }else{
  toast('Đang mở '+a.name+'… (mock)');
 }
 recordRecent(a.id);
}

var box=document.getElementById('appLauncher');

function openLauncher(){
 lastFocus=document.activeElement;
 AL.search='';var si=document.getElementById('alSearch');if(si)si.value='';
 render();
 box.setAttribute('aria-hidden','false');
 setTimeout(function(){var s=document.getElementById('alSearch');if(s)s.focus();},40);
}
function closeLauncher(){
 box.setAttribute('aria-hidden','true');
 hideSub();
 if(lastFocus&&lastFocus.focus)try{lastFocus.focus();}catch(e){}
}
function isOpen(){return box.getAttribute('aria-hidden')==='false';}
document.getElementById('alOverlay').addEventListener('click',closeLauncher);
document.getElementById('alClose').addEventListener('click',closeLauncher);
document.getElementById('alClose').innerHTML=ic('x',20);

document.addEventListener('keydown',function(e){
 if(e.key==='Escape'&&isOpen()){var sub=document.getElementById('alSub');if(sub.classList.contains('show')){hideSub();}else{closeLauncher();}}
 if(e.key==='Tab'&&isOpen()){
  var sub=document.getElementById('alSub');var scope=sub.classList.contains('show')?sub:document.getElementById('alDialog');
  var f=qsa('a[href],button:not([disabled]),input,select,textarea,[tabindex]:not([tabindex="-1"])',scope).filter(function(x){return x.offsetParent!==null;});
  if(!f.length)return;var first=f[0],last=f[f.length-1];
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
 }
});

document.getElementById('alSearch').addEventListener('input',function(e){var v=e.target.value;clearTimeout(searchTimer);searchTimer=setTimeout(function(){AL.search=v;render();},200);});
