      width: 100%;
      height: 190px;
    }

    .kpi-trend svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .kpi-formula {
      font-family: ui-monospace, Menlo, Consolas, monospace;
      background: #f6f8fc;
      border: 1px solid #e9eef7;
      border-radius: 10px;
      padding: 14px;
      color: var(--ks-navy);
      font-size: 14px;
      text-align: center;
      line-height: 1.6;
    }

    .kpi-report-head {
      text-align: center;
      margin-bottom: 16px;
    }

    .kpi-report-head b {
      display: block;
      font-size: 16px;
      color: var(--ks-navy);
    }

    .kpi-report-head span {
      font-size: 13px;
      color: var(--ks-muted);
    }

    .kpi-state {
      padding: 48px 20px;
      text-align: center;
      color: var(--ks-muted);
    }

    .kpi-state .st-ic {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: #eef4fc;
      color: var(--ks-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }

    .kpi-state.err .st-ic {
      background: #fdecef;
      color: var(--ks-danger);
    }

    .kpi-state.perm .st-ic {
      background: #fff6e6;
      color: var(--ks-warning);
    }

    .kpi-state h3 {
      margin: 0 0 6px;
      color: var(--ks-navy);
      font-size: 17px;
      font-weight: 700;
    }

    .kpi-state p {
      margin: 0 0 16px;
      font-size: 14px;
    }

    .kpi-sk {
      height: 14px;
      border-radius: 6px;
      background: linear-gradient(90deg, #eef2f8 25%, #e2e9f3 37%, #eef2f8 63%);
      background-size: 400% 100%;
      animation: shimmer 1.3s ease infinite;
    }

    .kpi-evalrow {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .kpi-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ks-navy);
      background: #eef4fc;
      border: 1px solid #d9e6f8;
      border-radius: 999px;
      padding: 4px 11px;
    }

    .kpi-desktop-table .kpi-tag {
      white-space: nowrap;
    }

    .kpi-desktop-table td.kpi-typecell {
      white-space: nowrap;
    }

    .kpi-notice {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 16px;
      font-size: 13.5px;
      line-height: 1.5;
    }

    .kpi-notice.warn {
      background: #fff8ec;
      border: 1px solid #f4dca0;
      color: #8a5a00;
    }

    .kpi-notice.danger {
      background: #fff1f3;
      border: 1px solid #f6c6ce;
      color: #a52a3c;
    }

    .kpi-mininfo {
      font-size: 12.5px;
      color: var(--ks-muted);
    }

    /* status tabs (gộp menu — chia theo trạng thái) */
    .kpi-tabs {
      flex-wrap: wrap;
      margin-bottom: 14px;
      padding: 0;
      border-bottom: none;
      gap: 6px;
    }

    .kpi-tabs .tab {
      border: 1px solid var(--ks-border);
      border-radius: var(--r-pill);
      padding: 7px 13px;
      font-size: 13px;
      background: #fff;
    }

    .kpi-tabs .tab:hover {
      border-color: #9CCBFF;
    }

    .kpi-tabs .tab.active {
      color: #fff;
      background: var(--ks-primary);
      border-color: var(--ks-primary);
      border-bottom-color: var(--ks-primary);
    }

    .kpi-tabs .tab.active .tcount {
      background: rgba(255, 255, 255, .28);
      color: #fff;
    }

    /* checklist trong chi tiết */
    .kpi-cklist {
      border: 1px solid var(--ks-border);
      border-radius: 10px;
      padding: 4px 14px;
    }

    .kpi-ckitem {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-top: 1px solid #eef2f8;
    }

    .kpi-ckitem:first-child {
      border-top: none;
    }

    .kpi-ckitem .ck-t {
      font-size: 14px;
      color: var(--ks-text);
    }

    .kpi-ckitem.done .ck-t {
      color: var(--ks-muted);
      text-decoration: line-through;
    }

    .kpi-ckbox {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 1.5px solid var(--ks-border);
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      flex: none;
      cursor: pointer;
      padding: 0;
    }

    .kpi-ckbox svg {
      opacity: 0;
    }

    .kpi-ckbox.on {
      background: var(--ks-success);
      border-color: var(--ks-success);
    }

    .kpi-ckbox.on svg {
      opacity: 1;
    }

    .kpi-ckbox[disabled] {
      cursor: not-allowed;
      opacity: .55;
    }

    /* form tạo mới chỉ tiêu (trong #kpiModal) */
    .kpi-seg {
      display: flex;
      gap: 8px;
    }

    .kpi-seg button {
      flex: 1;
      height: 46px;
      border: 1px solid var(--ks-border);
      border-radius: 10px;
      background: #fff;
      font-weight: 600;
      color: var(--ks-navy);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      font-size: 13.5px;
    }

    .kpi-seg button.on {
      border-color: var(--ks-primary);
      background: var(--ks-hover-blue);
      color: var(--ks-primary);
      box-shadow: var(--ks-focus);
    }

    .kpi-form2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 14px;
    }

    #kpiModal .modal-body {
      max-height: 62vh;
      overflow-y: auto;
    }

    #kpiModal .field {
      margin-bottom: 12px;
    }

    #kpiModal .ci {
      width: 100%;
      height: 40px;
      border: 1px solid var(--ks-border);
      border-radius: 8px;
      padding: 0 12px;
      font-size: 14px;
      background: #fff;
      color: var(--ks-text);
    }

    #kpiModal .ci:focus {
      border-color: var(--ks-primary);
      box-shadow: var(--ks-focus);
      outline: none;
    }

    .kpi-ckedit {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .kpi-ckedit .ck-ic {
      color: var(--ks-muted);
      flex: none;
    }

    .kpi-ckedit .ci {
      flex: 1;
    }

    .kpi-bandrow {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .kpi-bandrow .ci {
      height: 38px;
    }

    .kpi-bandrow .kpi-select {
      height: 38px;
    }

    /* Chi tiết full-page */
    .kpi-detail-head {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .kpi-detail-head .kpi-detail-title {
      flex: 1;
      min-width: 220px;
    }

    .kpi-detail-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .kpi-detail-grid {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 18px;
      align-items: start;
    }

    .kpi-side-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 0;
      border-top: 1px solid #eef2f8;
      font-size: 13.5px;
    }

    .kpi-side-row:first-of-type {
      border-top: none;
    }

    .kpi-side-row .lbl2 {
      color: var(--ks-muted);
    }

    .kpi-side-row .val2 {
      font-weight: 600;
      color: var(--ks-text);
      text-align: right;
    }

    @media(max-width:900px) {
      .kpi-detail-grid {
        grid-template-columns: 1fr;
      }
    }

    @media(max-width:1100px) {
      .kpi-kpis {
        grid-template-columns: repeat(3, 1fr);
      }

      .kpi-2col {
        grid-template-columns: 1fr;
      }
    }

    @media(max-width:768px) {
      .kpi-screen {
        padding: 16px 16px 32px;
      }

      .kpi-cx-foot {
        margin: 16px -16px -32px;
        padding: 12px 16px;
      }

      .kpi-page-head h1 {
        font-size: 23px;
      }

      .kpi-kpis {
        grid-template-columns: 1fr 1fr;
      }

      .kpi-desktop-table {
        display: none;
      }

      .kpi-card-list {
        display: flex;
      }

      .kpi-form2 {
        grid-template-columns: 1fr;
      }
    }

    /* =====================================================================
   MODULE CHỈ TIÊU ĐIỀU HÀNH (scope .op-* — reuse token/design system)
   ===================================================================== */
    .op-screen {
      padding: 20px var(--gutter) 40px;
      min-width: 0;
    }

    .op-head {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .op-head .oh-l {
      min-width: 0;
    }

    .op-head h1 {
      font-size: 26px;
      line-height: 34px;
      font-weight: 700;
      color: var(--ks-navy);
      margin: 0;
    }

    .op-head .op-sub {
      color: var(--ks-muted);
      font-size: 14px;
      margin-top: 4px;
      max-width: 680px;
    }

    .op-head .op-actions {
      margin-left: auto;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .op-ctx {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      align-items: flex-end;
      padding: 12px 16px;
      margin-bottom: 14px;
    }

    .op-ctx-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .op-ctx-item label {
      font-size: 11px;
      color: var(--ks-muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .03em;
    }

    .op-select {
      height: 34px;
      border-radius: var(--r-pill);
      border: 1px solid var(--ks-border);
      background: #fff;
      color: var(--ks-navy);
      font-size: 13.5px;
      font-weight: 600;
      padding: 0 30px 0 12px;
      appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>");
      background-repeat: no-repeat;
      background-position: right 10px center;
      cursor: pointer;
      outline: none;
    }

    .op-select:focus {
      border-color: var(--ks-primary);
      box-shadow: var(--ks-focus);
    }

    .op-toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .op-toolbar .search-box {
      max-width: 320px;
      flex: 1;
      min-width: 190px;
    }

    .op-selbar {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #eef4fc;
      border: 1px solid #d9e6f8;
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .op-selbar b {
      color: var(--ks-navy);
    }

    .op-selbar .sb-actions {
      margin-left: auto;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .op-tablecard {
      background: #fff;
      border: 1px solid var(--ks-border);
      border-radius: var(--r-card);
      overflow: hidden;
    }

    .op-tablewrap {
      overflow: auto;
      max-height: calc(100vh - 320px);
    }

    table.op-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      min-width: 1180px;
      font-size: 13.5px;
    }

    .op-table th,
    .op-table td {
      padding: 10px 12px;
      border-bottom: 1px solid #EAF1FA;
      vertical-align: middle;
      text-align: left;
      background: #fff;
    }

    .op-table thead th {
      position: sticky;
      top: 0;
      z-index: 5;
      background: #F2F7FD;
      color: var(--ks-navy);
      font-weight: 700;
      font-size: 12.5px;
      white-space: nowrap;
      border-bottom: 1px solid #DCE7F5;
    }

    .op-table thead tr.op-filter-row th {
      top: 39px;
      background: #fff;
      padding: 6px 8px;
      border-bottom: 1px solid #EAF1FA;
    }

    .op-table td.c-stt,
    .op-table th.c-stt {
      position: sticky;
      left: 0;
      z-index: 3;
      width: 52px;
      min-width: 52px;
      text-align: center;
      box-shadow: 1px 0 0 #EAF1FA;
    }

    .op-table td.c-name,
    .op-table th.c-name {
      position: sticky;
      left: 52px;
      z-index: 3;
      min-width: 300px;
      box-shadow: 1px 0 0 #EAF1FA;
    }

    .op-table thead th.c-stt,
    .op-table thead th.c-name {
      z-index: 7;
    }

    .op-table tbody tr:hover td {
      background: #F7FAFF;
    }

    .op-row-group td {
      background: #f4f8fd;
      font-weight: 700;
      color: var(--ks-navy);
    }

    .op-row-group.lvl-0 td {
      background: #e7f0fb;
    }

    .op-row-group td.c-name,
    .op-row-group td.c-stt {
      background: #eaf1fb;
    }

    .op-row-group.lvl-0 td.c-name,
    .op-row-group.lvl-0 td.c-stt {
      background: #deebfa;
    }

    .op-grp-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }

    .op-grp-toggle .chev {
      transition: transform .15s;
      color: var(--ks-muted);
      flex: none;
    }

    .op-grp-toggle.collapsed .chev {
      transform: rotate(-90deg);
    }

    .op-name-cell {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .op-name-cell .nm {
      min-width: 0;
    }

    .op-name-cell .op-ind-code {
      font-size: 11.5px;
      color: var(--ks-muted);
      font-weight: 600;
    }

    .op-indent-1 {
      padding-left: 16px;
    }

    .op-indent-2 {
      padding-left: 34px;
    }

    .op-num {
      text-align: right;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .op-auto-time {
      font-size: 11px;
      color: var(--ks-muted);
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .op-colfilter {
      width: 100%;
      height: 30px;
      border: 1px solid var(--ks-border);
      border-radius: 7px;
      padding: 0 8px;
      font-size: 12.5px;
      background: #fff;
      color: var(--ks-text);
    }

    .op-colfilter:focus {
      border-color: var(--ks-primary);
      box-shadow: var(--ks-focus);
      outline: none;
    }

    .op-sortable {
      cursor: pointer;
      user-select: none;
    }

    .op-sortable .op-sort-ic {
      color: #6f9fd8;
      margin-left: 3px;
      vertical-align: middle;
    }

    .op-dd {
      position: relative;
      display: inline-block;
    }

    .op-dd-menu {
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      background: #fff;
      border: 1px solid var(--ks-border);
      border-radius: 10px;
      box-shadow: 0 12px 30px rgba(24, 43, 87, .16);
      padding: 6px;
      min-width: 190px;
      z-index: 40;
      display: none;
    }

    .op-dd.open .op-dd-menu {
      display: block;
    }

    .op-dd-menu button {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      border: none;
      background: transparent;
      padding: 9px 10px;
      border-radius: 7px;
      font-size: 13.5px;
      color: var(--ks-navy);
      cursor: pointer;
      text-align: left;
    }

    .op-dd-menu button:hover {
      background: #eef4fc;
    }

    .op-cards {
      display: none;
      flex-direction: column;
      gap: 10px;
    }

    .op-card {
      border: 1px solid var(--ks-border);
      border-radius: 10px;
      padding: 12px 14px;
    }

    .op-card .oc-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
      align-items: flex-start;
    }

    .op-card .oc-name {
      font-weight: 600;
      color: var(--ks-text);
    }

    .op-card .oc-code {
      font-size: 12px;
      color: var(--ks-muted);
    }

    .op-card .oc-kv {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
      padding: 3px 0;
    }

    .op-card .oc-kv em {
      color: var(--ks-muted);
      font-style: normal;
    }

    .op-grpcard {
      font-weight: 700;
      color: var(--ks-navy);
      background: #eef4fc;
      border: 1px solid #dbe8f8;
      border-radius: 8px;
      padding: 9px 12px;
    }

    .op-kv {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 0;
      border-top: 1px solid #eef2f8;
      font-size: 13.5px;
    }

    .op-kv:first-of-type {
      border-top: none;
    }

    .op-kv .k {
      color: var(--ks-muted);
    }

    .op-kv .v {
      font-weight: 600;
      color: var(--ks-text);
      text-align: right;
    }

    .op-evi {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-top: 1px solid #eef2f8;
      font-size: 13.5px;
    }

    .op-evi:first-of-type {
      border-top: none;
    }

    .op-evi .ev-ic {
      color: var(--ks-primary);
      flex: none;
    }

    .op-evi .ev-meta {
      font-size: 11.5px;
      color: var(--ks-muted);
    }

    .op-state {
      padding: 44px 20px;
      text-align: center;
      color: var(--ks-muted);
    }

    .op-state .st-ic {
      width: 54px;
      height: 54px;
      border-radius: 15px;
      background: #eef4fc;
      color: var(--ks-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }

    .op-mininfo {
      font-size: 12.5px;
      color: var(--ks-muted);
    }

    #opModal .op-in {
      width: 100%;
      height: 40px;
      border: 1px solid var(--ks-border);
      border-radius: 8px;
      padding: 0 12px;
      font-size: 14px;
      background: #fff;
      color: var(--ks-text);
    }

    #opModal .op-in:focus {
      border-color: var(--ks-primary);
      box-shadow: var(--ks-focus);
      outline: none;
    }

    #opModal .field {
      margin-bottom: 12px;
    }

    .op-wf {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .op-wf .wf-step {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 12px;
      border-radius: var(--r-pill);
      background: #eef1f6;
      color: var(--ks-muted);
      font-size: 12.5px;
      font-weight: 600;
    }

    .op-wf .wf-step.done {
      background: #eafaf0;
      color: var(--ks-success);
    }

    .op-wf .wf-step.active {
      background: var(--ks-primary);
      color: #fff;
    }

    .op-wf .wf-arrow {
      color: #c3cede;
    }

    /* Chế độ bảng tính (Excel) cho Danh mục chỉ tiêu */
    .op-xls-wrap {
      overflow: auto;
      max-height: calc(100vh - 300px);
      border: 1px solid var(--ks-border);
      border-radius: var(--r-card);
      background: #fff;
    }

    table.op-xls {
      border-collapse: collapse;
      width: 100%;
      min-width: 1260px;
      font-size: 13px;
    }

    .op-xls th,
    .op-xls td {
      border: 1px solid #e3ebf5;
      padding: 0;
      vertical-align: middle;
    }

      background: #F2F7FD;
      color: var(--ks-navy);
      font-weight: 700;
      font-size: 12px;
      padding: 8px 8px;

      top: 0;
      z-index: 2;
      text-align: left;
      white-space: nowrap;
    }

    .op-xls td.rownum,
    .op-xls th.rownum {
      background: #f7fafd;
      color: var(--ks-muted);
      text-align: center;
      width: 42px;

      font-weight: 600;
      padding: 0 4px;
    }

    .op-xls .xc {

      border: none;
      background: transparent;
      padding: 8px 9px;
      font-size: 13px;
      color: var(--ks-text);
      outline: none;
      font-family: inherit;
    }

    .op-xls .xc:focus {
      background: #eef6ff;
      box-shadow: inset 0 0 0 2px var(--ks-primary);
      border-radius: 3px;
    }

    .op-xls select.xc {
      appearance: none;
      cursor: pointer;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>");
      background-repeat: no-repeat;
      background-position: right 6px center;
      padding-right: 22px;
    }

    .op-xls td.act {
      white-space: nowrap;
      text-align: center;
      width: 88px;
      padding: 0 4px;
    }

    /* ---- KPI bảng tính (Excel-like + công thức) ---- */
    .kpi-fxbar {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fff;
      border: 1px solid var(--ks-border);
      border-radius: var(--r-card);
      padding: 6px 10px;
      margin-bottom: 10px;
      box-shadow: var(--sh-sm, 0 1px 2px rgba(16, 42, 77, .04));
    }

    .kpi-fxbar .fx-addr {
      min-width: 56px;
      text-align: center;
      font-weight: 700;
      color: var(--ks-navy);
      background: #F2F7FD;
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 13px;
    }

    .kpi-fxbar .fx-ic {
      color: var(--ks-muted);
      flex: none;
      display: flex;
    }

    .kpi-fxbar .fx-in {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-size: 13.5px;
      color: var(--ks-text);
      font-family: inherit;
      padding: 5px 2px;
    }

    .kpi-fxbar .fx-fnbtn {
      flex: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 1px solid var(--ks-border);
      background: #fff;
      color: var(--ks-navy);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }

    .kpi-fxbar .fx-fnbtn:hover {
      background: #f2f7fd;
      border-color: #cfe0f5;
    }

    .kpi-fxbar .fx-menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 6px;
      z-index: 60;
      width: 360px;
      max-width: calc(100vw - 60px);
      max-height: 340px;
      overflow: auto;
      background: #fff;
      border: 1px solid var(--ks-border);
      border-radius: 10px;
      box-shadow: 0 12px 30px rgba(16, 42, 77, .16);
      padding: 6px;
    }

    .kpi-fxbar .fx-menu[hidden] {
      display: none;
    }

    .kpi-fxbar .fx-menu .fx-menu-h {
      font-size: 12px;
      color: var(--ks-muted);
      padding: 6px 8px 8px;
      border-bottom: 1px solid var(--ks-border);
      margin-bottom: 4px;
    }

    .kpi-fxbar .fx-menu .fx-mi {
      display: block;
      width: 100%;
      text-align: left;
      border: none;
      background: transparent;
      border-radius: 7px;
      padding: 7px 9px;
      cursor: pointer;
      font-family: inherit;
    }

    .kpi-fxbar .fx-menu .fx-mi:hover {
      background: #f2f7fd;
    }

    .kpi-fxbar .fx-menu .fx-mi-t code {
      font-size: 12.5px;
      color: var(--ks-primary);
      font-weight: 700;
      background: #eef4fc;
      border: 1px solid #d9e6f8;
      border-radius: 5px;
      padding: 1px 6px;
    }

    .kpi-fxbar .fx-menu .fx-mi-d {
      display: block;
      font-size: 12px;
      color: var(--ks-muted);
      margin-top: 3px;
    }

    .kpi-xls-wrap {
      overflow: auto;
      max-height: calc(100vh - 340px);
      border: 1px solid var(--ks-border);
      border-radius: var(--r-card);
      background: #fff;
    }

    table.kpi-xls {
      border-collapse: collapse;
      width: 100%;
      min-width: 980px;
      font-size: 13px;
    }

    .kpi-xls th,
    .kpi-xls td {
      border: 1px solid #e3ebf5;
      padding: 0;
      vertical-align: middle;
    }

    .kpi-xls thead th {
      background: #F2F7FD;
      color: var(--ks-navy);
      font-weight: 700;
      font-size: 12px;
      padding: 7px 8px;
      position: sticky;
      top: 0;
      z-index: 2;
      text-align: left;
      white-space: nowrap;
    }

    .kpi-xls thead tr.xhl th {
      background: #e9f1fb;
      color: var(--ks-muted);
      font-weight: 700;
      text-align: center;
      font-size: 11px;
      padding: 3px 6px;
      top: 0;
      z-index: 3;
    }

    .kpi-xls thead tr:not(.xhl) th {
      top: 23px;
      z-index: 2;
    }

    .kpi-xls td.rownum,
    .kpi-xls th.rownum {
      background: #f7fafd;
      color: var(--ks-muted);
      text-align: center;
      width: 40px;
      min-width: 40px;
      font-weight: 600;
      padding: 0 4px;
      position: sticky;
      left: 0;
      z-index: 1;
    }

    .kpi-xls thead th.rownum {
      z-index: 4;
    }

    .kpi-xls .xcell {
      width: 100%;
      box-sizing: border-box;
      border: none;
      background: transparent;
      padding: 8px 9px;
      font-size: 13px;
      color: var(--ks-text);
      outline: none;
      font-family: inherit;
    }

    .kpi-xls .xcell.xnum {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .kpi-xls .xcell.xhasf {
      color: var(--ks-primary);
      font-weight: 600;
    }

    .kpi-xls .xcell.xerr {
      color: var(--ks-danger);
      font-weight: 700;
    }

    .kpi-xls .xcell:focus {
      background: #eef6ff;
      box-shadow: inset 0 0 0 2px var(--ks-primary);
      border-radius: 3px;
    }

    .kpi-xls td.xro {
      padding: 8px 9px;
      color: var(--ks-muted);
      background: #fafcff;
      white-space: nowrap;
    }

    .kpi-xls td.xstatus {
      padding: 6px 9px;
      white-space: nowrap;
      background: #fff;
    }

    .kpi-xls td.act {
      white-space: nowrap;
      text-align: center;
      width: 80px;
      padding: 0 4px;
    }

    .kpi-xls .xcolname {
      width: 96px;
      border: 1px solid var(--ks-border);
      border-radius: 6px;
      background: #fff;
      padding: 3px 6px;
      font-size: 12px;
      font-weight: 700;
      color: var(--ks-navy);
      font-family: inherit;
    }

    .kpi-xls .xcol-del {
      padding: 2px 4px;
      margin-left: 2px;
    }

    .kpi-xls tr.xtotrow td {
      background: #F2F7FD;
    }

    .kpi-xls tr.xtotrow .xcell {
      font-weight: 800;
      color: var(--ks-navy);
    }

    .kpi-xls td.xtot {
      background: #F2F7FD;
      font-weight: 800;
      color: var(--ks-navy);
    }

    .kpi-xls tr.xparentrow td.xparentcell {
      background: linear-gradient(90deg, #eaf2fe, #f6faff);
      border-bottom: 2px solid var(--ks-primary);
      padding: 10px 12px;
      text-align: left;
      white-space: normal;
    }

    .kpi-xls tr.xparentrow .xparent-ic {
      display: inline-flex;
      vertical-align: middle;
      color: var(--ks-primary);
      margin-right: 6px;
    }

    .kpi-xls tr.xparentrow .xparent-lbl {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--ks-muted);
      margin-right: 6px;
      vertical-align: middle;
    }

    .kpi-xls tr.xparentrow .xparent-name {
      font-size: 14px;
      font-weight: 800;
      color: var(--ks-navy);
      vertical-align: middle;
    }

    .kpi-xls tr.xparentrow .xparent-ph {
      font-weight: 600;
      font-style: italic;
      color: var(--ks-muted);
      font-size: 12.5px;
    }

    .kpi-xls tr.xparentrow .xparent-hint {
      margin-left: 10px;
      font-size: 11px;
      font-weight: 600;
      color: var(--ks-muted);
      white-space: nowrap;
      vertical-align: middle;
    }

    .kpi-xls tr.xparentrow .xparent-hint::before {
      content: "•";
      margin-right: 8px;
      color: #b9c9de;
    }

    .kpi-xls tr.xparentrow .xparent-tot {
      margin-left: 12px;
      font-size: 12.5px;
      color: var(--ks-navy);
      vertical-align: middle;
    }

    .kpi-xls tr.xparentrow .xparent-tot b {
      font-weight: 800;
    }

    .kpi-xls tr.xparentrow .xparent-badge {
      margin-left: 12px;
      vertical-align: middle;
    }

    .kpi-xls tr.xgrp-to>td {
      background: linear-gradient(90deg, #eaf2fe, #f6faff);
      border-top: 2px solid var(--ks-primary);
    }

    .kpi-xls tr.xgrp-to td.rownum {
      background: #e3eefc;
      color: var(--ks-navy);
      font-weight: 800;
    }

    .kpi-xls td.xto-namecell {
      white-space: nowrap;
    }

    .kpi-xls td.xto-namecell .xto-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: .03em;
      color: #fff;
      background: var(--ks-primary);
      border-radius: 5px;
      padding: 2px 6px;
      margin: 0 6px 0 2px;
      vertical-align: middle;
    }

    .kpi-xls td.xto-namecell .xto-input {
      font-weight: 800;
      color: var(--ks-navy);
      width: auto;
      min-width: 180px;
    }

    .kpi-xls td.xnho-namecell {
      padding-left: 2px;
    }

    .kpi-xls td.xnho-namecell .xnho-tick {
      display: inline-block;
      color: #9db4d4;
      padding: 0 2px 0 16px;
      user-select: none;
    }

    .kpi-xls td.xnho-namecell .xcell {
      display: inline-block;
      width: calc(100% - 40px);
    }

    .kpi-xls tr.xgrp-to td.xsumcell {
      font-weight: 800;
      color: var(--ks-navy);
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .kpi-xls-create td.rownum.xdrag {
      cursor: grab;
    }

    .kpi-xls-create td.rownum.xdrag:hover {
      background: #e3eefc;
      color: var(--ks-primary);
    }

    .kpi-xls-create td.rownum.xdrag:active {
      cursor: grabbing;
    }

    .kpi-xls-create tr.xcrow.xdragging {
      opacity: .4;
    }

    .kpi-xls-create tr.xcrow.xdragover>td {
      border-top: 2px solid var(--ks-primary);
    }

    .kpi-xls select.xselcell {
      width: 100%;
      border: none;
      background: transparent;
      padding: 7px 8px;
      font-size: 13px;
      color: var(--ks-text);
      outline: none;
      font-family: inherit;
      cursor: pointer;
    }

    .kpi-xls input.xdatecell {
      width: 100%;
      border: none;
      background: transparent;
      padding: 7px 6px;
      font-size: 12.5px;
      color: var(--ks-text);
      outline: none;
      font-family: inherit;
    }

    .kpi-detail-main {
      min-width: 0;
    }

    .kpi-detail-side {
      background: #fff;
      border: 1px solid var(--ks-border);
      border-radius: var(--r-card);
      padding: 16px;
      box-shadow: 0 1px 2px rgba(16, 42, 77, .04);
      align-self: start;
    }

    .kpi-detail-side h3 {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: var(--ks-navy);
    }

    .kpi-detail-side .kpi-side-row em {
      font-style: normal;
      color: var(--ks-muted);
    }

    .kpi-detail-side .kpi-side-row span {
      font-weight: 600;
      color: var(--ks-text);
      text-align: right;
    }

    .kpi-histrow {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 10px 0;
      border-top: 1px solid #eef2f8;
    }

    .kpi-histrow:first-of-type {
      border-top: none;
    }

    .kpi-histrow .hi-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--ks-primary);
      flex: none;
      margin-top: 6px;
    }

    .kpi-cxhead {
      background: #fff;
      border: 1px solid var(--ks-border);
      border-radius: var(--r-card);
      padding: 16px 18px;
      margin-bottom: 14px;
      box-shadow: 0 1px 2px rgba(16, 42, 77, .04);
    }

    .kpi-cxhead .kpi-form2 {
      margin-bottom: 6px;
    }

    .kpi-cxhead .kpi-form2:last-child {
      margin-bottom: 0;
    }

    .kpi-cxhead .ci {
      width: 100%;
      box-sizing: border-box;
      height: 40px;
      border: 1px solid var(--ks-border);
      border-radius: 8px;
      padding: 0 12px;
      font-size: 14px;
      background: #fff;
      color: var(--ks-text);
      font-family: inherit;
    }

    .kpi-cxhead .kpi-select {
      height: 40px;
      box-sizing: border-box;
    }

    .kpi-cxhead .ci:disabled,
    .kpi-cxhead .kpi-select:disabled {
      background: #f6f9fd;
      color: var(--ks-text);
      -webkit-text-fill-color: var(--ks-text);
      opacity: 1;
      cursor: default;
      border-color: #e3ebf5;
    }

    .kpi-cx-foot {
      position: sticky;
      bottom: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      margin: 18px calc(-1 * var(--gutter)) -40px;
      padding: 13px var(--gutter);
      background: #fff;
      border-top: 1px solid var(--ks-border);
      box-shadow: 0 -6px 18px rgba(16, 42, 77, .10);
    }

    .kpi-cx-foot .spacer {
      flex: 1;
    }

    /* Footer Hủy/Lưu luôn nằm cuối trang (kể cả khi nội dung ngắn) */
    #kpiRoot.kpi-root-fill {
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100%;
    }

    #kpiRoot.kpi-root-fill>.kpi-cx-screen {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
    }

    #kpiRoot.kpi-root-fill>.kpi-cx-screen>.kpi-cx-foot {
      margin-top: auto;
    }

    .kpi-resultstrip {
      display: flex;
      flex-wrap: wrap;
      gap: 14px 26px;
      background: #fff;
      border: 1px solid var(--ks-border);
      border-radius: var(--r-card);
      padding: 14px 18px;
      margin-bottom: 14px;
      box-shadow: 0 1px 2px rgba(16, 42, 77, .04);
    }

    .kpi-resultstrip .rs-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 96px;
    }

    .kpi-resultstrip .rs-item em {
      font-style: normal;
      font-size: 12px;
      color: var(--ks-muted);
      font-weight: 600;
    }

    .kpi-resultstrip .rs-item>span {
      font-size: 15px;
      font-weight: 700;
      color: var(--ks-navy);
    }

    .kpi-cx-fxrow {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }

    .kpi-cx-fxrow .kpi-fxbar {
      flex: 1;
      margin-bottom: 0;
    }

    .kpi-cx-fxrow .btn {
      flex: none;
      white-space: nowrap;
    }

    .kpi-xls th.xgrip,
    .kpi-xls td.xgrip {
      width: 30px;
      min-width: 30px;
      text-align: center;
      background: #f7fafd;
      padding: 0;
    }

    .kpi-xls td.xgrip {
      cursor: grab;
      color: var(--ks-muted);
    }

    .kpi-xls td.xgrip:active {
      cursor: grabbing;
    }

    .kpi-xls .grip-dots {
      font-size: 12px;
      letter-spacing: -2px;
      line-height: 1;
      user-select: none;
    }

    .kpi-xls tr.xrow.xdragging {
      opacity: .45;
    }

    .kpi-xls tr.xrow.xdragover td {
      border-top: 2px solid var(--ks-primary);
    }

    .kpi-xls tr.xaddrow td {
      background: #fbfdff;
      padding: 0;
    }

    .kpi-xls .xadd-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      border: none;
      background: transparent;
      padding: 9px 10px;
      font-size: 13px;
      font-weight: 600;
      color: var(--ks-primary);
      cursor: pointer;
      font-family: inherit;
    }

    .kpi-xls .xadd-btn:hover {
      background: #eef6ff;
    }

    @media(max-width:1024px) {
      .op-tablewrap {
        max-height: none;
      }
    }

    @media(max-width:768px) {
      .op-screen {
        padding: 16px 16px 32px;
      }

      .op-desktop {
        display: none;
      }

      .op-cards {
        display: flex;
      }

      .op-head h1 {
        font-size: 22px;
      }
    }

    /* ===== DỰ ÁN CÔNG VIỆC — bộ chọn (switcher), chip, modal tạo dự án (additive) ===== */
    .ph-left {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      min-width: 0;
    }

    .proj-switch {
      display: flex;
      align-items: center;
    }

    .proj-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 38px;
      padding: 0 10px;
      border: 1px solid #e1e8f2;
      background: #fff;
      border-radius: 10px;
      cursor: pointer;
      color: var(--ks-navy);
      font-weight: 600;
      font-size: 14px;
      max-width: 380px;
      transition: border-color .15s, box-shadow .15s;
    }

    .proj-btn:hover {
      border-color: var(--ks-primary);
      box-shadow: 0 2px 10px rgba(24, 43, 87, .08);
    }

    .proj-btn .pb-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 260px;
    }

    .proj-btn .pb-cnt {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--ks-muted);
      background: #eef1f6;
      border-radius: 999px;
      padding: 1px 8px;
    }

    .proj-btn>svg {
      color: var(--ks-muted);
      flex: none;
    }

    .proj-pop {
      min-width: 300px;
      max-width: 360px;
    }

    .proj-pop .proj-list {
      max-height: 330px;
      overflow: auto;
      margin: 2px 0;
    }

    .proj-row {
      position: relative;
      display: flex;
      align-items: center;
      border-radius: 8px;
      padding-right: 34px;
    }

    .proj-row:hover {
      background: #f2f6fc;
    }

    .proj-row.active {
      background: var(--ks-menu-selected);
    }

    .proj-opt {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border: none;
      background: transparent;
      border-radius: 8px;
      text-align: left;
      cursor: pointer;
    }

    .proj-opt .po-name {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--ks-navy);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      min-width: 0;
    }

    .proj-opt .po-cnt {
      font-size: 11px;
      font-weight: 700;
      color: var(--ks-muted);
      background: #eef1f6;
      border-radius: 999px;
      padding: 1px 7px;
      flex: none;
    }

    .proj-opt .po-ck {
      color: var(--ks-primary);
      opacity: 0;
      flex: none;
      display: inline-flex;
    }

    .proj-row.active .po-ck {
      opacity: 1;
    }

    .proj-row .proj-edit {
      position: absolute;
      right: 5px;
      top: 50%;
      transform: translateY(-50%);
      width: 26px;
      min-width: 26px;
      height: 26px;
      padding: 0;
      border-radius: 7px;
      border: 1px solid #e1e8f2;
      background: #fff;
      color: var(--ks-muted);
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(24, 43, 87, .12);
    }

    .proj-row:hover .proj-edit {
      display: inline-flex;
    }

    .proj-row .proj-edit:hover {
      color: var(--ks-primary);
      border-color: var(--ks-primary);
    }

    .proj-new {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 10px;
      border: none;
      background: transparent;
      border-radius: 8px;
      color: var(--ks-primary);
      font-weight: 700;
      font-size: 13.5px;
      cursor: pointer;
    }

    .proj-new:hover {
      background: #eef5ff;
    }

    .proj-chip {
      display: inline-flex;
      align-items: center;
      max-width: 100%;
      font-size: 12px;
      font-weight: 600;
      color: var(--ks-navy);
      background: #eef1f6;
      border: 1px solid #e1e8f2;
      border-radius: 999px;
      padding: 2px 10px;
      line-height: 1.3;
      vertical-align: middle;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .proj-chip.sm {
      font-size: 11px;
      padding: 1px 9px;
    }

    .t-proj {
      margin-top: 5px;
    }

    .np-body {
      padding: 6px 20px 4px;
    }

    .np-field {
      margin-bottom: 14px;
    }

    .np-field.half {
      width: calc(50% - 8px);
    }

    /* Tags input (Nhãn / Trạng thái) — nhập kiểu chip giống tags-input */
    .tagin {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      min-height: 42px;
      padding: 6px 8px;
      border: 1px solid #dbe3ee;
      border-radius: 9px;
      background: #fff;
      cursor: text;
    }

    .tagin:focus-within {
      border-color: var(--ks-primary);
      box-shadow: 0 0 0 3px rgba(21, 101, 192, .12);
    }

    .tagin-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #eef1f6;
      border: 1px solid #e1e8f2;
      color: var(--ks-navy);
      font-size: 13px;
      font-weight: 500;
      border-radius: 7px;
      padding: 3px 5px 3px 9px;
    }

    .tagin-x {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      color: var(--ks-muted);
      cursor: pointer;
      padding: 1px;
      border-radius: 4px;
      line-height: 0;
    }

    .tagin-x:hover {
      color: var(--ks-danger);
      background: #fff;
    }

    .tagin-inp {
      flex: 1;
      min-width: 140px;
      border: none;
      outline: none;
      background: transparent;
      font-size: 14px;
      color: var(--ks-text);
      height: 28px;
    }

    @media(max-width:768px) {
      .proj-btn {
        max-width: 100%;
      }

      .proj-btn .pb-name {
        max-width: 150px;
      }

      .np-field.half {
        width: 100%;
      }
    }

    /* ===== QUẢN LÝ TÀI LIỆU (Document manager) — additive, scope .doc-screen ===== */
    .doc-screen {
      padding: 20px var(--gutter) 48px;
      min-width: 1040px;
    }

    .doc-head {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .doc-head h1 {
      font-size: 32px;
      line-height: 40px;
      font-weight: 700;
      color: var(--ks-navy);
      margin: 0;
    }

    .doc-head .dh-spacer {
      flex: 1;
    }

    .doc-storage {
      min-width: 230px;
      background: #fff;
      border: 1px solid #e6eefb;
      border-radius: 12px;
      padding: 10px 14px;
    }

    .doc-storage .ds-top {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
      color: var(--ks-navy);
      font-weight: 700;
      margin-bottom: 7px;
    }

    .doc-storage .ds-top svg {
      color: var(--ks-muted);
    }

    .doc-storage .ds-bar {
      height: 7px;
      border-radius: 999px;
      background: #eef1f6;
      overflow: hidden;
    }

    .doc-storage .ds-bar i {
      display: block;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #2f6bff, #16a34a);
    }

    .doc-storage .ds-sub {
      font-size: 11.5px;
      color: var(--ks-muted);
      margin-top: 6px;
    }

    .doc-banner {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: #eef6ff;
      border: 1px solid #cfe2ff;
      color: #1f4e9b;
      border-radius: 11px;
      padding: 10px 14px;
      font-size: 13px;
      line-height: 1.55;
      margin-bottom: 16px;
    }

    .doc-banner svg {
      flex: none;
      margin-top: 1px;
      color: #2f6bff;
    }

    .doc-tabs {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid #e6eefb;
      margin-bottom: 14px;
    }

    .doc-tab {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 14px;
      border: none;
      background: transparent;
      border-bottom: 2px solid transparent;
      color: var(--ks-muted);
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      margin-bottom: -1px;
    }

    .doc-tab .dt-cnt {
      font-size: 11px;
      font-weight: 700;
      background: #eef1f6;
      border-radius: 999px;
      padding: 1px 7px;
      color: var(--ks-muted);
    }

    .doc-tab.active {
      color: var(--ks-primary);
      border-bottom-color: var(--ks-primary);
    }

    .doc-tab.active .dt-cnt {
      background: #e4edff;
      color: var(--ks-primary);
    }

    .doc-toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .doc-bc {
      display: flex;
      align-items: center;
      gap: 3px;
      flex-wrap: wrap;
      min-width: 0;
    }

    .doc-bc button {
      border: none;
      background: transparent;
      color: var(--ks-muted);
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      padding: 4px 7px;
      border-radius: 7px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .doc-bc button:hover {
      background: #f2f6fc;
      color: var(--ks-navy);
    }

    .doc-bc .cur {
      color: var(--ks-navy);
      font-weight: 700;
      pointer-events: none;
    }

    .doc-bc .sep {
      color: #c3ccd8;
    }

    .doc-tb-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .doc-search {
      position: relative;
    }

    .doc-search input {
      height: 40px;
      border: 1px solid #dbe3ee;
      border-radius: 10px;
      padding: 0 12px 0 38px;
      font-size: 14px;
      width: 240px;
      background: #fff;
    }

    .doc-search input:focus {
      border-color: var(--ks-primary);
      outline: none;
      box-shadow: 0 0 0 3px rgba(21, 101, 192, .12);
    }

    .doc-search .s-ic {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--ks-muted);
      display: inline-flex;
    }

    .doc-vtoggle {
      display: inline-flex;
      border: 1px solid #dbe3ee;
      border-radius: 9px;
      overflow: hidden;
    }

    .doc-vtoggle button {
      border: none;
      background: #fff;
      padding: 8px 10px;
      color: var(--ks-muted);
      cursor: pointer;
      display: inline-flex;
    }

    .doc-vtoggle button.on {
      background: var(--ks-primary);
      color: #fff;
    }

    .doc-sec-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--ks-muted);
      text-transform: uppercase;
      letter-spacing: .4px;
      margin: 16px 0 9px;
    }

    .doc-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(212px, 1fr));
      gap: 12px;
    }

    .doc-card {
      position: relative;
      background: #fff;
      border: 1px solid #e6eefb;
      border-radius: 12px;
      padding: 14px;
      cursor: pointer;
      transition: border-color .15s, box-shadow .15s;
    }

    .doc-card:hover {
      border-color: #bcd2f7;
      box-shadow: 0 4px 16px rgba(24, 43, 87, .08);
    }

    .doc-ic {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
    }

    .doc-card .dc-name {
      font-weight: 600;
      color: var(--ks-navy);
      font-size: 14px;
      line-height: 1.35;
      word-break: break-word;
      margin-bottom: 7px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 38px;
    }

    .doc-card .dc-meta {
      font-size: 12px;
      color: var(--ks-muted);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .doc-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      color: #1f7a44;
      background: #e7f7ee;
      border: 1px solid #c7ecd6;
      border-radius: 999px;
      padding: 1px 7px;
    }

    .doc-dots {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--ks-muted);
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .doc-card:hover .doc-dots {
      display: inline-flex;
    }

    .doc-dots:hover {
      background: #e7eef9;
      color: var(--ks-navy);
    }

    .doc-list {
      background: #fff;
      border: 1px solid #e6eefb;
      border-radius: 12px;
      overflow: hidden;
    }

    .doc-lrow {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      border-bottom: 1px solid #f0f3f8;
      cursor: pointer;
    }

    .doc-lrow:last-child {
      border-bottom: none;
    }

    .doc-lrow:hover {
      background: #f8fbff;
    }

    .doc-lrow .dl-ic {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: none;
    }

    .doc-lrow .dl-name {
      font-weight: 600;
      color: var(--ks-navy);
      font-size: 14px;
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .doc-lrow .dl-col {
      font-size: 12.5px;
      color: var(--ks-muted);
      width: 160px;
      flex: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .doc-lrow .dl-col.sz {
      width: 90px;
    }

    .doc-lrow .dl-col.act {
      width: 40px;
      display: flex;
      justify-content: flex-end;
    }

    .doc-empty {
      background: #fff;
      border: 1px dashed #d4ddea;
      border-radius: 14px;
      padding: 46px 20px;
      text-align: center;
      color: var(--ks-muted);
    }

    .doc-empty .de-ic {
      width: 60px;
      height: 60px;
      border-radius: 16px;
      background: #f0f4fb;
      color: #9bb0cf;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
    }

    .doc-empty h3 {
      margin: 0 0 6px;
      color: var(--ks-navy);
      font-size: 17px;
    }

    .doc-empty p {
      margin: 0 0 14px;
      font-size: 13.5px;
    }

    .doc-area.drop {
      outline: 2px dashed var(--ks-primary);
      outline-offset: 4px;
      border-radius: 14px;
      background: #f5f9ff;
    }

    .doc-aud-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .doc-aud {
      display: flex;
      align-items: center;
      gap: 11px;
      width: 100%;
      text-align: left;
      background: #fff;
      border: 1.5px solid #e6eefb;
      border-radius: 11px;
      padding: 11px 13px;
      cursor: pointer;
    }

    .doc-aud:hover {
      border-color: #bcd2f7;
      background: #f8fbff;
    }

    .doc-aud.on {
      border-color: var(--ks-primary);
      background: #f3f8ff;
    }

    .doc-aud .da-ic {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: #eef3ff;
      color: var(--ks-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: none;
    }

    .doc-aud .da-tx {
      flex: 1;
      min-width: 0;
    }

    .doc-aud .da-tx b {
      display: block;
      font-size: 13.5px;
      color: var(--ks-navy);
      font-weight: 600;
    }

    .doc-aud .da-tx span {
      font-size: 11.5px;
      color: var(--ks-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
    }

    .doc-aud .da-rd {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid #cdd7e6;
      flex: none;
      position: relative;
    }

    .doc-aud.on .da-rd {
      border-color: var(--ks-primary);
    }

    .doc-aud.on .da-rd:after {
      content: "";
      position: absolute;
      inset: 3px;
      border-radius: 50%;
      background: var(--ks-primary);
    }

    .doc-share-list {
      max-height: 220px;
      overflow: auto;
      margin: 4px 0 2px;
      border: 1px solid #eef2f8;
      border-radius: 10px;
    }

    .doc-share-opt {
      width: 100%;
      text-align: left;
      background: #fff;
      border: none;
      border-bottom: 1px solid #f3f6fb;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      cursor: pointer;
    }

    .doc-share-opt:last-child {
      border-bottom: none;
    }

    .doc-share-opt:hover {
      background: #f6f9fe;
    }

    .doc-share-opt .dso-cb {
      width: 18px;
      height: 18px;
      border-radius: 5px;
      border: 2px solid #cdd7e6;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      flex: none;
    }

    .doc-share-opt.on .dso-cb {
      background: var(--ks-primary);
      border-color: var(--ks-primary);
    }

    .doc-share-opt .dso-nm b {
      display: block;
      font-size: 13.5px;
      color: var(--ks-navy);
      font-weight: 600;
    }

    .doc-share-opt .dso-nm span {
      font-size: 11.5px;
      color: var(--ks-muted);
    }

    .doc-ava {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: none;
    }

    /* Xem trước (view mode) */
    .docpv-ov {
      position: fixed;
      inset: 0;
      z-index: 120;
      background: rgba(15, 23, 42, .55);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
    }

    .docpv-panel {
      background: #fff;
      border-radius: 16px;
      width: min(1000px, 96vw);
      height: min(88vh, 920px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .3);
    }

    .docpv-head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 16px;
      border-bottom: 1px solid #eef2f8;
    }

    .docpv-head .doc-ic {
      width: 40px;
      height: 40px;
    }

    .docpv-tt {
      min-width: 0;
    }

    .docpv-tt b {
      display: block;
      font-size: 15px;
      color: var(--ks-navy);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .docpv-tt span {
      font-size: 12px;
      color: var(--ks-muted);
    }

    .docpv-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .docpv-x {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      border: 1px solid #e1e8f2;
      background: #fff;
      color: var(--ks-muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .docpv-x:hover {
      color: var(--ks-navy);
      border-color: #c9d6ea;
    }

    .docpv-body {
      flex: 1;
      min-height: 0;
      overflow: auto;
      background: #f1f4f9;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 22px;
    }

    .docpv-body img {
      max-width: 100%;
      border-radius: 8px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, .18);
    }

    .docpv-body iframe {
      width: 100%;
      height: 100%;
      min-height: 62vh;
      border: 0;
      background: #fff;
      border-radius: 8px;
    }

    .docpv-page {
      width: min(720px, 100%);
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 6px 24px rgba(24, 43, 87, .12);
      padding: 40px 48px;
      align-self: flex-start;
    }

    .docpv-page h2 {
      margin: 0 0 6px;
      color: var(--ks-navy);
      font-size: 22px;
      word-break: break-word;
    }

    .docpv-page .pg-sub {
      color: var(--ks-muted);
      font-size: 13px;
      margin-bottom: 22px;
    }

    .docpv-line {
      height: 12px;
      border-radius: 6px;
      background: #eef1f6;
      margin: 10px 0;
    }

    .docpv-imgph {
      width: min(640px, 100%);
      aspect-ratio: 4/3;
      border-radius: 12px;
      background: linear-gradient(135deg, #e9eefb, #f3e8ff);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #9aa6bd;
      box-shadow: 0 6px 24px rgba(24, 43, 87, .12);
    }

    .docpv-grid {
      width: min(720px, 100%);
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 6px 24px rgba(24, 43, 87, .12);
      overflow: hidden;
      align-self: flex-start;
    }

    .docpv-grid .gr {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
    }

    .docpv-grid .gc {
      border: 1px solid #eef1f6;
      padding: 9px 10px;
      font-size: 12px;
      color: #64748b;
    }

    .docpv-note {
      margin-top: 14px;
      font-size: 12.5px;
      color: var(--ks-muted);
      text-align: center;
    }

    @media(max-width:860px) {
      .doc-screen {
        min-width: 0;
      }

      .doc-lrow .dl-col {
        display: none;
      }

      .doc-lrow .dl-col.act {
        display: flex;
      }

      .doc-search input {
        width: 160px;
      }
    }

    /* ===== QUẢN LÝ KHO (Xuất–Nhập–Tồn) — additive, mobile-first, scope .inv-screen ===== */
    .inv-screen {
      padding: 20px var(--gutter) 40px;
      max-width: none;
      width: 100%;
    }

    /* Bộ chọn kho (kiểu switcher dự án) — đặt cạnh tiêu đề "Quản lý kho" */
    .inv-switch .proj-btn .pb-ic {
      display: inline-flex;
      color: var(--ks-primary);
    }

    .ii-wh {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--ks-primary);
      background: var(--ks-hover-blue);
      border-radius: 999px;
      padding: 2px 9px;
      margin-right: 6px;
    }

    .inv-head {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .inv-head h1 {
      font-size: 30px;
      line-height: 38px;
      font-weight: 700;
      color: var(--ks-navy);
      margin: 0;
    }

    .inv-head .ih-sp {
      flex: 1;
    }

    .inv-kpis {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    .inv-kcard {
      background: #fff;
      border: 1px solid #e6eefb;
      border-radius: 14px;
      padding: 13px 15px;
      cursor: pointer;
      transition: border-color .15s, box-shadow .15s;
    }

    .inv-kcard:hover {
      border-color: #bcd2f7;
      box-shadow: 0 4px 14px rgba(24, 43, 87, .07);
    }

    .inv-kcard.on {
      border-color: var(--ks-primary);
      box-shadow: 0 0 0 2px rgba(21, 101, 192, .14);
    }

    .inv-kcard .kk-l {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12.5px;
      color: var(--ks-muted);
      font-weight: 600;
    }

    .inv-kcard .kk-v {
      font-size: 26px;
      font-weight: 800;
      color: var(--ks-navy);
      margin-top: 4px;
      line-height: 1.1;
    }

    .inv-kcard .kk-v.t-warn {
      color: #D97706;
    }

    .inv-kcard .kk-v.t-danger {
      color: var(--ks-danger);
    }

    .inv-kcard .kk-v.t-ok {
      color: #16A34A;
    }

    .inv-tabs {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid #e6eefb;
      margin-bottom: 14px;
    }

    .inv-tab {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 14px;
      border: none;
      background: transparent;
      border-bottom: 2px solid transparent;
      color: var(--ks-muted);
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      margin-bottom: -1px;
    }

    .inv-tab .it-cnt {
      font-size: 11px;
      font-weight: 700;
      background: #eef1f6;
      border-radius: 999px;
      padding: 1px 7px;
      color: var(--ks-muted);
    }

    .inv-tab.active {
      color: var(--ks-primary);
      border-bottom-color: var(--ks-primary);
    }

    .inv-tab.active .it-cnt {
      background: #e4edff;
      color: var(--ks-primary);
    }

    .inv-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .inv-search {
      position: relative;
      flex: 1;
      min-width: 180px;
    }

    .inv-search input {
      width: 100%;
      height: 42px;
      border: 1px solid #dbe3ee;
      border-radius: 11px;
      padding: 0 12px 0 40px;
      font-size: 15px;
      background: #fff;
    }

    .inv-search input:focus {
      border-color: var(--ks-primary);
      outline: none;
      box-shadow: 0 0 0 3px rgba(21, 101, 192, .12);
    }

    .inv-search .s-ic {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--ks-muted);
      display: inline-flex;
    }

    .inv-sel {
      height: 42px;
      border: 1px solid #dbe3ee;
      border-radius: 11px;
      padding: 0 34px 0 12px;
      font-size: 14px;
      background: #fff;
      color: var(--ks-navy);
      appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>");
      background-repeat: no-repeat;
      background-position: right 11px center;
    }

    .inv-acts {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-in {
      background: #16A34A;
      color: #fff;
      border: 1px solid #16A34A;
    }

    .btn-in:hover {
      background: #15913f;
    }

    .btn-out {
      background: #fff;
      color: #D97706;
      border: 1px solid #f0c98a;
    }

    .btn-out:hover {
      background: #fff7ec;
    }

    .inv-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .inv-item {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #fff;
      border: 1px solid #e6eefb;
      border-radius: 14px;
      padding: 12px 14px;
      flex-wrap: wrap;
    }

    .inv-item .ii-main {
      flex: 1;
      min-width: 150px;
    }

    .inv-item .ii-name {
      font-weight: 700;
      color: var(--ks-navy);
      font-size: 15px;
    }

    .inv-item .ii-name .ii-code {
      font-weight: 600;
      color: var(--ks-muted);
      font-size: 12px;
      margin-left: 6px;
    }

    .inv-item .ii-sub {
      font-size: 12.5px;
      color: var(--ks-muted);
      margin-top: 3px;
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
    }

    .inv-cat {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      color: #3730a3;
      background: #eef0ff;
      border: 1px solid #dfe2fb;
      border-radius: 999px;
      padding: 1px 8px;
    }

    .inv-item .ii-stock {
      text-align: right;
      min-width: 74px;
    }

    .inv-item .ii-num {
      font-size: 22px;
      font-weight: 800;
      color: var(--ks-navy);
      line-height: 1;
    }

    .inv-item .ii-num.t-warn {
      color: #D97706;
    }

    .inv-item .ii-num.t-danger {
      color: var(--ks-danger);
    }

    .inv-item .ii-stock span {
      display: block;
      font-size: 11px;
      color: var(--ks-muted);
      margin-top: 2px;
    }

    .inv-stt {
      font-size: 11.5px;
      font-weight: 700;
      border-radius: 999px;
      padding: 3px 9px;
      white-space: nowrap;
    }

    .inv-stt.ok {
      background: #e7f7ee;
      color: #1f7a44;
      border: 1px solid #c7ecd6;
    }

    .inv-stt.warn {
      background: #fff4e5;
      color: #b45309;
      border: 1px solid #f3dca8;
    }

    .inv-stt.out {
      background: #fdecef;
      color: #c02a42;
      border: 1px solid #f6c9d2;
    }

    .inv-item .ii-act {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .inv-qbtn {
      height: 34px;
      padding: 0 10px;
      border-radius: 9px;
      border: 1px solid #e1e8f2;
      background: #fff;
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }

    .inv-qbtn.in {
      color: #16A34A;
      border-color: #bfe6cc;
    }

    .inv-qbtn.in:hover {
      background: #eefbf2;
    }

    .inv-qbtn.out {
      color: #D97706;
      border-color: #f0d49a;
    }

    .inv-qbtn.out:hover {
      background: #fff7ec;
    }

    .inv-dots {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      border: 1px solid #e1e8f2;
      background: #fff;
      color: var(--ks-muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .inv-dots:hover {
      color: var(--ks-navy);
      border-color: #c9d6ea;
    }

    /* history */
    .inv-txn {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      background: #fff;
      border: 1px solid #e6eefb;
      border-radius: 14px;
      padding: 12px 14px;
    }

    .inv-txn .tx-ic {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: none;
    }

    .inv-txn .tx-ic.in {
      background: #e7f7ee;
      color: #16A34A;
    }

    .inv-txn .tx-ic.out {
      background: #fff4e5;
      color: #D97706;
    }

    .inv-txn .tx-body {
      flex: 1;
      min-width: 0;
    }

    .inv-txn .tx-top {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .inv-txn .tx-code {
      font-weight: 700;
      color: var(--ks-navy);
      font-size: 14px;
    }

    .inv-txn .tx-badge {
      font-size: 11px;
      font-weight: 700;
      border-radius: 999px;
      padding: 1px 8px;
    }

    .inv-txn .tx-badge.in {
      background: #e7f7ee;
      color: #1f7a44;
    }

    .inv-txn .tx-badge.out {
      background: #fff4e5;
      color: #b45309;
    }

    .inv-txn .tx-meta {
      font-size: 12px;
      color: var(--ks-muted);
      margin-top: 2px;
    }

    .inv-txn .tx-lines {
      font-size: 13px;
      color: var(--ks-text);
      margin-top: 6px;
      line-height: 1.5;
    }

    .inv-txn .tx-qty {
      text-align: right;
      font-weight: 800;
      color: var(--ks-navy);
      font-size: 16px;
      white-space: nowrap;
    }

    .inv-empty {
      background: #fff;
      border: 1px dashed #d4ddea;
      border-radius: 14px;
      padding: 44px 20px;
      text-align: center;
      color: var(--ks-muted);
    }

    .inv-empty .ie-ic {
      width: 58px;
      height: 58px;
      border-radius: 16px;
      background: #f0f4fb;
      color: #9bb0cf;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }

    .inv-empty h3 {
      margin: 0 0 6px;
      color: var(--ks-navy);
      font-size: 17px;
    }

    /* stepper (quick qty) */
    .inv-step {
      display: flex;
      align-items: stretch;
      gap: 0;
      border: 1px solid #dbe3ee;
      border-radius: 12px;
      overflow: hidden;
      max-width: 220px;
    }

    .inv-step button {
      width: 52px;
      border: none;
      background: #f2f6fc;
      color: var(--ks-navy);
      font-size: 22px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .inv-step button:hover {
      background: #e7eef9;
    }

    .inv-step input {
      flex: 1;
      min-width: 0;
      border: none;
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      color: var(--ks-navy);
      outline: none;
    }

    .inv-line {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }

    .inv-line select {
      flex: 1;
      min-width: 0;
    }

    .inv-line input {
      width: 92px;
    }

    .inv-line .ln-del {
      flex: none;
    }

    .inv-qmeta {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #f6f9fe;
      border: 1px solid #e6eefb;
      border-radius: 11px;
      padding: 10px 12px;
      margin-bottom: 14px;
    }

    .inv-qmeta .qm-ic {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: none;
    }

    .inv-qmeta b {
      display: block;
      color: var(--ks-navy);
      font-size: 15px;
    }

    .inv-qmeta span {
      font-size: 12.5px;
      color: var(--ks-muted);
    }

    @media(max-width:720px) {
      .inv-kpis {
        grid-template-columns: repeat(2, 1fr);
      }

      .inv-head h1 {
        font-size: 24px;
      }

      .inv-item {
        gap: 10px;
      }

      .inv-item .ii-main {
        flex: 1 1 100%;
      }

      .inv-item .ii-stock {
        min-width: 0;
        text-align: left;
        display: flex;
        align-items: baseline;
        gap: 6px;
      }

      .inv-item .ii-stock span {
        margin-top: 0;
      }

      .inv-item .ii-act {
        margin-left: auto;
      }

      .inv-acts .btn {
        flex: 1;
        justify-content: center;
      }

      .inv-acts {
        width: 100%;
      }
    }

    /* =========================================================================
   RESPONSIVE APP SHELL (mobile) — additive, chỉ áp dụng ≤860px.
   Biến rail + sidemenu thành ngăn kéo trượt (off-canvas), nội dung full width.
   ========================================================================= */
    .nav-ham {
      display: none;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      margin: 0 2px 0 8px;
      border: none;
      background: transparent;
      color: var(--ks-navy);
      border-radius: 10px;
      flex: none;
    }

    .nav-ham:hover {
      background: #eef4fc;
    }

    .nav-scrim {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 32, 60, .42);
      z-index: 40;
      opacity: 0;
      transition: opacity .22s;
    }

    @media(max-width:860px) {
      .layout {
        min-width: 0;
        grid-template-columns: 1fr;
        grid-template-rows: var(--topbar-h) 1fr;
      }

      .nav-ham {
        display: inline-flex;
      }

      .topbar .brand {
        width: auto;
        flex: 1;
        min-width: 0;
      }

      .topbar .brand .brand-name {
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .topbar .top-right {
        gap: 4px;
        padding-right: 8px;
      }

      .topbar #schoolSel,
      .topbar #yearSel {
        display: none;
      }

      .top-user .who {
        display: none;
      }

      .rail {
        position: fixed;
        top: var(--topbar-h);
        left: 0;
        bottom: 0;
        width: var(--rail-w);
        z-index: 60;
        transform: translateX(-100%);
        transition: transform .24s ease;
        box-shadow: 2px 0 14px rgba(15, 32, 60, .12);
      }

      .sidemenu {
        position: fixed;
        top: var(--topbar-h);
        left: var(--rail-w);
        bottom: 0;
        width: min(76vw, 300px);
        z-index: 59;
        transform: translateX(calc(-100% - var(--rail-w)));
        transition: transform .24s ease;
        box-shadow: 6px 0 18px rgba(15, 32, 60, .12);
      }

      body.nav-open .rail {
        transform: translateX(0);
      }

      body.nav-open .sidemenu {
        transform: translateX(0);
      }

      body.nav-open .nav-scrim {
        display: block;
        opacity: 1;
      }

      .content {
        grid-column: 1;
        grid-row: 2;
      }

      .content-inner {
        min-width: 0;
        padding: 16px 14px 40px;
      }

      .page-title {
        font-size: 24px;
        line-height: 32px;
      }

      .inv-screen,
      .doc-screen {
        min-width: 0;
      }

      .inv-head {
        gap: 8px;
      }

      .inv-switch {
        width: 100%;
      }

      .inv-switch .proj-btn {
        width: 100%;
        max-width: none;
      }
    }

    @media(max-width:860px) {
      .inv-kpis {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>
  <div class="layout">
    <!-- ============ TOP BAR ============ -->
    <header class="topbar">
      <button class="nav-ham" id="navHam" aria-label="Mở menu điều hướng" aria-expanded="false"><svg viewBox="0 0 24 24"
          width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M4 6h16" />
          <path d="M4 12h16" />
          <path d="M4 18h16" />
        </svg></button>
      <div class="logo-box" aria-hidden="true" id="railLogo"></div>
      <div class="brand">
        <div class="brand-mark">K</div>
        <div class="brand-name">KSmart iEdu</div>
      </div>
      <div class="top-right">
        <button class="top-select" id="schoolSel"><span id="ic-home1"></span>Tất cả các trường<span
            id="ic-cd1"></span></button>
        <button class="top-select" id="yearSel"><span id="ic-cal1"></span>2026 - 2027<span id="ic-cd2"></span></button>
        <button class="top-user" id="roleBtn" aria-haspopup="true">
          <span class="ava" id="topAva">SA</span>
          <span class="who"><b id="topName">Super Admin</b><span id="topRole">Quản trị hệ thống</span></span>
          <span id="ic-cd3"></span>
        </button>
      </div>
    </header>

    <!-- ============ UTILITY RAIL ============ -->
    <nav class="rail" aria-label="Điều hướng chính">
      <button class="rail-item" data-tip="Trang chủ"><span id="ic-r-home"></span><span>Trang chủ</span></button>
      <button class="rail-item" data-tip="Lớp học"><span id="ic-r-mon"></span><span>Lớp học</span></button>
      <button class="rail-item" data-tip="Trường học"><span id="ic-r-bld"></span><span>Trường</span></button>
      <button class="rail-item active" data-tip="Công việc"><span id="ic-r-task"></span><span>Công việc</span></button>
      <button class="rail-item" data-tip="Quản trị"><span id="ic-r-cog"></span><span>Quản trị</span></button>
      <div class="rail-spacer"></div>
      <button class="icon-btn plain" data-tip="Thu gọn"><span id="ic-r-menu"></span></button>
    </nav>

    <!-- ============ SECONDARY MENU ============ -->
    <aside class="sidemenu">
      <div class="sm-head">
        <div class="sm-sub">Trường học thông minh</div>
      </div>
      <div class="sm-scroll scroll" id="sideMenu"></div>
      <div class="sm-foot"><button id="collapseMenu"><span id="ic-chevleft"></span>Thu gọn menu</button></div>
    </aside>
    <div class="nav-scrim" id="navScrim" aria-hidden="true"></div>

    <!-- ============ CONTENT ============ -->
    <main class="content scroll">
      <div class="content-inner">
        <div class="page-head">
          <div class="ph-left">
            <h1 class="page-title" id="pageTitle">Công việc</h1>
            <div id="projectSwitch" class="proj-switch"></div>
          </div>
          <div class="page-actions" id="pageActions"></div>
        </div>

        <div class="scope-row" id="scopeRow"></div>

        <div class="table-card">
          <div class="table-toolbar">
            <div class="search-box">
              <span class="s-icon" id="ic-search"></span>
              <input type="text" id="searchInput" placeholder="Tìm mã hoặc tên công việc"
                aria-label="Tìm mã hoặc tên công việc" />
            </div>
            <div class="toolbar-right">
              <button class="filter-btn" id="filterBtn"><span id="ic-filter"></span>Bộ lọc<span class="fcount hidden"
                  id="filterCount">0</span></button>
              <button class="cog-btn" id="colsBtn" data-tip="Tùy chỉnh cột" aria-label="Tùy chỉnh cột"><span
                  id="ic-sliders"></span></button>
            </div>
          </div>
          <div class="active-filters" id="activeFilters"></div>
          <div class="table-wrap scroll" id="tableWrap"></div>
          <div class="pager" id="pager"></div>
        </div>
      </div>
      <iframe id="electricalFrame" title="Sơ đồ điều khiển thiết bị điện" allow="fullscreen" allowfullscreen
        style="display:none;width:100%;height:calc(100vh - var(--topbar-h));border:0;"></iframe>
      <div id="kpiRoot" class="kpi-screen" style="display:none"></div>
      <div id="opRoot" class="op-screen" style="display:none"></div>
      <div id="docRoot" class="doc-screen" style="display:none"></div>
      <div id="invRoot" class="inv-screen" style="display:none"></div>
    </main>
  </div>

  <!-- ============ OVERLAYS / DRAWERS / MODALS / TOASTS ============ -->
  <div class="overlay" id="overlay"></div>

  <!-- Create / Assign drawer -->
  <aside class="drawer" id="createDrawer" role="dialog" aria-modal="true" aria-label="Tạo mới công việc"></aside>

  <!-- Detail drawer -->
  <aside class="drawer wide" id="detailDrawer" role="dialog" aria-modal="true" aria-label="Chi tiết công việc"></aside>

  <!-- Filter drawer -->
  <aside class="drawer filter-drawer" id="filterDrawer" role="dialog" aria-modal="true" aria-label="Bộ lọc nâng cao">
  </aside>

  <!-- Chỉ tiêu — detail drawer -->
  <aside class="drawer wide" id="kpiDrawer" role="dialog" aria-modal="true" aria-label="Chi tiết chỉ tiêu"></aside>
  <!-- Chỉ tiêu điều hành — detail drawer (theo SRS) -->
  <aside class="drawer wide" id="opDrawer" role="dialog" aria-modal="true" aria-label="Chi tiết tiêu chí"></aside>

  <div class="modal-wrap" id="modalWrap">
    <div class="modal" id="modal"></div>
  </div>
  <!-- Chỉ tiêu — modal riêng (giữ guard 'thay đổi chưa lưu' độc lập) -->
  <div class="modal-wrap" id="kpiModalWrap">
    <div class="modal" id="kpiModal"></div>
  </div>
  <!-- Chỉ tiêu điều hành — modal riêng -->
  <div class="modal-wrap" id="opModalWrap">
    <div class="modal" id="opModal"></div>
  </div>
  <div class="toast-wrap" id="toastWrap"></div>

  <script>
    /* =====================================================================
       KSmart iEdu — Phân hệ Công việc — Prototype (vanilla JS, mock data)
       ===================================================================== */
    "use strict";

    /* ---------- ICONS (Lucide outline) ---------- */
    const ICONS = {
      target: '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
      trendingUp: '<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>',
      barChart3: '<path d="M3 3v18h18"/><rect x="7" y="10" width="3" height="8"/><rect x="12" y="6" width="3" height="12"/><rect x="17" y="13" width="3" height="5"/>',
      clipboardMin: '<rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M8 12h8"/>',
      database: '<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/>',
      function2: '<path d="M9 4a2 2 0 0 0-2 2v3H5v2h2v7a2 2 0 0 0 2 2"/><path d="M13 8h6"/><path d="m14 21 6-8"/><path d="m14 13 6 8"/>',
